<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RObot-790 Session Map</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1014;
      --panel: #15191f;
      --panel-2: #10161b;
      --line: #303842;
      --text: #f2f5f8;
      --muted: #aab4bf;
      --green: #60d394;
      --gold: #ffd166;
      --blue: #68c7ff;
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(96, 211, 148, 0.07), transparent 220px),
        var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    button, input {
      font: inherit;
    }
    button {
      min-height: 34px;
      border: 1px solid rgba(96, 211, 148, 0.48);
      border-radius: 7px;
      background: rgba(96, 211, 148, 0.09);
      color: var(--text);
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: rgba(96, 211, 148, 0.18);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    button.primary {
      background: rgba(96, 211, 148, 0.18);
      color: #f4fff8;
    }
    button.warn {
      border-color: rgba(255, 209, 102, 0.52);
      background: rgba(255, 209, 102, 0.12);
    }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 58px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(96, 211, 148, 0.25);
      background: rgba(12, 16, 20, 0.94);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 850;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .status {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(4, auto);
      gap: 8px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(48, 56, 66, 0.8);
      background: rgba(13, 16, 20, 0.86);
    }
    #filter {
      min-height: 34px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #10141a;
      color: var(--text);
      padding: 7px 10px;
    }
    main {
      display: grid;
      grid-template-columns: minmax(330px, 0.9fr) minmax(360px, 1.2fr) minmax(360px, 1fr);
      gap: 10px;
      height: calc(100vh - 113px);
      padding: 10px 18px 16px;
      overflow: hidden;
    }
    section {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-top: 1px solid rgba(var(--accent), 0.32);
      border-left: 3px solid rgba(var(--accent), 0.72);
      background:
        linear-gradient(90deg, rgba(var(--accent), 0.13), transparent 70%),
        var(--panel);
    }
    section:nth-child(1) { --accent: 96, 211, 148; }
    section:nth-child(2) { --accent: 104, 199, 255; }
    section:nth-child(3) { --accent: 255, 209, 102; }
    h2 {
      margin: 0;
      padding: 10px 12px 8px;
      font-size: 13px;
      font-weight: 850;
      text-transform: uppercase;
      color: #eef3f6;
    }
    .list,
    .graph,
    .details {
      min-height: 0;
      overflow: auto;
      padding: 8px;
    }
    .session-row,
    .node {
      width: 100%;
      border: 1px solid rgba(160, 176, 190, 0.16);
      border-radius: 7px;
      background: rgba(9, 13, 17, 0.62);
      color: var(--text);
      text-align: left;
    }
    .session-row {
      display: grid;
      gap: 3px;
      margin-bottom: 8px;
      padding: 9px 10px;
    }
    .session-row.is-selected,
    .node.is-selected {
      border-color: rgba(96, 211, 148, 0.86);
      box-shadow: 0 0 0 1px rgba(96, 211, 148, 0.18) inset;
    }
    .session-title {
      overflow-wrap: anywhere;
      font-weight: 780;
      line-height: 1.25;
    }
    .session-meta,
    .session-path {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .session-path {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    .tree {
      display: grid;
      gap: 8px;
      align-content: start;
      min-width: min-content;
    }
    .branch {
      display: grid;
      gap: 8px;
      padding-left: 18px;
      border-left: 1px solid rgba(104, 199, 255, 0.25);
    }
    .root {
      padding-left: 0;
      border-left: 0;
    }
    .node {
      position: relative;
      min-width: 280px;
      padding: 8px 10px;
    }
    .node::before {
      content: "";
      position: absolute;
      left: -19px;
      top: 18px;
      width: 18px;
      border-top: 1px solid rgba(104, 199, 255, 0.25);
    }
    .root > .node::before {
      display: none;
    }
    .node.current {
      border-color: rgba(255, 209, 102, 0.82);
      background: rgba(255, 209, 102, 0.09);
    }
    .node.orphan {
      border-style: dashed;
    }
    .details {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 8px;
    }
    .detail-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .detail-grid {
      display: grid;
      gap: 5px;
      padding: 8px;
      border: 1px solid rgba(255, 209, 102, 0.18);
      border-radius: 7px;
      background: rgba(9, 12, 15, 0.46);
    }
    .preview {
      min-height: 0;
      margin: 0;
      padding: 10px;
      overflow: auto;
      border: 1px solid rgba(255, 209, 102, 0.18);
      border-radius: 7px;
      background: rgba(8, 10, 13, 0.70);
      color: #d8e0e8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    .empty {
      padding: 12px;
      color: var(--muted);
    }
    @media (max-width: 980px) {
      body { overflow: auto; }
      main {
        grid-template-columns: 1fr;
        height: auto;
        min-height: calc(100vh - 113px);
      }
      section {
        min-height: 320px;
      }
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }
      #filter {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>RObot-790 Session Map</h1>
    <div id="status" class="status">loading</div>
  </header>
  <div class="toolbar">
    <input id="filter" placeholder="Filter sessions" spellcheck="false">
    <button id="refresh" type="button">Refresh</button>
    <button id="selectInSts" type="button" disabled>Select In STS</button>
    <button id="connectInSts" class="primary" type="button" disabled>Connect In STS</button>
    <button id="archive" class="warn" type="button" disabled>Archive</button>
  </div>
  <main>
    <section>
      <h2>Sessions</h2>
      <div id="list" class="list"></div>
    </section>
    <section>
      <h2>Lineage</h2>
      <div id="graph" class="graph"></div>
    </section>
    <section>
      <h2>Selected</h2>
      <div id="details" class="details"></div>
    </section>
  </main>
  <script>
    const statusEl = document.querySelector("#status");
    const filterEl = document.querySelector("#filter");
    const refreshButton = document.querySelector("#refresh");
    const selectButton = document.querySelector("#selectInSts");
    const connectButton = document.querySelector("#connectInSts");
    const archiveButton = document.querySelector("#archive");
    const listEl = document.querySelector("#list");
    const graphEl = document.querySelector("#graph");
    const detailsEl = document.querySelector("#details");

    let sessions = [];
    let selectedFilename = "";
    let currentFilename = "";

    function noteBasename(filename) {
      const text = String(filename || "").trim();
      return text.split(/[\\/]/).pop() || text;
    }

    function sessionDisplayName(filename) {
      const base = noteBasename(filename)
        .replace(/\.txt$/i, "")
        .replace(/^session-/i, "")
        .replace(/^continuity-session-/i, "");
      const match = base.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})(?:-\d{3})?(?:-(.+))?$/);
      if (!match) return base;
      const [, year, month, day, hour, minute, second, caption] = match;
      const stamp = `${year}-${month}-${day} ${hour}:${minute}:${second}`;
      return caption ? `${caption.replace(/-/g, " ")} - ${stamp}` : stamp;
    }

    function normalizeFilename(filename) {
      return String(filename || "").replace(/\\/g, "/").trim();
    }

    function selectedSession() {
      const key = selectedFilename.toLowerCase();
      return sessions.find((item) => normalizeFilename(item.filename).toLowerCase() === key) || null;
    }

    function filteredSessions() {
      const query = filterEl.value.trim().toLowerCase();
      if (!query) return sessions;
      return sessions.filter((item) => [
        item.filename,
        item.parent_session_filename,
        sessionDisplayName(item.filename),
        item.created
      ].some((value) => String(value || "").toLowerCase().includes(query)));
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setSelected(filename) {
      selectedFilename = normalizeFilename(filename);
      render();
      void loadDetails();
    }

    async function apiJson(url, options = {}) {
      const response = await fetch(url, { cache: "no-store", ...options });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.status === "error") {
        throw new Error(result.error || `${response.status} ${response.statusText}`);
      }
      return result;
    }

    async function refreshSessions() {
      setStatus("refreshing");
      const result = await apiJson(new URL("/api/continuity/sessions", location.href));
      sessions = Array.isArray(result.sessions) ? result.sessions.map((item) => ({
        ...item,
        filename: normalizeFilename(item.filename),
        parent_session_filename: normalizeFilename(item.parent_session_filename)
      })) : [];
      currentFilename = normalizeFilename(result.current_session_filename);
      if (!selectedFilename || !sessions.some((item) => item.filename.toLowerCase() === selectedFilename.toLowerCase())) {
        selectedFilename = currentFilename || sessions[0]?.filename || "";
      }
      render();
      await loadDetails();
      setStatus(`${sessions.length} sessions`);
    }

    function render() {
      renderList();
      renderGraph();
      const hasSelection = Boolean(selectedSession());
      selectButton.disabled = !hasSelection;
      connectButton.disabled = !hasSelection;
      archiveButton.disabled = !hasSelection || sessions.length <= 1;
    }

    function renderList() {
      const items = filteredSessions();
      listEl.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matching sessions.";
        listEl.append(empty);
        return;
      }
      for (const item of items) {
        const button = document.createElement("button");
        button.className = "session-row";
        button.type = "button";
        button.classList.toggle("is-selected", item.filename.toLowerCase() === selectedFilename.toLowerCase());
        button.addEventListener("click", () => setSelected(item.filename));
        const title = document.createElement("span");
        title.className = "session-title";
        title.textContent = `${item.filename === currentFilename ? "* " : ""}${sessionDisplayName(item.filename)}`;
        const meta = document.createElement("span");
        meta.className = "session-meta";
        meta.textContent = `${item.created || "undated"} / ${Number(item.characters || 0).toLocaleString()} chars`;
        const path = document.createElement("span");
        path.className = "session-path";
        path.textContent = item.filename;
        button.append(title, meta, path);
        listEl.append(button);
      }
    }

    function renderGraph() {
      graphEl.replaceChildren();
      const items = filteredSessions();
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No lineage to show.";
        graphEl.append(empty);
        return;
      }
      const visible = new Map(items.map((item) => [item.filename.toLowerCase(), item]));
      const children = new Map();
      for (const item of items) {
        const parentKey = normalizeFilename(item.parent_session_filename).toLowerCase();
        if (!children.has(parentKey)) children.set(parentKey, []);
        children.get(parentKey).push(item);
      }
      const roots = items.filter((item) => {
        const parent = normalizeFilename(item.parent_session_filename);
        return !parent || !visible.has(parent.toLowerCase());
      });
      const tree = document.createElement("div");
      tree.className = "tree";
      const visited = new Set();
      const orderedRoots = roots.length ? roots : items;
      for (const root of orderedRoots) {
        tree.append(renderBranch(root, children, visited, true));
      }
      graphEl.append(tree);
    }

    function renderBranch(item, children, visited, isRoot = false) {
      const key = item.filename.toLowerCase();
      const branch = document.createElement("div");
      branch.className = `branch${isRoot ? " root" : ""}`;
      if (visited.has(key)) return branch;
      visited.add(key);
      branch.append(renderNode(item));
      const kids = children.get(key) || [];
      for (const child of kids) {
        branch.append(renderBranch(child, children, visited));
      }
      return branch;
    }

    function renderNode(item) {
      const node = document.createElement("button");
      node.type = "button";
      node.className = "node";
      node.classList.toggle("current", item.filename === currentFilename);
      node.classList.toggle("is-selected", item.filename.toLowerCase() === selectedFilename.toLowerCase());
      node.classList.toggle("orphan", Boolean(item.parent_session_filename)
        && !sessions.some((candidate) => candidate.filename.toLowerCase() === item.parent_session_filename.toLowerCase()));
      node.addEventListener("click", () => setSelected(item.filename));
      const title = document.createElement("div");
      title.className = "session-title";
      title.textContent = sessionDisplayName(item.filename);
      const path = document.createElement("div");
      path.className = "session-path";
      path.textContent = item.filename;
      node.append(title, path);
      return node;
    }

    async function loadDetails() {
      const item = selectedSession();
      detailsEl.replaceChildren();
      if (!item) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Select a session.";
        detailsEl.append(empty);
        return;
      }
      const actions = document.createElement("div");
      actions.className = "detail-actions";
      const openButton = document.createElement("button");
      openButton.type = "button";
      openButton.textContent = "Open Note";
      openButton.addEventListener("click", () => {
        window.open(`/api/notes/read?filename=${encodeURIComponent(item.filename)}`, "_blank", "noopener");
      });
      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.textContent = "Copy Path";
      copyButton.addEventListener("click", () => navigator.clipboard?.writeText(item.filename));
      const parentButton = document.createElement("button");
      parentButton.type = "button";
      parentButton.textContent = "Parent";
      parentButton.disabled = !item.parent_session_filename;
      parentButton.addEventListener("click", () => setSelected(item.parent_session_filename));
      actions.append(openButton, copyButton, parentButton);

      const grid = document.createElement("div");
      grid.className = "detail-grid";
      for (const [label, value] of [
        ["Name", sessionDisplayName(item.filename)],
        ["File", item.filename],
        ["Parent", item.parent_session_filename || "none"],
        ["Created", item.created || "unknown"],
        ["Size", `${Number(item.characters || 0).toLocaleString()} chars`],
      ]) {
        const row = document.createElement("div");
        row.innerHTML = `<strong>${label}:</strong> `;
        const span = document.createElement("span");
        span.textContent = value;
        row.append(span);
        grid.append(row);
      }

      const preview = document.createElement("pre");
      preview.className = "preview";
      preview.textContent = "loading";
      detailsEl.append(actions, grid, preview);
      try {
        const url = new URL("/api/notes/read", location.href);
        url.searchParams.set("filename", item.filename);
        const note = await apiJson(url);
        preview.textContent = String(note.content || "").slice(0, 24000);
      } catch (error) {
        preview.textContent = `Could not load preview: ${error.message}`;
      }
    }

    function postToSts(action) {
      const item = selectedSession();
      if (!item) return;
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: "robot790-continuity-session-map",
          action,
          filename: item.filename
        }, location.origin);
        setStatus(`${action} sent to STS`);
      } else {
        navigator.clipboard?.writeText(item.filename);
        setStatus("no STS opener; copied filename");
      }
    }

    async function selectInSts() {
      const item = selectedSession();
      if (!item) return;
      await apiJson(new URL("/api/continuity/select", location.href), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_filename: item.filename })
      });
      postToSts("select");
    }

    async function archiveSelected() {
      const item = selectedSession();
      if (!item) return;
      if (!confirm(`Move "${sessionDisplayName(item.filename)}" out of Connect Select?`)) return;
      setStatus("archiving");
      await apiJson(new URL("/api/continuity/archive", location.href), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_filename: item.filename })
      });
      postToSts("refresh");
      selectedFilename = "";
      await refreshSessions();
    }

    refreshButton.addEventListener("click", () => refreshSessions().catch((error) => setStatus(error.message)));
    filterEl.addEventListener("input", render);
    selectButton.addEventListener("click", () => selectInSts().catch((error) => setStatus(error.message)));
    connectButton.addEventListener("click", () => postToSts("connect"));
    archiveButton.addEventListener("click", () => archiveSelected().catch((error) => setStatus(error.message)));

    refreshSessions().catch((error) => setStatus(error.message));
  </script>
</body>
</html>
