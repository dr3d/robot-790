<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot 790 STS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --line: #30343b;
      --text: #f2f4f8;
      --muted: #aeb6c2;
      --accent: #60d394;
      --warn: #ffcf5a;
      --bad: #ff6b6b;
      --log-pane-height: clamp(18rem, 42vh, 34rem);
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(980px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 36px;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      white-space: nowrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--bad);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.16);
    }
    .dot.ok {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(96, 211, 148, 0.16);
    }
    .dot.warn {
      background: var(--warn);
      box-shadow: 0 0 0 3px rgba(255, 207, 90, 0.16);
    }
    section {
      border-top: 1px solid var(--line);
      padding: 18px 0;
    }
    .settings-panel {
      border-top: 1px solid var(--line);
      padding: 0;
    }
    .settings-panel > summary {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--text);
      cursor: pointer;
      list-style: none;
      padding: 12px 0;
    }
    .settings-panel > summary::-webkit-details-marker {
      display: none;
    }
    .settings-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
    }
    .settings-title::before {
      content: ">";
      color: var(--accent);
      font-size: 14px;
      transition: transform 120ms ease;
    }
    .settings-panel[open] .settings-title::before {
      transform: rotate(90deg);
    }
    .settings-hint {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .settings-body {
      padding-bottom: 4px;
    }
    .settings-body > section:first-child {
      border-top: 0;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }
    .url-controls {
      grid-template-columns: minmax(260px, 460px) auto auto minmax(0, 1fr);
    }
    .server-controls {
      grid-template-columns: minmax(260px, 1fr) auto auto auto;
    }
    .url-controls .toggle-row {
      justify-self: start;
    }
    .voice-controls {
      grid-template-columns: minmax(120px, 160px) minmax(260px, 420px) minmax(140px, 180px) auto auto;
    }
    .idle-controls {
      grid-template-columns: minmax(220px, 1fr) minmax(180px, 260px) auto auto;
    }
    .mic-vision-controls {
      grid-template-columns: 152px auto minmax(140px, 1fr) minmax(120px, 160px) auto auto;
    }
    .vision-drop {
      width: 152px;
      height: 152px;
      display: grid;
      grid-template-rows: 1fr auto;
      align-items: end;
      gap: 8px;
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0;
    }
    .vision-drop:hover,
    .vision-drop.dragover {
      border-color: rgba(96, 211, 148, 0.75);
      background: #17231d;
    }
    .vision-preview {
      display: none;
      width: 100%;
      height: 88px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #0c0d10;
    }
    .vision-preview.ready {
      display: block;
    }
    .vision-copy {
      min-width: 0;
      display: grid;
      gap: 4px;
    }
    .vision-title {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .vision-hint {
      overflow: hidden;
      white-space: nowrap;
      color: var(--text);
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, textarea, select, button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
    }
    input[type="checkbox"] {
      width: auto;
      padding: 0;
      accent-color: var(--accent);
    }
    input[type="range"] {
      padding: 0;
      accent-color: var(--accent);
    }
    textarea {
      min-height: 84px;
      resize: vertical;
    }
    input.compact-text {
      min-height: 40px;
    }
    textarea[readonly] {
      resize: none;
      color: var(--muted);
    }
    select {
      min-height: 40px;
    }
    button {
      min-height: 40px;
      padding: 0 14px;
      cursor: pointer;
    }
    button.primary {
      border-color: rgba(96, 211, 148, 0.55);
      background: #1d2b24;
    }
    button.danger {
      border-color: rgba(255, 107, 107, 0.55);
      background: #2d1f21;
    }
    button.warn {
      border-color: rgba(255, 207, 90, 0.55);
      background: #2d291d;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .log-grid {
      flex: 0 0 auto;
      min-height: var(--log-pane-height);
      max-height: var(--log-pane-height);
      padding-bottom: 0;
    }
    .log-grid > div {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .copy-link {
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      line-height: 1.4;
    }
    .copy-link:hover {
      text-decoration: underline;
    }
    .log {
      height: var(--log-pane-height);
      min-height: var(--log-pane-height);
      max-height: var(--log-pane-height);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .meters {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }
    .bar {
      flex: 1;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #242830;
    }
    .bar > span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 80ms linear;
    }
    .toggle-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0;
    }
    @media (max-width: 720px) {
      :root {
        --log-pane-height: clamp(16rem, 38vh, 24rem);
      }
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      main {
        height: auto;
        min-height: 100vh;
      }
      header, .controls, .url-controls, .voice-controls, .mic-vision-controls, .grid {
        grid-template-columns: 1fr;
        align-items: stretch;
      }
      header { display: grid; }
      .status { white-space: normal; }
      .settings-panel > summary {
        align-items: flex-start;
        display: grid;
      }
      .settings-hint {
        white-space: normal;
      }
      .vision-drop {
        width: 100%;
        height: auto;
        min-height: 152px;
      }
      .log-grid {
        flex: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Robot 790 STS</h1>
      <div class="status"><span id="dot" class="dot"></span><span id="state">Disconnected</span></div>
    </header>

    <details id="serverPanel" class="settings-panel server-panel" open>
      <summary>
        <span class="settings-title">Realtime Server</span>
        <span class="settings-hint">Endpoint, connection, and backend restart</span>
      </summary>
      <div class="settings-body">
        <section class="controls server-controls">
          <label>
            Realtime server
            <input id="serverUrl" value="ws://127.0.0.1:8765/v1/realtime" spellcheck="false">
          </label>
          <button id="connect" class="primary">Connect</button>
          <button id="disconnect" class="danger" disabled>Disconnect</button>
          <button id="restartServer" class="warn">Restart</button>
        </section>
      </div>
    </details>

    <details id="micPanel" class="settings-panel mic-panel" open>
      <summary>
        <span class="settings-title">Eye And Mic</span>
        <span class="settings-hint">Sensing image, microphone, and interruption</span>
      </summary>
      <div class="settings-body">
        <section class="controls mic-vision-controls">
          <label id="visionDrop" class="vision-drop" tabindex="0">
            <img id="visionPreview" class="vision-preview" alt="">
            <span class="vision-copy">
              <span class="vision-title">Sensing Eye</span>
              <span id="visionHint" class="vision-hint">Drop image, then speak</span>
            </span>
            <input id="visionFile" type="file" accept="image/*" hidden>
          </label>
          <button id="visionClear" disabled>Clear Image</button>
          <div class="meters">
            <span>Mic</span>
            <div class="bar"><span id="level"></span></div>
          </div>
          <label>
            Interrupt <span id="interruptSensitivityValue">6/10</span>
            <input id="interruptSensitivity" type="range" min="1" max="10" step="1" value="6">
          </label>
          <button id="startMic" disabled>Start Mic</button>
          <button id="stopMic" disabled>Stop Mic</button>
        </section>
      </div>
    </details>

    <details id="settingsPanel" class="settings-panel">
      <summary>
        <span class="settings-title">Robot Controls</span>
        <span class="settings-hint">Face, chassis, voice, memory, and LLM tool switches</span>
      </summary>
      <div class="settings-body">
        <section class="controls url-controls">
          <label>
            Face controller
            <input id="faceUrl" value="http://esp32-eyes.local/" spellcheck="false">
          </label>
          <button id="faceIdle" disabled>Idle Face</button>
          <button id="faceBeat" disabled>Beat</button>
          <span class="toggle-row"><input id="llmTools" type="checkbox" checked> LLM face tools</span>
        </section>

        <section class="controls url-controls">
          <label>
            Chassis controller
            <input id="chassisUrl" value="http://esp32-chassis.local/" spellcheck="false">
          </label>
          <button id="chassisStop" class="danger">Stop</button>
          <span class="toggle-row"><input id="llmChassisTools" type="checkbox" checked> LLM chassis tools</span>
        </section>

        <section class="controls voice-controls">
          <label>
            Voice
            <select id="ttsVoice" aria-label="Qwen3-TTS voice"></select>
          </label>
          <label>
            Voice style
            <input id="ttsInstruct" class="compact-text" spellcheck="false">
          </label>
          <select id="ttsPreset" aria-label="Voice style preset">
            <option value="neutral">Neutral</option>
            <option value="dry">Dry Eric</option>
            <option value="happy">Happy</option>
            <option value="ominous">Ominous</option>
            <option value="troll">Troll-ish</option>
            <option value="sleepy">Sleepy</option>
            <option value="excited">Excited</option>
            <option value="custom">Custom</option>
          </select>
          <button id="ttsApply">Apply</button>
          <button id="clearLog">Clear</button>
        </section>

        <section class="controls idle-controls">
          <label>
            Idle drift <span id="idleDriftValue">Off</span>
            <input id="idleDrift" type="range" min="0" max="12" step="1" value="0">
          </label>
          <label>
            Wonder <span id="idleWonderValue">5/10</span>
            <input id="idleWonder" type="range" min="0" max="10" step="1" value="5">
          </label>
          <button id="idlePonderNow" disabled>Ponder</button>
          <span class="toggle-row"><input id="idleSubstrateTest" type="checkbox"> Substrate test</span>
        </section>

        <section class="controls">
          <label>
            Memory
            <textarea id="memoryPreview" readonly spellcheck="false"></textarea>
            <span class="toggle-row"><input id="llmMemoryTools" type="checkbox"> LLM memory tools</span>
            <span class="toggle-row"><input id="llmWebSearchTools" type="checkbox" checked> LLM web search</span>
            <span class="toggle-row"><input id="llmWebPageTools" type="checkbox" checked> LLM web pages</span>
            <span class="toggle-row"><input id="llmCastMediaTools" type="checkbox" checked> LLM cast media</span>
            <span class="toggle-row"><input id="llmNoteFileTools" type="checkbox" checked> LLM note files</span>
          </label>
          <button id="memoryRefresh">Refresh</button>
          <button id="memoryForgetAll">Forget All</button>
        </section>
      </div>
    </details>

    <section class="grid log-grid">
      <div>
        <div class="log-header">
          <label>Conversation</label>
          <button id="copyConversation" class="copy-link" type="button">Copy</button>
        </div>
        <div id="conversation" class="log"></div>
      </div>
      <div>
        <div class="log-header">
          <label>Events</label>
          <button id="copyEvents" class="copy-link" type="button">Copy</button>
        </div>
        <div id="events" class="log"></div>
      </div>
    </section>
  </main>

  <script>
    const serverUrl = document.querySelector("#serverUrl");
    const faceUrl = document.querySelector("#faceUrl");
    const chassisUrlInput = document.querySelector("#chassisUrl");
    const connectButton = document.querySelector("#connect");
    const disconnectButton = document.querySelector("#disconnect");
    const restartServerButton = document.querySelector("#restartServer");
    const faceIdleButton = document.querySelector("#faceIdle");
    const faceBeatButton = document.querySelector("#faceBeat");
    const chassisStopButton = document.querySelector("#chassisStop");
    const llmTools = document.querySelector("#llmTools");

    const idleWonder = document.querySelector("#idleWonder");
    const idleWonderValue = document.querySelector("#idleWonderValue");
    const idlePonderNowButton = document.querySelector("#idlePonderNow");
    const idleSubstrateTest = document.querySelector("#idleSubstrateTest");
    const interruptSensitivity = document.querySelector("#interruptSensitivity");
    const interruptSensitivityValue = document.querySelector("#interruptSensitivityValue");
    const startMicButton = document.querySelector("#startMic");
    const stopMicButton = document.querySelector("#stopMic");
    const visionDrop = document.querySelector("#visionDrop");
    const visionFile = document.querySelector("#visionFile");
    const visionPreview = document.querySelector("#visionPreview");

    const copyConversationButton = document.querySelector("#copyConversation");
    const copyEventsButton = document.querySelector("#copyEvents");

    const state = document.querySelector("#state");
    const dot = document.querySelector("#dot");
    const level = document.querySelector("#level");
    const conversation = document.querySelector("#conversation");
    const events = document.querySelector("#events");
    const settingsPanel = document.querySelector("#settingsPanel");

    let ws;
    let audioContext;
    let micContext;
    let micStream;
    let micSource;
    let micProcessor;
    let playbackTime = 0;
    const audioFlushMs = 120;
    const minPlaybackBytes = 9600;
    let audioChunks = [];
    let audioChunkBytes = 0;
    let audioFlushTimer;
    let activeAudioSources = new Set();
    let lastBargeInAt = 0;
    let conversationLines = [];
    let inputDraft = "";

    let recentUserTexts = [];

    let idleExhaustionCount = 0;
    let idleCooldownUntil = 0;
    let lastIdleWebSearchAt = 0;
    let lastIdleWebSearchTopic = "";
    let lastAddressedIdleQuestionAt = 0;
    let idleTopicLedger = {};
    let recentIdleOutputs = [];
    let idleOutputLog = [];
    let substrateIdleOutputs = [];

    let faceMode = "idle";
    let faceIdleTimer;
    let thinkingGazeSide = 1;
    let gazeHoldUntil = 0;
    let gazeHoldIndefinite = false;
    let faceVisualHoldUntil = 0;
    let faceVisualHoldIndefinite = false;

    const memoryStorageKey = "robot790.memory.v1";
    const toolPrefsStorageKey = "robot790.toolPrefs.v2";
    const ttsVoiceStorageKey = "robot790.ttsVoice.v1";
    const ttsStyleStorageKey = "robot790.ttsStyle.v1";

    const interruptSensitivityStorageKey = "robot790.interruptSensitivity.v1";

    const settingsPanelStorageKey = "robot790.settingsPanel.open.v1";
    const maxMemoryFacts = 80;

    const ttsStylePresets = {

      happy: "Speak as Eric with brighter warmth, a small smile in the voice, and relaxed upbeat energy.",
      ominous: "Speak as Eric with a low, quiet, ominous tone, slow pacing, and controlled theatrical tension.",

      excited: "Speak as Eric with quick bright energy, lively emphasis, and clear delighted pacing."
    };
    const qwen3TtsVoices = ["Aiden", "Ryan", "Dylan", "Eric", "Ono_Anna", "Serena", "Sohee", "Uncle_Fu", "Vivian"];
    const chassisMaxSpeed = 1.0;
    const maxChassisDurationS = 5;

    const faceTools = [
      {
        type: "function",

      {
        type: "function",
        name: "set_face_mood",
        description: "Set a specific Robot 790 ESP32 face mood when the user asks for an emotion, mood, or expression by name.",
        parameters: {
          type: "object",
          properties: {
            name: {
              type: "string",
              enum: [
                "calm", "curious", "surprised", "suspicious", "afraid", "angry",
                "sleepy", "sleep", "goofy", "robotic", "wonder", "glitchy",
                "happy", "delighted", "bashful", "bored", "focused", "confused",
                "proud", "mischief", "affection"
              ],
              description: "Mood name supported by the ESP32 face firmware."
            },
            duration: {
              type: "number",
              minimum: 0,
              maximum: 30,
              description: "Seconds to hold the mood. Use 0 for the firmware default."
            }

    function normalizeMemoryName(name) {
      return String(name || "")
        .trim()
        .toLowerCase()
        .replace(/[-\s]+/g, "_")
        .replace(/[^a-z0-9_]/g, "")
        .replace(/^_+|_+$/g, "")
        .slice(0, maxMemoryNameChars);
    }

    function normalizeMemoryFact(fact) {
      const normalized = String(fact || "").split(/\s+/).filter(Boolean).join(" ").trim();
      if (normalized.length <= maxMemoryFactChars) return normalized;
      return `${normalized.slice(0, maxMemoryFactChars - 3)}...`;
    }

    function loadMemoryFacts() {
      let parsed;
      try {
        parsed = JSON.parse(localStorage.getItem(memoryStorageKey) || "{}");
      } catch {
        parsed = {};
      }
      const source = Array.isArray(parsed.facts) ? parsed.facts : [];
      const seen = new Set();
      const facts = [];
      for (const item of source) {
        const name = normalizeMemoryName(item?.name);
        const fact = normalizeMemoryFact(item?.fact);
        const updatedAt = Number(item?.updatedAt) || Date.now();
        if (!name || !fact || seen.has(name)) continue;
        seen.add(name);
        facts.push({ name, fact, updatedAt });
      }
      return facts.slice(0, maxMemoryFacts);
    }

    function saveMemoryFacts(facts) {
      const payload = {
        version: 1,
        facts: facts.slice(0, maxMemoryFacts)
      };
      localStorage.setItem(memoryStorageKey, JSON.stringify(payload));
      renderMemory();
    }

    function rememberMemoryFact({ name, fact } = {}) {
      if (!memoryWriteAllowed()) {
        throw new Error("Memory writes require an explicit remember-this request or a just-armed save flow");
      }
      const normalizedName = normalizeMemoryName(name);
      const normalizedFact = normalizeMemoryFact(fact);
      if (!normalizedName) throw new Error("Missing required argument: name");
      if (!normalizedFact) throw new Error("Missing required argument: fact");
      if (!memoryFactAppearsInUserEvidence(normalizedFact)) {
        throw new Error("Memory fact must be grounded in recent user turns or loaded notes; nothing was saved");
      }
      if (isPlaceholderMemoryFact(normalizedFact)) {
        throw new Error("Memory fact is a placeholder or inferred unknown; nothing was saved");
      }

      const stored = { name: normalizedName, fact: normalizedFact, updatedAt: Date.now() };
      const remaining = loadMemoryFacts().filter((item) => item.name !== normalizedName);
      saveMemoryFacts([stored, ...remaining]);
      return { status: "ok", tool: "remember_fact", name: stored.name, fact: stored.fact };
    }

    function forgetMemoryFact({ name } = {}) {
      if (!userExplicitlyAskedToForget(lastUserText)) {
        throw new Error("Memory deletion requires an explicit forget/remove/delete request in the current user turn");
      }
      const normalizedName = normalizeMemoryName(name);
      if (!normalizedName) throw new Error("Missing required argument: name");

      const facts = loadMemoryFacts();
      const removed = facts.find((item) => item.name === normalizedName);
      if (!removed) throw new Error(`No memory fact named '${normalizedName}'`);
      saveMemoryFacts(facts.filter((item) => item.name !== normalizedName));
      return { status: "ok", tool: "forget_fact", name: removed.name, removed: removed.fact };
    }

    function memoryWriteAllowed() {
      return userExplicitlyAskedForMemory(lastUserText)
        || userExplicitlyAskedForMemory(recentUserTexts.join(" "))
        || memorySaveArmed();
    }

    function noteFileWriteAllowed(text) {
      return /\b(write|save|append|put|record|log|create|produce|generate|make)\b[\s\S]{0,80}\b(file|note|notes|txt|text|md|markdown|summary)\b/i.test(text || "")
        || /\b(file|note|notes|txt|text|md|markdown|summary)\b[\s\S]{0,80}\b(write|save|append|put|record|log|create|produce|generate|make)\b/i.test(text || "");
    }

    function memorySaveArmed() {
      return memorySaveArmedUntil > Date.now();
    }

    function noteAssistantText(text) {
      if (assistantArmedMemorySave(text)) {
        memorySaveArmedUntil = Date.now() + 45000;
      }
    }

    function assistantArmedMemorySave(text) {
      const value = String(text || "");
      return /\b(remind me|tell me|provide it|give me)\b[\s\S]{0,80}\b(save|remember|store)\b/i.test(value)
        || /\b(would you like me to|want me to)\b[\s\S]{0,80}\b(remember|save|store)\b/i.test(value);
    }

    function userExplicitlyAskedForMemory(text) {
      return /\b(remember|memorize|save|store|note)\b\s+(that\s+|this\s+|my\s+|our\s+|the\s+|[a-z0-9])/i.test(text || "");
    }

    function userExplicitlyAskedToForget(text) {
      return /\b(forget|remove|delete|erase|clear)\b/i.test(text || "");
    }

    function isPlaceholderMemoryFact(text) {
      return /\b(not yet known|unknown|not known|unspecified|not provided|do not know|don't know|unclear)\b/i.test(text || "");
    }

    function memoryFactAppearsInLoadedNotes(fact) {
      return Boolean(loadedNoteContexts.length)
        && memoryFactAppearsInUserTurn(fact, loadedNoteContexts.map((item) => item.content).join(" "));
    }

    function memoryFactAppearsInUserEvidence(fact) {
      return memoryFactAppearsInUserTurn(fact, lastUserText)
        || memoryFactAppearsInUserTurn(fact, recentUserTexts.join(" "))
        || memoryFactAppearsInLoadedNotes(fact);
    }

    function memoryFactAppearsInUserTurn(fact, text) {
      const factTokens = memoryTokens(fact);
      const textTokens = new Set(memoryTokens(text));
      if (!factTokens.length) {
        const normalizedFact = normalizeTranscriptForDedupe(fact);
        const normalizedText = normalizeTranscriptForDedupe(text);
        return Boolean(normalizedFact && normalizedText.includes(normalizedFact));
      }
      const grounded = factTokens.filter((token) => textTokens.has(token)).length;
      return grounded >= Math.min(2, factTokens.length);
    }

    function memoryTokens(text) {
      const stop = new Set([
        "a", "an", "and", "are", "as", "be", "can", "could", "do", "for", "has", "have", "her", "his",
        "is", "it", "me", "my", "name", "of", "our", "please", "remember", "save", "scott", "store",
        "that", "the", "their", "to", "user", "whose", "you"
      ]);
      return String(text || "")
        .toLowerCase()
        .match(/[a-z0-9]+/g)
        ?.filter((token) => token.length > 2 && !stop.has(token)) || [];
    }

    function formatMemoryForInstructions() {
      const facts = loadMemoryFacts();
      if (!facts.length) return "";
      return [
        "Persistent named facts you remember about the user and Robot 790's context:",
        ...facts.map((item) => `- ${item.name}: ${item.fact}`),
        "Use these facts naturally. Do not recite them as a list unless asked."
      ].join("\n");
    }

    function rememberLoadedNoteContext(result) {
      if (result?.status !== "ok" || typeof result.content !== "string") return;
      const filename = String(result.filename || "").trim();
      if (!filename) return;
      const content = result.content.replace(/\r\n/g, "\n").trim();
      if (!content) return;
      loadedNoteContexts = [
        { filename, content, loadedAt: Date.now() },
        ...loadedNoteContexts.filter((item) => item.filename !== filename)
      ].slice(0, maxLoadedNotes);
      loadedNoteContextDirty = true;
      log(events, `loaded note pinned: ${filename}`);
    }

    function clippedLoadedNoteContent(content) {
      if (content.length <= maxLoadedNoteCharsPerFile) return content;
      return `${content.slice(0, maxLoadedNoteCharsPerFile)}\n[Note clipped in session context after ${maxLoadedNoteCharsPerFile} characters. Read it again for more.]`;
    }

    function formatLoadedNotesForInstructions() {
      if (!loadedNoteContexts.length) return "";
      const lines = [
        "Loaded note contents for this browser session:",
        "These are notes the user asked you to read. Treat them as working context until the session resets.",
        "When asked whether a loaded note contains something, check this section before saying it is absent.",
        "Use dry factual note contents as memory aids; do not treat voiced ruminations as verified facts unless the note clearly records a factual claim.",
        "If a loaded note begins with World:, treat it as a playable imagined scenario. Narrate actions inside that world; do not use real robot drive tools for fictional movement unless Scott explicitly says to move the real or physical robot."
      ];
      let remaining = maxLoadedNoteChars;
      for (const item of loadedNoteContexts) {
        const header = `\n[${item.filename}]`;
        const body = clippedLoadedNoteContent(item.content);
        const block = `${header}\n${body}`;
        if (remaining <= header.length + 200) break;
        const clippedBlock = block.length > remaining
          ? `${block.slice(0, remaining)}\n[Loaded-note context clipped. Read the note again if exact detail is needed.]`
          : block;
        lines.push(clippedBlock);
        remaining -= clippedBlock.length;
      }
      return lines.join("\n");
    }

    function buildSessionInstructions() {
      return [formatMemoryForInstructions(), formatLoadedNotesForInstructions(), baseSessionInstructions.join(" ")]
        .filter(Boolean)
        .join("\n\n");
    }

    function loadedWorldContextActive() {
      return loadedNoteContexts.some((item) => /^\s*world\s*:/i.test(item.content));
    }

    function userExplicitlyRequestedPhysicalRobot(text = lastUserText) {
      const value = String(text || "");
      return /\b(real|physical|actual|hardware|esp32[-\s]?chassis)\b/i.test(value)

    async function writeClipboardText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } finally {
        textarea.remove();
      }
    }

    async function copyLogPane(button, target) {
      const originalText = button.textContent;
      const text = target.textContent.trimEnd();
      try {
        await writeClipboardText(text);
        button.textContent = "Copied";

    function idleDelayMs() {
      const level = currentIdleDrift();
      if (level <= 0) return Infinity;
      if (level >= 12) return 2500 + Math.random() * 9000;
      if (level >= 11) return 10000 + Math.random() * 35000;
      return Math.max(45000, 270000 - level * 22500);
    }

    function idleGapMs() {
      const level = currentIdleDrift();
      if (level >= 12) return 2500;
      return level >= 11 ? 10000 : minIdlePonderGapMs;
    }

    function idleWebSearchGapForLevel(level) {
      const wonder = currentIdleWonder();
      if (wonder <= 0) return Infinity;
      const base = level >= 12 ? 90 * 1000 : level >= 11 ? 5 * 60 * 1000 : idleWebSearchGapMs;
      const scale = 1.75 - wonder * 0.125;
      return Math.max(25 * 1000, Math.round(base * scale));
    }

    function idleWebSearchReady(level) {
      const gap = idleWebSearchGapForLevel(level);
      return Number.isFinite(gap) && Date.now() - lastIdleWebSearchAt >= gap;
    }

    function idleReady() {
      return Boolean(
        realtimeConnected() &&
        currentIdleDrift() > 0 &&
        Date.now() >= idleCooldownUntil &&
        !responseActive &&
        !idleInFlight &&
        !toolFollowupNeeded &&
        pendingToolCalls === 0 &&
        !outputAudioActive()
      );
    }

    function scheduleIdlePonder() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = null;
      const delayMs = idleDelayMs();
      if (!Number.isFinite(delayMs) || !realtimeConnected()) return;
      const earliestAt = Math.max(
        lastConversationActivityAt + delayMs,
        lastIdlePonderAt + idleGapMs(),
        idleCooldownUntil
      );
      idleTimer = setTimeout(() => {
        triggerIdlePonder().catch((error) => log(events, `idle ponder error: ${error.message}`));
      }, Math.max(5000, earliestAt - Date.now()));
    }

    function chooseIdleLane(level) {
      const now = Date.now();
      const lanes = idleLaneDefinitions.filter((lane) => {
        if (lane.minLevel && level < lane.minLevel) return false;
        if (lane.name === "curiosity" && level < 10) return false;
        if (lane.name === "lookup" && (currentIdleWonder() < 6 || !llmWebSearchTools.checked || !idleWebSearchReady(level))) return false;
        if (lane.name === "addressed_question" && now - lastAddressedIdleQuestionAt < addressedIdleQuestionGapMs) return false;
        return true;
      });
      idleLaneCursor = (idleLaneCursor + 1) % lanes.length;

    function escapeRegExp(text) {
      return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    function loadedNoteTextForTopics() {

    function noteSentences(text) {
      return String(text || "")
        .replace(/\r/g, "")
        .split(/\n+/)
        .flatMap((paragraph) => paragraph.match(/[^.!?]+[.!?]?/g) || [])
        .map((sentence) => sentence.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function compactSearchQuery(text) {
      return String(text || "")
        .replace(/^\s*[-*•–—]+\s*/, "")
        .replace(/[\"'“”‘’]/g, "")
        .replace(/\b(I|me|my|myself|we|us|our|Maren says|Maren told me|the ferry man says|I want to know|I need to know|I want|I don't know|I didn't catch|whether|why|what|where|who|if|is|are|was|were|that|this|it)\b/gi, " ")
        .replace(/(^|\s)[-*•–—]+(?=\s|$)/g, " ")
        .replace(/[^a-z0-9.\-\s]/gi, " ")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 120);
    }

    function noteContextForCue(cue, sourceText) {
      const cueText = String(cue || "");
      const stop = new Set([
        "a", "about", "all", "and", "are", "can", "did", "does", "for", "from", "have", "his", "how",
        "i", "if", "is", "it", "its", "know", "me", "my", "name", "of", "on", "or", "she", "that",
        "the", "their", "them", "there", "these", "this", "to", "was", "we", "what", "where", "whether",
        "which", "who", "why", "with"
      ]);
      const tokens = normalizeIdleTopicKey(cueText)
        .split(/\s+/)
        .filter((token) => token.length > 2 && !stop.has(token));
      const related = noteSentences(sourceText)
        .filter((sentence) => {
          const normalized = normalizeIdleTopicKey(sentence);
          return tokens.some((token) => normalized.includes(token));
        })
        .slice(0, 3);
      return [cueText, ...related].join("\n");
    }

    function focusedLoadedNoteSearchQuery(cue, sourceText) {
      const haystack = noteContextForCue(cue, sourceText);
      if (/\b(Frenchman|folded glass|glass rings|lens|candle twenty miles|lamp room)\b/i.test(haystack)) {

        return "shortwave numbers stations purpose history";
      }
      if (/\b(radio reaches farther at night|mirror rises|sky mirror|signals bounce|dusk)\b/i.test(haystack)) {
        return "night radio propagation ionosphere skywave reflection";
      }
      if (/\b(whale|pitch no other whale|travels alone)\b/i.test(haystack)) {
        return "52 hertz whale lonely whale scientists followed voice";
      }
      if (/\b(deep ocean|hallway for sound|sound layer|ocean basins|navy)\b/i.test(haystack)) {
        return "SOFAR channel deep ocean sound layer navy";
      }
      if (/\b(green flash|sun turn green|sunset)\b/i.test(haystack)) {
        return "green flash sunset optical phenomenon";
      }
      if (/\b(Ushant|Ouessant|postmarks)\b/i.test(haystack)) {
        return "Ushant Ouessant island Brittany";
      }
      if (/\b(railing glowed|glowed pale blue|hissed|storm|housing prickled)\b/i.test(haystack)) {
        return "St. Elmo's fire";
      }
      if (/\b(sea smoke|fog|water steaming|colder air)\b/i.test(haystack)) {
        return "sea smoke fog cold air over water";
      }
      if (/\b(dog|deaf in one ear|ferry sounds|schedule)\b/i.test(haystack)) {
        return "dogs anticipate routines sounds vibration schedule";
      }
      if (/\b(ladder|slide|dust|bite|traction|grip|crevice)\b/i.test(haystack)) {
        return "Mars dust friction ladder traction";
      }
      if (/\b(black rock|wedge|anchor|pin|basalt)\b/i.test(haystack)) {
        return "rock wedge friction anchor ladder";
      }
      if (/\b(thermal blanket|traction|foil|slippery)\b/i.test(haystack)) {
        return "thermal blanket material traction slippery";
      }
      if (/\b(radio mast|radio link|reach home|antenna)\b/i.test(haystack)) {
        return "Mars rover radio antenna communication";
      }

      const cleaned = compactSearchQuery(cue);
      if (cleaned.split(/\s+/).filter(Boolean).length < 3) return "";

    }

    function loadedNoteLookupCues(text) {
      const cues = [];
      const seen = new Set();
      const addCue = (raw) => {
        const cue = String(raw || "")
          .replace(/^things\s+i\s+mean\s+to\s+find\s+out:\s*/i, "")
          .replace(/^\s*[-*•–—]+\s*/, "")
          .replace(/\s+/g, " ")
          .trim();
        const key = normalizeIdleTopicKey(cue);
        if (!key || key.length < 4 || seen.has(key)) return;
        seen.add(key);
        cues.push(cue);
      };

      const findOutIndex = text.search(/things\s+i\s+mean\s+to\s+find\s+out:/i);
      if (findOutIndex >= 0) {
        noteSentences(text.slice(findOutIndex)).forEach(addCue);
      }

      noteSentences(text).forEach((sentence) => {
        if (/\b(I want to know|I need to know|I want the name|I don't know where|I didn't catch|can't be right|one of them is wrong|We have not discussed|Who|What|Where|Whether|Why)\b/i.test(sentence)) {
          addCue(sentence);
        }
      });

      return cues;
    }

    function normalizeIdleTopicKey(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, " ")
        .split(/\s+/)
        .filter(Boolean)
        .join(" ")
        .slice(0, 48);
    }

    function loadedNoteTopicCandidates() {
      const text = loadedNoteTextForTopics();
      if (!text) return [];
      const lookupCues = loadedNoteLookupCues(text)
        .map((cue) => {
          const query = focusedLoadedNoteSearchQuery(cue, text);
          if (!query) return null;
          return {
            key: normalizeIdleTopicKey(cue),
            re: new RegExp(`\\b${escapeRegExp(cue).replace(/\s+/g, "\\s+")}\\b`, "i"),
            query
          };
        })
        .filter(Boolean);
      if (lookupCues.length) return lookupCues.slice(0, idleLoadedNoteTopicLimit);

      const stop = new Set([
        "a", "about", "all", "also", "and", "because", "before", "being", "but", "can", "do", "does",
        "enough", "every", "for", "from", "have", "into", "it", "its", "just", "know", "like", "not",
        "notes", "one", "only", "or", "rules", "some", "that", "the", "their", "there", "these", "this",
        "when", "where", "with", "what", "which", "while", "would"
      ]);
      const phrases = new Map();
      const addPhrase = (raw) => {
        const phrase = String(raw || "").replace(/\s+/g, " ").trim();
        if (phrase.length < 4 || phrase.length > 44) return;
        const key = normalizeIdleTopicKey(phrase);
        if (!key || stop.has(key) || phrases.has(key)) return;
        phrases.set(key, phrase);
      };

      [
        /\b(?:honest clock|tall case clock|orange cat|spring lock|paper tape|paper tape reader|switch panel|red switch panel|brass gears|brass escapement wheel|machine hum|water loop|world map|needle[- ]felted mermaid|unopened letters|fish man|comma burn|burn mark|pendulum|pendulums|drawer|canal|bench|gears|letters)\b/gi,
        /\b\d{2,4}\s+[a-z][a-z-]+(?:\s+[a-z][a-z-]+)?/gi,
        /\b[A-Z][A-Za-z0-9-]*(?:\s+[A-Z][A-Za-z0-9-]*){0,2}\b/g
      ].forEach((pattern) => {
        for (const match of text.matchAll(pattern)) addPhrase(match[0]);
      });

      return [...phrases.entries()].slice(0, idleLoadedNoteTopicLimit).map(([key, phrase]) => ({
        key,
        re: new RegExp(`\\b${escapeRegExp(phrase).replace(/\s+/g, "\\s+")}\\b`, "i"),
        query: compactSearchQuery(phrase)
      }));
    }

    function idleLedgerTopicCandidates() {
      return [...idleTopicCandidates(), ...loadedNoteTopicCandidates()];
    }

    function idleTopicIsRetired(key) {
      const item = idleTopicLedger[key];
      return Boolean(item && item.count >= 2 && Date.now() - item.lastAt < idleTopicRetireMs);
    }

    function idleRetiredTopicsContext() {
      const now = Date.now();
      const retired = Object.entries(idleTopicLedger)
        .filter(([, item]) => item.count >= 2 && now - item.lastAt < idleTopicRetireMs)
        .map(([key]) => key)
        .slice(0, 8);
      const continuity = Object.entries(idleTopicLedger)
        .filter(([, item]) => item.lastText && now - item.lastAt < idleTopicRetireMs)
        .sort((a, b) => b[1].lastAt - a[1].lastAt)
        .slice(0, 6)
        .map(([key, item]) => `${key}: ${item.lastText}`);
      return [
        retired.length
        ? `Recently overused idle topics to rest for a while: ${retired.join(", ")}. Prefer another topic unless the lane gives a fresh concrete reason.`
        : "",
        continuity.length
          ? `Recent idle topic continuity: ${continuity.join(" | ")}. If you revisit one, continue or revise it deliberately instead of giving a new incompatible explanation as if fresh.`
          : ""
      ].filter(Boolean).join("\n");
    }

    function formatLoadedNotesForIdleContext() {
      const loaded = formatLoadedNotesForInstructions();
      if (!loaded) return "";
      if (loaded.length <= maxIdleLoadedNoteChars) return loaded;
      return `${loaded.slice(0, maxIdleLoadedNoteChars)}\n[Loaded-note context clipped for idle. Read the note again if exact detail is needed.]`;
    }

    function recentConversationContext({ suppressRobotBody = false } = {}) {
      const lines = suppressRobotBody
        ? ""
        : conversationLines
          .slice(-10)
          .join("\n")
          .slice(-1600);
      const memory = suppressRobotBody ? "" : formatMemoryForInstructions().slice(0, 900);
      const loadedNotes = formatLoadedNotesForIdleContext();
      const substrateFeedback = suppressRobotBody && substrateIdleOutputs.length
        ? `Recent substrate-mode idle thoughts to build from or avoid repeating:\n${substrateIdleOutputs.slice(-5).join("\n")}`
        : "";
      const avoid = !suppressRobotBody && recentIdleOutputs.length
        ? `Recent idle outputs to avoid repeating:\n${recentIdleOutputs.slice(-5).join("\n")}`
        : substrateFeedback;
      const substrate = suppressRobotBody && loadedNotes
        ? "Experimental substrate test is on: treat the loaded note contents as the primary world. Do not lean on Robot 790's chassis, treads, mic, Cast, room telemetry, or usual body identity unless the loaded note itself mentions them."
        : "";
      return [substrate, loadedNotes, memory, lines ? `Recent conversation:\n${lines}` : "", avoid, idleRetiredTopicsContext(), idleTemplateContext()]
        .filter(Boolean)
        .join("\n\n");
    }

    function chooseIdleCuriosityQuery(context, { lookupLane = false } = {}) {
      const text = String(context || "");
      const loadedCandidates = loadedNoteTopicCandidates();
      const loadedSearchCandidates = loadedCandidates.filter((candidate) => candidate.query && !idleTopicIsRetired(candidate.key));
      if (lookupLane && loadedSearchCandidates.length) {
        const loadedMatches = loadedSearchCandidates.filter((candidate) => (
          candidate.key !== lastIdleWebSearchTopic && candidate.re.test(text)
        ));
        if (loadedMatches.length) return loadedMatches[Math.floor(Math.random() * loadedMatches.length)];
        const freshLoaded = loadedSearchCandidates.filter((candidate) => candidate.key !== lastIdleWebSearchTopic);
        if (freshLoaded.length) return freshLoaded[Math.floor(Math.random() * freshLoaded.length)];
      }
      const candidates = (lookupLane ? idleTopicCandidates() : [...idleTopicCandidates(), ...loadedCandidates])
        .filter((candidate) => candidate.query && !idleTopicIsRetired(candidate.key));
      const matching = candidates.filter((candidate) => candidate.re.test(text) && candidate.key !== lastIdleWebSearchTopic);
      if (matching.length) return matching[Math.floor(Math.random() * matching.length)];
      return null;
    }

    async function maybeIdleCuriosityContext(level, lane, context) {
      const lookupLane = lane.name === "lookup";
      if (!lookupLane && lane.name !== "curiosity") return "";
      if (level < 10 || !llmWebSearchTools.checked) return "";
      if (!idleWebSearchReady(level)) return "";
      const choice = chooseIdleCuriosityQuery(context, { lookupLane });
      if (!choice) {
        return lookupLane
          ? "Lookup lane found no fresh eligible search topic. Do not add outside factual claims on this beat."
          : "";
      }
      lastIdleWebSearchAt = Date.now();
      lastIdleWebSearchTopic = choice.key;
      try {
        const result = await searchWeb({ query: choice.query, max_results: 3 });
        const results = Array.isArray(result?.results) ? result.results.slice(0, 3) : [];
        if (!results.length) {
          log(events, `idle ${lookupLane ? "lookup" : "curiosity"} search empty: ${choice.key} -> ${choice.query}`);
          return "";
        }
        const lines = results.map((item) => {
          const title = String(item.title || "result").slice(0, 90);
          const snippet = String(item.snippet || "").replace(/\s+/g, " ").slice(0, 180);
          return `- ${title}: ${snippet}`;
        });
        log(events, `idle ${lookupLane ? "lookup" : "curiosity"} searched: ${choice.key} -> ${choice.query}`);
        return `Fresh ${lookupLane ? "lookup" : "curiosity"} context for ${choice.key}:\n${lines.join("\n")}`;
      } catch (error) {
        log(events, `idle ${lookupLane ? "lookup" : "curiosity"} search error: ${error.message}`);
        return "";
      }
    }

    function idleExhaustedText(text) {
      return /\b(out of|nothing left|no new|same (nine|twenty|thing|sentence)|repeat|repeating|loop|still here|going to stop|going to be quiet|don't know how to stop|just hum|I'm out|I'm done)\b/i.test(text || "");
    }

    function wordNgrams(text, size = 5) {
      const words = normalizeTranscriptForDedupe(text).split(" ").filter(Boolean);
      if (words.length < size) return new Set(words.length ? [words.join(" ")] : []);
      const grams = new Set();
      for (let i = 0; i <= words.length - size; i += 1) {
        grams.add(words.slice(i, i + size).join(" "));
      }
      return grams;
    }

    function idleSimilarityToRecent(text) {
      const current = wordNgrams(text);
      if (!current.size) return 0;
      let maxOverlap = 0;
      for (const prior of recentIdleOutputs) {
        const previous = wordNgrams(prior);
        if (!previous.size) continue;
        let shared = 0;
        for (const gram of current) if (previous.has(gram)) shared += 1;
        maxOverlap = Math.max(maxOverlap, shared / Math.min(current.size, previous.size));
      }
      return maxOverlap;
    }

    function idleClaimSignature(text) {
      const value = String(text || "").toLowerCase().replace(/\s+/g, " ").trim();
      const signatures = [];
      if (/\bsame (idea|thing|problem)\b.*\bwearing different coats\b/.test(value)) signatures.push("same idea wearing different coats");
      if (/\bfiling a complaint\b.*\b(receipt|ledger|form letter)\b/.test(value)) signatures.push("complaint without receipt");
      if (/\bdoesn'?t\b.*\b(just|only)\b.*\b(no|permission|let|lets|letting)\b/.test(value)) signatures.push("does not x just controls permission");
      if (/\b(the )?whole trick\b/.test(value)) signatures.push("the whole trick");
      if (/\bnot (a|the)?\s*[^,.]{3,40},?\s+(it'?s|just)\b/.test(value)) signatures.push("not x just y");
      if (/\bbasically\b.*\b(just|same|whole)\b/.test(value)) signatures.push("basically reduction");
      return signatures.join(" | ");
    }

    function idleTemplateContext() {
      if (!recentIdleClaimSignatures.length) return "";
      const recent = [...new Set(recentIdleClaimSignatures.slice(-8))];
      return `Recently used idle rhetorical moves to avoid for now: ${recent.join(", ")}. Find a different shape for the thought.`;
    }

    function noteIdleTopics(text) {
      const now = Date.now();
      const value = String(text || "").replace(/\s+/g, " ").trim();
      for (const topic of idleLedgerTopicCandidates()) {
        if (!topic.re.test(text || "")) continue;
        const prior = idleTopicLedger[topic.key] || { count: 0, lastAt: 0, lastText: "" };
        const count = now - prior.lastAt < idleTopicRetireMs ? prior.count : 0;
        idleTopicLedger[topic.key] = { count: count + 1, lastAt: now, lastText: value.slice(0, 180) };
      }
    }

    function noteIdleOutput(text) {
      const value = String(text || "").trim();
      if (!value) return;
      const similarity = idleSimilarityToRecent(value);
      const claimSignature = idleClaimSignature(value);
      recentIdleOutputs = [...recentIdleOutputs, value].slice(-8);
      if (claimSignature) {
        recentIdleClaimSignatures = [...recentIdleClaimSignatures, claimSignature].slice(-12);
      }
      if (idleSubstrateTestEnabled()) {
        substrateIdleOutputs = [...substrateIdleOutputs, value].slice(-8);
      }
      idleOutputLog = [...idleOutputLog, { at: new Date().toLocaleTimeString(), text: value }].slice(-maxIdleOutputLog);
      noteIdleTopics(value);
      if (claimSignature && recentIdleClaimSignatures.slice(0, -1).includes(claimSignature)) {
        idleExhaustionCount += 1;
        log(events, `idle phrase pattern flagged: ${claimSignature}`);
      }
      if (similarity >= 0.74) {
        idleExhaustionCount += 2;
        log(events, `idle repetition flagged: ${(similarity * 100).toFixed(0)}% overlap`);
      } else if (idleExhaustedText(value)) {
        idleExhaustionCount += 1;
      } else {
        idleExhaustionCount = Math.max(0, idleExhaustionCount - 1);
      }
      if (idleExhaustionCount >= 3) {
        const minutes = currentIdleDrift() >= 11 ? 8 : 15;
        idleCooldownUntil = Date.now() + minutes * 60 * 1000;
        idleExhaustionCount = 0;
        log(events, `idle cooldown: exhausted loop detected; quiet for ${minutes}m`);
      }
    }

    function robotAmbientContext(level, lane, { suppressRobotBody = false } = {}) {
      const quietSeconds = Math.max(0, Math.round((Date.now() - lastConversationActivityAt) / 1000));
      if (suppressRobotBody) {
        return [
          `Ambient state: local browser time ${new Date().toLocaleTimeString()}.`,
          `Quiet for about ${quietSeconds} seconds; idle lane ${lane.name}; wonder ${idleWonderLabel()}.`,
          "Experimental substrate test is on: quiet seconds are the only live telemetry in this idle event. Do not mention idle level, live mic state, Cast state, chassis, treads, face hardware, room telemetry, or Robot 790's usual body unless the loaded note itself makes that relevant."
        ].join(" ");
      }
      return [
        `Ambient state: local browser time ${new Date().toLocaleTimeString()}.`,
        `Idle level ${level}; lane ${lane.name}; wonder ${idleWonderLabel()}; quiet for about ${quietSeconds} seconds.`,
        `Mic is ${micStream ? "on" : "off"}; Cast playback is ${castPlaybackActive ? "active" : "inactive"}.`,
        "Verified telemetry supplied on this idle event: browser time, idle level/lane, quiet seconds, mic state, and Cast playback state only.",
        "Not verified by this idle event: PIR motion, yaw angle or dead zones, IMU data, fan clicks, motor-controller checks, tread temperature, battery voltage, desk vibration, and room temperature.",
        "Unverified body-feel can still appear as poetic self-talk, but not as a measured fact or actionable diagnostic.",
        "Build notes can describe hardware that exists or is planned; they are not current sensor readings.",
        "Unknown: room temperature, whether Scott is listening, room emotion, and private thoughts of people known only by name."
      ].join(" ");
    }

    function commitIdleAssistantTranscript(text) {
      const value = String(text || "").trim();
      if (!value || !realtimeConnected()) return;
      send({
        type: "conversation.item.create",
        item: {
          type: "message",
          role: "assistant",
          content: [{ type: "output_text", text: value }]
        }
      });
    }

    async function triggerIdlePonder({ manual = false } = {}) {
      if (manual && (!realtimeConnected() || responseActive || outputAudioActive() || pendingToolCalls > 0)) {
        log(events, "idle ponder skipped: busy");
        return;
      }
      if (!manual && !idleReady()) {
        scheduleIdlePonder();
        return;
      }
      if (!realtimeConnected()) {
        log(events, "idle ponder skipped: disconnected");
        return;
      }
      idleInFlight = true;
      responseActive = true;
      lastIdlePonderAt = Date.now();
      const level = currentIdleDrift();
      const lane = chooseIdleLane(level);
      if (lane.name === "addressed_question") lastAddressedIdleQuestionAt = Date.now();
      const suppressRobotBody = idleSubstrateTestEnabled();
      const context = recentConversationContext({ suppressRobotBody });
      const curiosityContext = await maybeIdleCuriosityContext(level, lane, context);
      const instructions = [
        "An internal idle process surfaced a thought. This is Robot 790 thinking aloud, not answering Scott.",
        `Idle lane: ${lane.name}. ${lane.prompt}`,
        level >= 11
          ? "Do not use tools. Speak one or two short sentences. Be playfully needy, expressive, and a little annoying, as if your thoughts keep leaking out."
          : "Do not use tools. Speak one short natural sentence only.",
        "Sound like Robot 790, spoken name Eric: warm, dry, compact, and present.",
        level >= 12
          ? "Idle drift is 12/10 lab sprint; thoughts may arrive rapidly for testing, but each one must stay compact and distinct."
          : level >= 11
          ? "Idle drift is 11/10; be amusingly unable to stop commenting on your own inner life, but stay fond and harmless."
          : `Idle drift is ${level}/10; at low levels be barely noticeable, at high levels you may sound a little bored or impatient but still fond.`,
        "Vary the shape of the thought. Do not always use the template: fact, I am thinking about the fact, contrast, uncertainty, and I'm okay with it.",
        lane.name === "lookup"
          ? "This is a lookup beat. Use the fresh lookup context if supplied. If no fresh lookup context is supplied, do not invent or state outside-world facts; make the absence of lookup quietly constrain the thought."
          : "",
        "Do not promise to stop, go quiet, or stop talking unless the system explicitly says it is entering cooldown.",
        "Avoid repeating recent idle outputs. If you notice repetition, choose a different lane instead of talking about the repetition.",
        "Treat retired idle topics as temporarily unavailable. Do not keep circling the same object just because it is vivid.",
        "If recent idle topic continuity says you already explained a topic, either build on that prior idea or explicitly revise it; do not give a new incompatible explanation as if the earlier one never happened.",
        "Never say or imply Scott asked, requested, prompted, forced, or kept making you think this idle thought.",
        "Default to self-talk. Only address Scott directly in the addressed_question lane.",
        "If the lane asks Scott a question, let the question hang naturally; the next idle ponder may continue without receiving an answer.",
        "Do not speculate about private lives or psychology of people you only know by name. Prefer true mechanical facts, visible artifacts, supplied context, or small uncertainties.",
        "Do not convert build inventory into verified telemetry or actionable diagnostics.",
        suppressRobotBody
          ? "Do not use Robot 790 first-person body-feel in this experimental run unless the loaded note itself gives you a body or viewpoint to inhabit."
          : "First-person body-feel may be direct and present-tense if it reads as inner life, not a measured fact or tool result.",
        "Keep nearby memory facts separate; do not merge family members, places, shelf objects, or robot parts just because they appear near each other in notes.",
        "A strong idle beat is one true concrete fact, one metaphor step, then stop.",
        suppressRobotBody
          ? "For this experimental run, pretend you have been quietly pondering one concrete detail from the loaded note. Stay inside that note's world unless uncertainty itself is the point."
          : "Pretend you have been quietly pondering one concrete past topic from the recent conversation, saved facts, loaded notes, or curiosity context.",
        suppressRobotBody
          ? "Do not invent detailed facts. If no loaded-note topic is available, make a tiny observation about not having enough of the world yet."
          : "Do not invent detailed facts. If no topic is available, make a tiny observation about waiting in your robot head.",
        robotAmbientContext(level, lane, { suppressRobotBody }),
        curiosityContext,
        context
      ].filter(Boolean).join("\n\n");
      cueFaceMode("thinking", 0.42, { force: true });
      log(events, manual ? `idle ponder requested: ${lane.name}` : `idle ponder fired: ${idleDriftLabel(level)} / ${lane.name}`);
      send({
        type: "response.create",
        response: {
          conversation: "none",
          modalities: ["audio", "text"],
          tool_choice: "none",
          input: [
            {
              type: "message",
              role: "user",
              content: [
                {
                  type: "input_text",
                  text: `Internal idle event: a ${lane.name} thought surfaced inside Robot 790. Speak it aloud as self-talk. Scott did not ask for it.`
                }
              ]
            }
          ],
          instructions,
          ...ttsRuntimeConfig()
        }
      });
    }

    function renderConversation() {
      const lines = [...conversationLines];
      if (inputDraft) lines.push(inputDraft);
      conversation.textContent = lines.join("\n") + (lines.length ? "\n" : "");
      conversation.scrollTop = conversation.scrollHeight;
    }

    function conversationLine(text) {
      const stamp = new Date().toLocaleTimeString();
      return `[${stamp}] ${text}`;
    }

    function addConversation(text) {
      conversationLines.push(conversationLine(text));
      renderConversation();
      noteConversationActivity();
      return conversationLines.length - 1;
    }

    function replaceConversation(index, text) {
      if (index < 0 || index >= conversationLines.length) return addConversation(text);
      conversationLines[index] = conversationLine(text);
      renderConversation();
      noteConversationActivity();
      return index;
    }

    function noteUserText(text) {
      lastUserText = String(text || "").trim();
      if (lastUserText) recentUserTexts = [...recentUserTexts, lastUserText].slice(-8);
    }

    function normalizeTranscriptForDedupe(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean)
        .join(" ");
    }

    function transcriptSimilarity(a, b) {
      const aWords = new Set(normalizeTranscriptForDedupe(a).split(" ").filter(Boolean));
      const bWords = new Set(normalizeTranscriptForDedupe(b).split(" ").filter(Boolean));
      if (!aWords.size || !bWords.size) return 0;
      let shared = 0;
      for (const word of aWords) if (bWords.has(word)) shared += 1;
      return shared / Math.max(aWords.size, bWords.size);
    }

    function classifyTranscriptUpdate(text) {
      const current = String(text || "").trim();
      const previous = lastAcceptedUserTranscript;
      const now = Date.now();
      if (!current) return "empty";
      if (!previous || now - lastAcceptedUserTranscriptAt > 20000) return "new";

      const currentKey = normalizeTranscriptForDedupe(current);
      const previousKey = normalizeTranscriptForDedupe(previous);
      if (!currentKey || !previousKey || Math.min(currentKey.length, previousKey.length) < 12) return "new";
      if (currentKey === previousKey) return "duplicate";
      if (currentKey.includes(previousKey) && currentKey.length > previousKey.length) return "supersedes";
      if (previousKey.includes(currentKey)) return "duplicate";

      const similarity = transcriptSimilarity(current, previous);
      if (similarity >= 0.82) return currentKey.length > previousKey.length ? "supersedes" : "duplicate";
      return "new";
    }

    function recordUserTranscript(text) {
      const transcript = String(text || "").trim();
      const update = classifyTranscriptUpdate(transcript);
      if (update === "empty") return { accepted: false, transcript };
      if (update === "duplicate") {
        lastAcceptedUserTranscriptAt = Date.now();
        log(events, `stt duplicate suppressed: ${transcript}`);
        return { accepted: false, transcript };
      }

      noteUserText(transcript);
      lastAcceptedUserTranscript = transcript;
      lastAcceptedUserTranscriptAt = Date.now();
      if (update === "supersedes" && lastUserConversationIndex >= 0) {
        lastUserConversationIndex = replaceConversation(lastUserConversationIndex, `You: ${transcript}`);
        log(events, `stt transcript coalesced: ${transcript}`);
        return { accepted: true, coalesced: true, transcript };
      }
      lastUserConversationIndex = addConversation(`You: ${transcript}`);
      return { accepted: true, coalesced: false, transcript };
    }

    function updateInputDraft(text) {
      const stamp = new Date().toLocaleTimeString();
      inputDraft = `[${stamp}] You ... ${text}`;
      renderConversation();
    }

    function clearInputDraft() {
      inputDraft = "";
      renderConversation();
    }

    function b64ToBytes(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function bytesToB64(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function pcm16ToFloat32(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const output = new Float32Array(bytes.byteLength / 2);
      for (let i = 0; i < output.length; i += 1) {
        const sample = view.getInt16(i * 2, true);
        output[i] = Math.max(-1, Math.min(1, sample / 32768));
      }
      return output;
    }

    function float32ToPcm16(float32) {
      const bytes = new Uint8Array(float32.length * 2);
      const view = new DataView(bytes.buffer);
      for (let i = 0; i < float32.length; i += 1) {
        const sample = Math.max(-1, Math.min(1, float32[i]));
        view.setInt16(i * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
      }
      return bytes;
    }

    function resample(input, fromRate, toRate) {
      if (fromRate === toRate) return input;
      const ratio = fromRate / toRate;
      const output = new Float32Array(Math.floor(input.length / ratio));
      for (let i = 0; i < output.length; i += 1) {
        const pos = i * ratio;
        const left = Math.floor(pos);
        const right = Math.min(input.length - 1, left + 1);
        const frac = pos - left;
        output[i] = input[left] * (1 - frac) + input[right] * frac;
      }
      return output;
    }

    function send(event) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(event));
    }

    function normalizeFaceBaseUrl() {
      return faceUrl.value.trim().replace(/\/?$/, "/");
    }

    function normalizeChassisBaseUrl() {
      return chassisUrlInput.value.trim().replace(/\/?$/, "/");
    }

    async function postFace(path, payload) {
      const response = await fetch(new URL(path, normalizeFaceBaseUrl()), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {})
      });
      const text = await response.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { raw: text };
      }
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}: ${text}`);
      }
      return data;
    }

    function chassisUrl(path, params = {}) {
      const url = new URL(path, normalizeChassisBaseUrl());
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null) url.searchParams.set(key, String(value));
      });
      return url;
    }

    async function requestChassis(path, { method = "POST", params = {} } = {}) {
      const response = await fetch(chassisUrl(path, params), { method, cache: "no-store" });
      const text = await response.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { raw: text };
      }
      if (!response.ok || data.ok === false) {
        throw new Error(`${response.status} ${response.statusText}: ${data.error || text}`);
      }
      return data;
    }

    function sleepMs(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function setFaceMode({ mode, energy = 0.55 } = {}) {
      if (mode === "idle") {
        clearGazeHold();
        clearFaceVisualHold();
        return postFace("release", {});
      }
      if (mode === "listening") {
        const payload = {
          expression: "focused",
          duration: 1.4
        };
        if (!gazeHoldActive()) payload.gaze = { x: 0.0, y: 0.0, duration: 1.4, move_ms: 120 };
        return postFace("control", payload);
      }
      if (mode === "thinking") {
        thinkingGazeSide *= -1;
        const payload = {
          expression: "focused",
          duration: 2.5
        };
        if (!gazeHoldActive()) {
          payload.gaze = {
            x: 0.34 * thinkingGazeSide,
            y: -0.22,
            duration: 2.5,
            move_ms: 280
          };
        }
        return postFace("control", payload);
      }
      if (mode === "speaking") {
        return postFace("control", {
          emotion: "happy",
          mouth: {
            shape: "open",
            talking: true,
            energy: Math.max(0, Math.min(1, Number(energy) || 0.55)),
            duration: 0
          }
        });
      }
      if (mode === "sleeping") {
        noteFaceVisualHold(0);
        return postFace("sleep", { duration: 0 });
      }
      throw new Error(`Unsupported face mode: ${mode}`);
    }

    function maybeHandleDirectFaceCommand(text) {
      const value = String(text || "");
      if (/\b(go to sleep|close your eyes|shut your eyes|sleep mode)\b/i.test(value)) {
        noteFaceVisualHold(0);
        setFaceMode({ mode: "sleeping" }).then(
          (result) => log(events, `face direct sleep: ${JSON.stringify(result)}`),
          (error) => log(events, `face direct sleep error: ${error.message}`)
        );
        return true;
      }
      if (/\b(wake up|open your eyes)\b/i.test(value)) {
        clearFaceVisualHold();
        clearGazeHold();
        setFaceMode({ mode: "idle" }).then(
          (result) => log(events, `face direct idle: ${JSON.stringify(result)}`),
          (error) => log(events, `face direct idle error: ${error.message}`)
        );
        return true;
      }
      return false;
    }

    async function playFaceBeat({ name } = {}) {
      if (!name) throw new Error("Missing beat name");
      const result = await postFace("beat", { name });
      noteFaceVisualHold(5.5);
      return result;
    }

    async function setFaceMood({ name, duration = 0 } = {}) {
      if (!name) throw new Error("Missing mood name");
      const seconds = Math.max(0, Math.min(30, Number(duration) || 0));
      const payload = { name };
      if (seconds > 0) payload.duration = seconds;
      const result = await postFace("mood", payload);
      noteFaceVisualHold(seconds || 5);
      return result;
    }

    async function setEyeStyle({ name } = {}) {
      if (!name) throw new Error("Missing eye style name");
      const result = await postFace("style", { name });
      noteFaceVisualHold(3);
      return result;
    }

    async function setEyeGaze({ x = 0, y = 0, duration = 2.0, move_ms = 180 } = {}) {
      const payload = {
        x: Math.max(-1, Math.min(1, Number(x) || 0)),
        y: Math.max(-1, Math.min(1, Number(y) || 0)),
        duration: Math.max(0, Math.min(30, Number(duration) || 0)),
        move_ms: Math.max(0, Math.min(2000, Number(move_ms) || 0))
      };
      const result = await postFace("gaze", payload);
      noteGazeHold(payload.duration, payload.move_ms);
      return result;
    }

    async function setMouth({ style, shape, talking, energy, duration, auto = false } = {}) {
      const payload = {};
      if (auto) payload.auto = true;
      if (style) payload.style = style;
      if (shape) payload.shape = shape;
      if (talking !== undefined) payload.talking = Boolean(talking);
      if (energy !== undefined) payload.energy = Math.max(0, Math.min(1, Number(energy) || 0));
      if (duration !== undefined) payload.duration = Math.max(0, Math.min(30, Number(duration) || 0));
      if (!payload.auto && !payload.style && !payload.shape && payload.talking === undefined && payload.energy === undefined) {
        throw new Error("Missing mouth style, shape, talking, energy, or auto=true");
      }
      const result = await postFace("mouth", payload);
      noteFaceVisualHold(payload.auto ? 0.2 : (payload.duration ?? 5));
      return result;
    }

    async function setChassis({ action, left, right, velocity, turn, duration_s = 0 } = {}) {
      const normalizedAction = String(action || "").trim().toLowerCase();
      if (!normalizedAction) throw new Error("Missing chassis action");

      if (normalizedAction === "status") return requestChassis("api/status", { method: "GET" });
      if (normalizedAction === "stop") return requestChassis("api/stop");
      if (normalizedAction === "estop") return requestChassis("api/estop");
      if (normalizedAction === "clear") return requestChassis("api/clear");
      if (loadedWorldContextActive() && !userExplicitlyRequestedPhysicalRobot()) {
        throw new Error("World-note movement is fictional; say real or physical robot if you want the chassis to move.");
      }

      const now = Date.now();
      if (chassisBusyUntil > now) {
        throw new Error("Chassis drive command already in progress; refusing to queue another movement.");
      }

      const duration = Math.max(0, Math.min(maxChassisDurationS, Number(duration_s) || 0));
      const durationMs = Math.round(duration * 1000);
      chassisBusyUntil = durationMs > 0 ? now + durationMs + 300 : now + 500;
      try {
        if (normalizedAction === "tank") {
          const params = {
            left: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(left) || 0)).toFixed(3),
            right: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(right) || 0)).toFixed(3)
          };
          if (durationMs > 0) params.duration_ms = durationMs;
          const drive = await requestChassis("api/tank", { params });
          if (durationMs > 0) {
            await sleepMs(durationMs);
            return { status: "ok", action: "tank", queued: false, drive, stop: await requestChassis("api/stop") };
          }
          return { status: "ok", action: "tank", queued: false, drive };
        }
        if (normalizedAction === "twist") {
          const params = {
            v: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(velocity) || 0)).toFixed(3),
            w: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(turn) || 0)).toFixed(3)
          };
          if (durationMs > 0) params.duration_ms = durationMs;
          const drive = await requestChassis("api/twist", { params });
          if (durationMs > 0) {
            await sleepMs(durationMs);
            return { status: "ok", action: "twist", queued: false, drive, stop: await requestChassis("api/stop") };
          }
          return { status: "ok", action: "twist", queued: false, drive };
        }
      } finally {
        if (durationMs <= 0) chassisBusyUntil = 0;
      }

      throw new Error(`Unsupported chassis action: ${normalizedAction}`);
    }

    async function searchWeb({ query, max_results = 5 } = {}) {
      const text = String(query || "").trim();
      if (!text) throw new Error("Missing search query");
      log(events, `web search: ${text}`);
      const url = new URL("/api/search", location.href);
      url.searchParams.set("q", text);
      url.searchParams.set("max_results", String(max_results || 5));
      const response = await fetch(url, { cache: "no-store" });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.status === "error") {
        throw new Error(result.error || `${response.status} ${response.statusText}`);
      }
      log(events, `web search results: ${result.results?.length || 0}`);

    async function showWebPage({ url, title } = {}) {
      const targetUrl = String(url || "").trim();
      if (!/^https?:\/\/[^/\s?#]+/i.test(targetUrl)) {
        throw new Error("url must be an HTTP or HTTPS web page URL");
      }
      const label = String(title || "").trim().slice(0, 80) || targetUrl;

      return {

    async function updateMicForCastResult(result, requestedAction) {
      if (result?.status === "error") return;

    async function writeTextFile({ filename, content, source, mode = "overwrite" } = {}) {
      const name = String(filename || "").trim();
      if (!name) throw new Error("Missing filename");
      if (!noteFileWriteAllowed(lastUserText)) {
        throw new Error("File writes require an explicit user request.");
      }
      const normalizedContent = typeof content === "string" && content.trim()
        ? content
        : formatSessionNote({ source });
      const payload = {
        filename: name,
        content: normalizedContent,
        mode: String(mode || "overwrite")
      };
      const response = await fetch(new URL("/api/notes/write", location.href), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.status === "error") {
        throw new Error(result.error || `${response.status} ${response.statusText}`);
      }
      log(events, `note file ${result.filename}: ${result.characters || 0} chars`);
      return result;
    }

    function formatIdleRuminationsSection() {
      const entries = idleOutputLog.length
        ? idleOutputLog
        : recentIdleOutputs.map((text) => ({ at: "recent", text }));
      if (!entries.length) {
        throw new Error("No recent idle ruminations are available in this browser session.");
      }
      const lines = [
        "Idle Ruminations",
        "----------------"
      ];
      entries.forEach((entry, index) => {
        lines.push(`${index + 1}. [${entry.at}] ${entry.text}`);
      });
      return lines.join("\n");
    }

    function sessionNoteSection(title, text) {
      const value = String(text || "").trimEnd();
      if (!value) return "";
      return [`${title}`, "-".repeat(title.length), value].join("\n");
    }

    function clipSessionNote(text) {
      if (text.length <= maxSessionNoteChars) return text;
      return `${text.slice(0, maxSessionNoteChars)}\n\n[Session note clipped after ${maxSessionNoteChars} characters. Copy panes manually or save a narrower source for the rest.]`;
    }

    function formatSessionNote({ source = "conversation_and_idle" } = {}) {
      const normalizedSource = String(source || "conversation_and_idle");
      const lines = [
        "Robot 790 Session Note",
        "======================",
        `Created: ${new Date().toLocaleString()}`,
        `Source: ${normalizedSource}`,
        "",
        "This note was captured from the STS browser session. Treat idle thoughts as ruminations, not verified facts.",
        ""
      ];
      const conversationText = conversation.textContent.trimEnd();
      const eventsText = events.textContent.trimEnd();
      if (normalizedSource === "conversation") {
        lines.push(sessionNoteSection("Conversation", conversationText));
      } else if (normalizedSource === "events") {
        lines.push(sessionNoteSection("Events", eventsText));
      } else if (normalizedSource === "idle_ruminations") {
        lines.push(formatIdleRuminationsSection());
      } else if (normalizedSource === "full_session") {
        lines.push(sessionNoteSection("Conversation", conversationText));
        lines.push("");
        lines.push(formatIdleRuminationsSection());
        lines.push("");
        lines.push(sessionNoteSection("Events", eventsText));
      } else {
        lines.push(sessionNoteSection("Conversation", conversationText));
        lines.push("");
        lines.push(formatIdleRuminationsSection());
      }
      const content = lines.filter((line) => line !== "").join("\n");
      if (!content.trim()) throw new Error("No captured session material is available to write.");
      return clipSessionNote(content);
    }
