    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("Could not read image"));
        reader.readAsDataURL(file);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("Could not decode image"));
        image.src = src;
      });
    }

    async function prepareVisionImage(file) {
      if (!file || !file.type.startsWith("image/")) {
        throw new Error("Choose an image file.");
      }
      const sourceUrl = await fileToDataUrl(file);
      const image = await loadImage(sourceUrl);
      const scale = Math.min(1, visionMaxEdgePx / Math.max(image.naturalWidth, image.naturalHeight));
      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#101114";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(image, 0, 0, width, height);
      visionImageUrl = canvas.toDataURL("image/jpeg", visionJpegQuality);
      visionImageName = file.name || "image";
      visionImageStaged = false;
      visionPreview.src = visionImageUrl;
      visionPreview.classList.add("ready");
      visionHint.textContent = `${visionImageName} (${width}x${height})`;
      updateVisionButtons();
      log(events, `vision image loaded: ${visionHint.textContent}`);
      stageVisionImage();
    }

    function clearVisionImage() {
      visionImageUrl = "";
      visionImageName = "";
      visionImageStaged = false;
      visionFile.value = "";
      visionPreview.removeAttribute("src");
      visionPreview.classList.remove("ready");
      visionHint.textContent = "Drop image, then speak";
      updateVisionButtons();
    }

    function stageVisionImage() {
      if (!visionImageUrl || visionImageStaged) return;
      if (!realtimeConnected()) {
        visionHint.textContent = `${visionImageName || "image"} - connect to stage`;
        updateVisionButtons();
        return;
      }
      send({
        type: "conversation.item.create",
        item: {
          type: "message",
          role: "user",
          content: [
            {
              type: "input_text",
              text: (
                "The user has placed an image in Robot 790's sensing eye. " +
                "Do not answer yet. Keep this image as visual context until the user clears or replaces it. " +
                "When later describing the image, separate what is plainly visible from guesses, and be explicit when uncertain."
              )
            },
            { type: "input_image", image_url: visionImageUrl, detail: "auto" }
          ]
        }
      });
      visionImageStaged = true;
      visionHint.textContent = `${visionImageName || "image"} - ready for voice`;
      updateVisionButtons();
      log(events, `vision image staged: ${visionImageName || "image"}`);
    }

    function noteGazeHold(duration, moveMs) {
      const holdMs = Math.max(0, Math.min(30, Number(duration) || 0)) * 1000;
      const transitionMs = Math.max(0, Math.min(2000, Number(moveMs) || 0));
      gazeHoldIndefinite = holdMs === 0;
      gazeHoldUntil = gazeHoldIndefinite ? 0 : Date.now() + holdMs + transitionMs + 300;
    }

    function clearGazeHold() {
      gazeHoldUntil = 0;
      gazeHoldIndefinite = false;
    }

    function noteFaceVisualHold(duration) {
      const holdMs = Math.max(0, Math.min(30, Number(duration) || 0)) * 1000;
      faceVisualHoldIndefinite = holdMs === 0;
      faceVisualHoldUntil = faceVisualHoldIndefinite ? 0 : Date.now() + holdMs + 300;
    }

    function clearFaceVisualHold() {
      faceVisualHoldUntil = 0;
      faceVisualHoldIndefinite = false;
    }

    function gazeHoldActive() {
      return gazeHoldIndefinite || gazeHoldUntil > Date.now();
    }

    function faceVisualHoldActive() {
      return faceVisualHoldIndefinite || faceVisualHoldUntil > Date.now();
    }

    function gazeHoldRemainingMs() {
      if (gazeHoldIndefinite) return Infinity;
      return Math.max(0, gazeHoldUntil - Date.now());
    }

    function faceVisualHoldRemainingMs() {
      if (faceVisualHoldIndefinite) return Infinity;
      return Math.max(0, faceVisualHoldUntil - Date.now());
    }

    async function executeTool(name, rawArguments) {
      const args = parseToolArguments(rawArguments);
      if (name === "set_robot_mode") return setFaceMode(args);
      if (name === "play_face_beat") return playFaceBeat(args);
      if (name === "set_face_mood") return setFaceMood(args);
      if (name === "set_eye_style") return setEyeStyle(args);
      if (name === "set_eye_gaze") return setEyeGaze(args);
      if (name === "set_mouth") return setMouth(args);
      if (name === "set_chassis") return setChassis(args);
      if (name === "remember_fact") return rememberMemoryFact(args);
      if (name === "forget_fact") return forgetMemoryFact(args);
      if (name === "search_web") return searchWeb(args);
      if (name === "show_web_page") return showWebPage(args);
      if (name === "cast_media") return castMedia(args);
      if (name === "write_text_file") return writeTextFile(args);
      if (name === "read_text_file") return readTextFile(args);
      if (name === "list_text_files") return listTextFiles(args);
      throw new Error(`Unknown tool: ${name}`);
    }

    function parseToolArguments(rawArguments) {
      if (!rawArguments) return {};
      if (typeof rawArguments === "object") return rawArguments;
      return JSON.parse(rawArguments);
    }

    function cueFaceMode(mode, energy = 0.55, { force = false } = {}) {
      if (faceIdleTimer) clearTimeout(faceIdleTimer);
      faceIdleTimer = null;
      if (!force && mode !== "idle" && faceVisualHoldActive()) {
        log(events, `face ${mode} skipped; visual hold active`);
        return;
      }
      if (!force && faceMode === mode) return;
      faceMode = mode;
      setFaceMode({ mode, energy }).then(
        (result) => log(events, `face ${mode}: ${JSON.stringify(result)}`),
        (error) => log(events, `face ${mode} error: ${error.message}`)
      );
    }

    function scheduleFaceIdle(delayMs = 900) {
      if (faceIdleTimer) clearTimeout(faceIdleTimer);
      const gazeRemainingMs = gazeHoldRemainingMs();
      const visualRemainingMs = faceVisualHoldRemainingMs();
      if (gazeRemainingMs === Infinity || visualRemainingMs === Infinity) {
        log(events, "face idle delayed; hold is indefinite");
        return;
      }
      const actualDelayMs = Math.max(delayMs, gazeRemainingMs, visualRemainingMs);
      faceIdleTimer = setTimeout(() => {
        cueFaceMode("idle");
      }, actualDelayMs);
      if (actualDelayMs !== delayMs) log(events, `face idle delayed until hold ends: ${Math.round(actualDelayMs)}ms`);
    }

    function userAskedForMultipleMovements() {
      return /\b(and then|then|after that|followed by|next)\b/i.test(lastUserText || "");
    }

    function chassisFollowupText(result) {
      const action = String(result?.action || "").toLowerCase();
      if (result?.status === "error") return "I could not move.";
      if (action === "status") return "Status checked.";
      if (action === "stop") return "Stopped.";
      if (action === "estop") return "Emergency stop is set.";
      if (action === "clear") return "Emergency stop is clear.";
      if (userAskedForMultipleMovements()) return "First move done. Give me the next command.";
      return "Done.";
    }

    function memoryFollowupText(toolName, result) {
      if (result?.status === "error") return "I could not save that.";
      if (toolName === "remember_fact") return "I'll remember that.";
      if (toolName === "forget_fact") return "I forgot that.";
      return "Done.";
    }

    function noteFileFollowupText(toolName, result) {
      if (result?.status === "error") return "I could not touch that file.";
      if (toolName === "write_text_file") {
        return `Saved that to ${result?.filename || "the note file"}.`;
      }
      return "Done.";
    }

    function noteFileFollowupInstructions(toolName, result) {
      if (toolName === "read_text_file") {
        return (
          "Use the read_text_file tool output to answer the user's request compactly. " +
          "Do not recite the entire file unless the user explicitly asked for that."
        );
      }
      if (toolName === "list_text_files") {
        const count = Array.isArray(result?.files) ? result.files.length : 0;
        if (!count) return exactSpeechInstruction("I found no note files.");
        return "Use the list_text_files tool output to name the available note files compactly.";
      }
      return "";
    }

    function exactSpeechInstruction(text) {
      const safeText = String(text || "Done.").replace(/["\\]/g, "");
      return `Say exactly this and nothing else: "${safeText}"`;
    }

    function searchFollowupInstructions(result) {
      const count = Array.isArray(result?.results) ? result.results.length : 0;
      if (!count) return exactSpeechInstruction("I searched, but found nothing useful.");
      return (
        "Use the search_web tool output in the conversation to answer the user's question in one compact spoken sentence. " +
        "Mention the source site when useful. Do not say you cannot browse or search. Do not mention tools, JSON, or URLs unless the user asked for links."
      );
    }

    function webPageFollowupText(result) {
      if (result?.status === "error") return "I could not open that page.";
      if (result?.blocked) return "The browser blocked the new tab.";
      return "I opened it.";
    }

    function castMediaFollowupText(result) {
      if (result?.status === "error") return "I could not cast that.";
      const action = String(result?.action || "").toLowerCase();
      if (action === "devices") {
        const count = Array.isArray(result?.devices) ? result.devices.length : 0;
        if (!count) return "I found no Cast receivers.";
        return count === 1 ? "I found one Cast receiver." : `I found ${count} Cast receivers.`;
      }
      if (action === "search_youtube") return "I found some YouTube options.";
      if (action === "play_youtube") return "Casting now.";
      if (action === "show_image") return "Image is on the TV.";
      if (action === "stop") return "Cast playback stopped.";
      return "Done.";
    }

    async function handleFunctionCall(event) {
      pendingToolCalls += 1;
      toolFollowupNeeded = true;
      try {
        const result = await executeTool(event.name, event.arguments);
        if (event.name === "set_chassis") toolFollowupExactText = chassisFollowupText(result);
        if (event.name === "remember_fact" || event.name === "forget_fact") {
          toolFollowupExactText = memoryFollowupText(event.name, result);
        }
        if (event.name === "write_text_file") {
          toolFollowupExactText = noteFileFollowupText(event.name, result);
        }
        if (event.name === "read_text_file" || event.name === "list_text_files") {
          toolFollowupInstructions = noteFileFollowupInstructions(event.name, result);
        }
        if (event.name === "search_web") toolFollowupInstructions = searchFollowupInstructions(result);
        if (event.name === "show_web_page") toolFollowupExactText = webPageFollowupText(result);
        if (event.name === "cast_media") toolFollowupExactText = castMediaFollowupText(result);
        log(events, `tool ${event.name}: ${JSON.stringify(result)}`);
        send({
          type: "conversation.item.create",
          item: {
            type: "function_call_output",
            call_id: event.call_id,
            output: JSON.stringify(event.name === "search_web" ? result : { status: "ok", result })
          }
        });
        if (event.name === "remember_fact" || event.name === "forget_fact" || loadedNoteContextDirty) {
          loadedNoteContextDirty = false;
          updateSessionTools();
        }
      } catch (error) {
        if (event.name === "set_chassis") toolFollowupExactText = "I could not move.";
        if (event.name === "remember_fact" || event.name === "forget_fact") {
          toolFollowupExactText = "I could not save that.";
        }
        if (event.name === "write_text_file" || event.name === "read_text_file" || event.name === "list_text_files") {
          toolFollowupExactText = "I could not touch that file.";
        }
        if (event.name === "search_web") toolFollowupExactText = "I could not search.";
        if (event.name === "show_web_page") toolFollowupExactText = "I could not open that page.";
        if (event.name === "cast_media") toolFollowupExactText = "I could not cast that.";
        log(events, `tool ${event.name} error: ${error.message}`);
        send({
          type: "conversation.item.create",
          item: {
            type: "function_call_output",
            call_id: event.call_id,
            output: JSON.stringify({ status: "error", error: error.message })
          }
        });
      }
      pendingToolCalls -= 1;
      maybeCreateToolFollowup();
    }

    function maybeCreateToolFollowup() {
      if (!toolFollowupNeeded || pendingToolCalls > 0 || !responseDoneAfterTool) return;
      toolFollowupNeeded = false;
      responseDoneAfterTool = false;
      const instructions = toolFollowupExactText
        ? exactSpeechInstruction(toolFollowupExactText)
        : toolFollowupInstructions || "Now reply as Robot 790, spoken name Eric. One compact spoken sentence. Do not mention tools or output XML/function-call tags. Do not claim any additional robot action happened. If the user requested multiple chassis movements, say the first move is done and ask for the next movement as a new command.";
      toolFollowupExactText = "";
      toolFollowupInstructions = "";
      send({
        type: "response.create",
        response: {
          modalities: ["audio", "text"],
          tool_choice: "none",
          instructions,
          ...ttsRuntimeConfig()
        }
      });
    }

    function updateSessionTools() {
      saveToolPrefs();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const enabledTools = [
        ...(llmTools?.checked ? faceTools : []),
        ...(llmChassisTools?.checked ? chassisTools : []),
        ...(llmMemoryTools?.checked ? memoryTools : []),
        ...(llmWebSearchTools?.checked ? searchTools : []),
        ...(llmWebPageTools?.checked ? webPageTools : []),
        ...(llmCastMediaTools?.checked ? castMediaTools : []),
        ...(llmNoteFileTools?.checked ? noteFileTools : [])
      ];
      send({
        type: "session.update",
        session: {
          type: "realtime",
          instructions: buildSessionInstructions(),
          ...ttsRuntimeConfig(),
          tools: enabledTools,
          tool_choice: enabledTools.length ? "auto" : "none",
          turn_detection: {
            interrupt_response: true
          }
        }
      });
      log(
        events,
        enabledTools.length
          ? `LLM tools attached: ${enabledTools.map((tool) => tool.name).join(", ")}`
          : "LLM tools disabled; STS lifecycle controls face"
      );
    }

    async function ensurePlayback() {
      audioContext ||= new AudioContext({ sampleRate: 16000 });
      if (audioContext.state === "suspended") await audioContext.resume();
    }

    function clearAudioQueue() {
      if (audioFlushTimer) clearTimeout(audioFlushTimer);
      audioFlushTimer = null;
      audioChunks = [];
      audioChunkBytes = 0;
    }

    function outputAudioActive() {
      return Boolean(
        audioChunkBytes > 0 ||
        (audioContext && playbackTime > audioContext.currentTime + 0.08) ||
        activeAudioSources.size
      );
    }

    function stopPlaybackNow() {
      clearAudioQueue();
      for (const source of activeAudioSources) {
        try {
          source.stop();
        } catch {
          // Already stopped.
        }
      }
      activeAudioSources.clear();
      if (audioContext) playbackTime = audioContext.currentTime;
    }

    function maybeBargeInFromMicPeak(peak) {
      if (!outputAudioActive()) return;
      if (peak < interruptPeakThreshold()) return;
      const now = Date.now();
      if (now - lastBargeInAt < bargeInCooldownMs) return;
      lastBargeInAt = now;
      stopPlaybackNow();
      if (ws && ws.readyState === WebSocket.OPEN) {
        send({ type: "response.cancel" });
      }
      cueFaceMode("listening", 0.45, { force: true });
      log(events, `barge-in: peak ${peak.toFixed(2)}, sensitivity ${currentInterruptSensitivity()}/10`);
    }

    function joinAudioChunks() {
      const bytes = new Uint8Array(audioChunkBytes);
      let offset = 0;
      for (const chunk of audioChunks) {
        bytes.set(chunk, offset);
        offset += chunk.length;
      }
      audioChunks = [];
      audioChunkBytes = 0;
      return bytes;
    }

    async function playPcm16Bytes(bytes) {
      await ensurePlayback();
      const samples = pcm16ToFloat32(bytes);
      const buffer = audioContext.createBuffer(1, samples.length, 16000);
      buffer.copyToChannel(samples, 0);
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      activeAudioSources.add(source);
      source.onended = () => activeAudioSources.delete(source);
      const now = audioContext.currentTime;
      playbackTime = Math.max(playbackTime, now + 0.03);
      source.start(playbackTime);
      playbackTime += buffer.duration;
    }

    async function flushAudioQueue() {
      if (!audioChunkBytes) return;
      if (audioFlushTimer) clearTimeout(audioFlushTimer);
      audioFlushTimer = null;
      await playPcm16Bytes(joinAudioChunks());
    }

    function queueAudioDelta(b64) {
      const bytes = b64ToBytes(b64);
      audioChunks.push(bytes);
      audioChunkBytes += bytes.length;
      if (audioChunkBytes >= minPlaybackBytes) {
        flushAudioQueue().catch((error) => log(events, `audio playback error: ${error.message}`));
        return;
      }
      if (!audioFlushTimer) {
        audioFlushTimer = setTimeout(() => {
          flushAudioQueue().catch((error) => log(events, `audio playback error: ${error.message}`));
        }, audioFlushMs);
      }
    }

    function handleEvent(event) {
      if (event.type === "response.output_audio.delta" && event.delta) {
        cueFaceMode("speaking", 0.72);
        queueAudioDelta(event.delta);
        return;
      }
      if (event.type === "response.output_audio.done" || event.type === "response.done") {
        flushAudioQueue().catch((error) => log(events, `audio playback error: ${error.message}`));
        if (event.type === "response.done" && toolFollowupNeeded) {
          responseDoneAfterTool = true;
          maybeCreateToolFollowup();
        }
        if (event.type === "response.done") {
          responseActive = false;
          idleInFlight = false;
          noteConversationActivity();
        }
        if (!toolFollowupNeeded) scheduleFaceIdle();
      }
      if (event.type === "input_audio_buffer.speech_started") {
        noteConversationActivity();
        cueFaceMode("listening", 0.35);
      } else if (event.type === "input_audio_buffer.speech_stopped") {
        cueFaceMode("thinking", 0.45);
      } else if (event.type === "response.created") {
        responseActive = true;
        cueFaceMode("thinking", 0.45);
      } else if (event.type === "conversation.item.input_audio_transcription.delta") {
        updateInputDraft(event.delta || "");
      } else if (event.type === "conversation.item.input_audio_transcription.completed") {
        clearInputDraft();
        const recorded = recordUserTranscript(event.transcript || "");
        if (!recorded.accepted) return;
        idleExhaustionCount = 0;
        idleCooldownUntil = 0;
        if (!maybeHandleDirectFaceCommand(recorded.transcript)) cueFaceMode("thinking", 0.45);
      } else if (event.type === "response.output_audio_transcript.done") {
        lastUserConversationIndex = -1;
        if (idleInFlight) {
          noteIdleOutput(event.transcript || "");
          commitIdleAssistantTranscript(event.transcript || "");
        }
        noteAssistantText(event.transcript || "");
        addConversation(`Robot 790: ${event.transcript || ""}`);
      } else if (event.type === "response.output_text.delta") {
        lastUserConversationIndex = -1;
        addConversation(`Robot 790: ${event.delta || ""}`);
      } else if (event.type === "response.function_call_arguments.done") {
        handleFunctionCall(event).catch((error) => log(events, `tool bridge error: ${error.message}`));
      } else if (event.type === "error") {
        responseActive = false;
        idleInFlight = false;
        scheduleIdlePonder();
        log(events, `ERROR ${event.error?.type || ""}: ${event.error?.message || JSON.stringify(event)}`);
      }
      log(events, event.type || JSON.stringify(event));
    }

    async function connect() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      setState("Connecting", "warn");
      await ensurePlayback();
      ws = new WebSocket(serverUrl.value.trim());
      ws.addEventListener("open", () => {
        setState("Connected", "ok");
        connectButton.disabled = true;
        disconnectButton.disabled = false;
        startMicButton.disabled = false;
        faceIdleButton.disabled = false;
        faceBeatButton.disabled = false;
        idlePonderNowButton.disabled = false;
        updateVisionButtons();
        stageVisionImage();
        log(events, "connected");
        noteConversationActivity();
        updateSessionTools();
      });
      ws.addEventListener("message", (message) => {
        try {
          handleEvent(JSON.parse(message.data));
        } catch (error) {
          log(events, `bad event: ${error.message}`);
        }
      });
      ws.addEventListener("close", () => {
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = null;
        responseActive = false;
        idleInFlight = false;
        clearAudioQueue();
        setState("Disconnected");
        connectButton.disabled = false;
        disconnectButton.disabled = true;
        startMicButton.disabled = true;
        stopMicButton.disabled = true;
        faceIdleButton.disabled = true;
        faceBeatButton.disabled = true;
        idlePonderNowButton.disabled = true;
        updateVisionButtons();
        log(events, "disconnected");
      });
      ws.addEventListener("error", () => {
        setState("Socket error");
        log(events, "websocket error");
      });
    }

    async function restartRealtimeServer() {
      restartServerButton.disabled = true;
      log(events, "realtime restart requested");
      try {
        if (micStream) await stopMic();
      } catch (error) {
        log(events, `mic stop during restart error: ${error.message}`);
      }
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      clearAudioQueue();
      setState("Restarting realtime", "warn");
      connectButton.disabled = true;
      disconnectButton.disabled = true;

      try {
        const response = await fetch(new URL("/api/realtime/restart", location.href), {
          method: "POST",
          cache: "no-store"
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.status === "error") {
          throw new Error(result.error || `${response.status} ${response.statusText}`);
        }
        log(events, `realtime restart started: pid ${result.pid || "unknown"}`);
        setTimeout(() => {
          restartServerButton.disabled = false;
          connectButton.disabled = false;
          setState("Disconnected");
          log(events, "realtime restart launched; reconnect when ready");
        }, 5000);
      } catch (error) {
        restartServerButton.disabled = false;
        connectButton.disabled = false;
        setState("Restart failed");
        log(events, `realtime restart error: ${error.message}`);
      }
    }

    async function startMic({ reason = "" } = {}) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (micStream) return;
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1
        }
      });
      micContext = new AudioContext();
      micSource = micContext.createMediaStreamSource(micStream);
      micProcessor = micContext.createScriptProcessor(2048, 1, 1);
      micProcessor.onaudioprocess = (event) => {
        const input = event.inputBuffer.getChannelData(0);
        let peak = 0;
        for (const sample of input) peak = Math.max(peak, Math.abs(sample));
        level.style.width = `${Math.min(100, peak * 180)}%`;
        maybeBargeInFromMicPeak(peak);
        const pcm16 = float32ToPcm16(resample(input, micContext.sampleRate, 16000));
        send({ type: "input_audio_buffer.append", audio: bytesToB64(pcm16) });
      };
      micSource.connect(micProcessor);
      micProcessor.connect(micContext.destination);
      startMicButton.disabled = true;
      stopMicButton.disabled = false;
      log(events, reason ? `mic started: ${reason}` : "mic started");
    }

    async function stopMic({ reason = "" } = {}) {
      if (micProcessor) micProcessor.disconnect();
      if (micSource) micSource.disconnect();
      if (micStream) micStream.getTracks().forEach((track) => track.stop());
      if (micContext) await micContext.close();
      micProcessor = null;
      micSource = null;
      micStream = null;
      micContext = null;
      level.style.width = "0";
      startMicButton.disabled = !(ws && ws.readyState === WebSocket.OPEN);
      stopMicButton.disabled = true;
      log(events, reason ? `mic stopped: ${reason}` : "mic stopped");
    }

    connectButton.addEventListener("click", connect);
    disconnectButton.addEventListener("click", () => ws?.close());
    restartServerButton.addEventListener("click", () => {
      restartRealtimeServer().catch((error) => log(events, `realtime restart error: ${error.message}`));
    });
    faceIdleButton.addEventListener("click", () => setFaceMode({ mode: "idle" }).then(
      (result) => log(events, `face idle: ${JSON.stringify(result)}`),
      (error) => log(events, `face idle error: ${error.message}`)
    ));
    faceBeatButton.addEventListener("click", () => playFaceBeat({ name: "slow_smile" }).then(
      (result) => log(events, `face beat: ${JSON.stringify(result)}`),
      (error) => log(events, `face beat error: ${error.message}`)
    ));
    chassisStopButton.addEventListener("click", () => setChassis({ action: "stop" }).then(
      (result) => log(events, `chassis stop: ${JSON.stringify(result)}`),
      (error) => log(events, `chassis stop error: ${error.message}`)
    ));
    startMicButton.addEventListener("click", () => {
      if (castPlaybackActive) micPausedForCast = false;
      startMic().catch((error) => log(events, `mic error: ${error.message}`));
    });
    stopMicButton.addEventListener("click", () => {
      micPausedForCast = false;
      stopMic().catch((error) => log(events, `mic stop error: ${error.message}`));
    });
    visionDrop.addEventListener("click", () => visionFile.click());
    visionDrop.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        visionFile.click();
      }
    });
    visionDrop.addEventListener("dragover", (event) => {
      event.preventDefault();
      visionDrop.classList.add("dragover");
    });
    visionDrop.addEventListener("dragleave", () => {
      visionDrop.classList.remove("dragover");
    });
    visionDrop.addEventListener("drop", (event) => {
      event.preventDefault();
      visionDrop.classList.remove("dragover");
      const file = event.dataTransfer?.files?.[0];
      prepareVisionImage(file).catch((error) => log(events, `vision image error: ${error.message}`));
    });
    visionFile.addEventListener("change", () => {
      const file = visionFile.files?.[0];
      prepareVisionImage(file).catch((error) => log(events, `vision image error: ${error.message}`));
    });
    visionClearButton.addEventListener("click", clearVisionImage);
    llmTools.addEventListener("change", updateSessionTools);
    llmChassisTools.addEventListener("change", updateSessionTools);
    llmMemoryTools.addEventListener("change", updateSessionTools);
    llmWebSearchTools.addEventListener("change", updateSessionTools);
    llmWebPageTools.addEventListener("change", updateSessionTools);
    llmCastMediaTools.addEventListener("change", updateSessionTools);
    llmNoteFileTools.addEventListener("change", updateSessionTools);
    ttsVoice.addEventListener("change", () => updateSessionTtsStyle());
    ttsPreset.addEventListener("change", () => {
      if (ttsPreset.value === "custom") return;
      ttsInstruct.value = ttsStylePresets[ttsPreset.value] || "";
      updateSessionTtsStyle();
    });
    ttsApplyButton.addEventListener("click", () => {
      ttsPreset.value = Object.entries(ttsStylePresets)
        .find(([, value]) => value === currentTtsInstruct())?.[0] || "custom";
      updateSessionTtsStyle();
    });
    ttsInstruct.addEventListener("input", () => {
      ttsPreset.value = Object.entries(ttsStylePresets)
        .find(([, value]) => value === currentTtsInstruct())?.[0] || "custom";
      saveTtsStyle();
    });
    interruptSensitivity.addEventListener("input", updateInterruptSensitivityUi);
    idleDrift.addEventListener("input", updateIdleDriftUi);
    idleWonder.addEventListener("input", () => {
      updateIdleWonderUi();
      log(events, `idle wonder ${idleWonderLabel()}`);
    });
    idleSubstrateTest.addEventListener("change", () => {
      if (idleSubstrateTestEnabled()) {
        recentIdleOutputs = [];
        substrateIdleOutputs = [];
        idleTopicLedger = {};
      }
      log(events, `idle substrate test ${idleSubstrateTestEnabled() ? "on" : "off"}`);
    });
    idlePonderNowButton.addEventListener("click", () => {
      triggerIdlePonder({ manual: true }).catch((error) => log(events, `idle ponder error: ${error.message}`));
    });
    memoryRefreshButton.addEventListener("click", () => {
      renderMemory();
      updateSessionTools();
      log(events, "memory refreshed");
    });
    memoryForgetAllButton.addEventListener("click", () => {
      if (!window.confirm("Forget all Robot 790 browser memory facts?")) return;
      saveMemoryFacts([]);
      updateSessionTools();
      log(events, "memory cleared");
    });
    clearLogButton.addEventListener("click", () => {
      conversationLines = [];
      clearInputDraft();
      events.textContent = "";
    });
    copyConversationButton.addEventListener("click", () => {
      copyLogPane(copyConversationButton, conversation);
    });
    copyEventsButton.addEventListener("click", () => {
      copyLogPane(copyEventsButton, events);
    });
    settingsPanel.addEventListener("toggle", saveSettingsPanelState);
    micPanel.addEventListener("toggle", saveMicPanelState);
    populateTtsVoices();
    loadSettingsPanelState();
    loadMicPanelState();
    loadTtsVoice();
    loadTtsStyle();
    loadInterruptSensitivity();
    loadIdleDrift();
    loadIdleWonder();
    loadToolPrefs();
    renderMemory();
    updateVisionButtons();
    loadStartupNotes();
  </script>
</body>
</html>
