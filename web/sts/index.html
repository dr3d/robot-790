<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot 790 STS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --line: #30343b;
      --text: #f2f4f8;
      --muted: #aeb6c2;
      --accent: #60d394;
      --warn: #ffcf5a;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
    }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(980px, calc(100vw - 32px));
      height: 100vh;
      margin: 0 auto;
      padding: 28px 0 36px;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      white-space: nowrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--bad);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.16);
    }
    .dot.ok {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(96, 211, 148, 0.16);
    }
    .dot.warn {
      background: var(--warn);
      box-shadow: 0 0 0 3px rgba(255, 207, 90, 0.16);
    }
    section {
      border-top: 1px solid var(--line);
      padding: 18px 0;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }
    .url-controls {
      grid-template-columns: minmax(260px, 460px) auto auto minmax(0, 1fr);
    }
    .url-controls .toggle-row {
      justify-self: start;
    }
    .voice-controls {
      grid-template-columns: minmax(120px, 160px) minmax(260px, 420px) minmax(140px, 180px) auto auto;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, textarea, select, button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
    }
    input[type="checkbox"] {
      width: auto;
      padding: 0;
      accent-color: var(--accent);
    }
    textarea {
      min-height: 84px;
      resize: vertical;
    }
    input.compact-text {
      min-height: 40px;
    }
    textarea[readonly] {
      resize: none;
      color: var(--muted);
    }
    select {
      min-height: 40px;
    }
    button {
      min-height: 40px;
      padding: 0 14px;
      cursor: pointer;
    }
    button.primary {
      border-color: rgba(96, 211, 148, 0.55);
      background: #1d2b24;
    }
    button.danger {
      border-color: rgba(255, 107, 107, 0.55);
      background: #2d1f21;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .log-grid {
      flex: 1;
      min-height: 0;
      padding-bottom: 0;
    }
    .log-grid > div {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .log {
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .meters {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }
    .bar {
      flex: 1;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #242830;
    }
    .bar > span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 80ms linear;
    }
    .toggle-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0;
    }
    @media (max-width: 720px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      main {
        height: auto;
        min-height: 100vh;
      }
      header, .controls, .url-controls, .voice-controls, .grid {
        grid-template-columns: 1fr;
        align-items: stretch;
      }
      header { display: grid; }
      .status { white-space: normal; }
      .log-grid {
        flex: none;
      }
      .log {
        height: 280px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Robot 790 STS</h1>
      <div class="status"><span id="dot" class="dot"></span><span id="state">Disconnected</span></div>
    </header>

    <section class="controls url-controls">
      <label>
        Realtime server
        <input id="serverUrl" value="ws://127.0.0.1:8765/v1/realtime" spellcheck="false">
      </label>
      <button id="connect" class="primary">Connect</button>
      <button id="disconnect" class="danger" disabled>Disconnect</button>
    </section>

    <section class="controls">
      <div class="meters">
        <span>Mic</span>
        <div class="bar"><span id="level"></span></div>
      </div>
      <button id="startMic" disabled>Start Mic</button>
      <button id="stopMic" disabled>Stop Mic</button>
    </section>

    <section class="controls url-controls">
      <label>
        Face controller
        <input id="faceUrl" value="http://esp32-eyes.local/" spellcheck="false">
      </label>
      <button id="faceIdle" disabled>Idle Face</button>
      <button id="faceBeat" disabled>Beat</button>
      <span class="toggle-row"><input id="llmTools" type="checkbox" checked> LLM face tools</span>
    </section>

    <section class="controls url-controls">
      <label>
        Chassis controller
        <input id="chassisUrl" value="http://esp32-chassis.local/" spellcheck="false">
      </label>
      <button id="chassisStop" class="danger">Stop</button>
      <span class="toggle-row"><input id="llmChassisTools" type="checkbox" checked> LLM chassis tools</span>
    </section>

    <section class="controls voice-controls">
      <label>
        Voice
        <select id="ttsVoice" aria-label="Qwen3-TTS voice"></select>
      </label>
      <label>
        Voice style
        <input id="ttsInstruct" class="compact-text" spellcheck="false">
      </label>
      <select id="ttsPreset" aria-label="Voice style preset">
        <option value="neutral">Neutral</option>
        <option value="dry">Dry Eric</option>
        <option value="happy">Happy</option>
        <option value="ominous">Ominous</option>
        <option value="troll">Troll-ish</option>
        <option value="sleepy">Sleepy</option>
        <option value="excited">Excited</option>
        <option value="custom">Custom</option>
      </select>
      <button id="ttsApply">Apply</button>
      <button id="clearLog">Clear</button>
    </section>

    <section class="controls">
      <label>
        Memory
        <textarea id="memoryPreview" readonly spellcheck="false"></textarea>
        <span class="toggle-row"><input id="llmMemoryTools" type="checkbox"> LLM memory tools</span>
        <span class="toggle-row"><input id="llmWebSearchTools" type="checkbox" checked> LLM web search</span>
      </label>
      <button id="memoryRefresh">Refresh</button>
      <button id="memoryForgetAll">Forget All</button>
    </section>

    <section class="grid log-grid">
      <div>
        <label>Conversation</label>
        <div id="conversation" class="log"></div>
      </div>
      <div>
        <label>Events</label>
        <div id="events" class="log"></div>
      </div>
    </section>
  </main>

  <script>
    const serverUrl = document.querySelector("#serverUrl");
    const faceUrl = document.querySelector("#faceUrl");
    const chassisUrlInput = document.querySelector("#chassisUrl");
    const connectButton = document.querySelector("#connect");
    const disconnectButton = document.querySelector("#disconnect");
    const faceIdleButton = document.querySelector("#faceIdle");
    const faceBeatButton = document.querySelector("#faceBeat");
    const chassisStopButton = document.querySelector("#chassisStop");
    const llmTools = document.querySelector("#llmTools");
    const llmChassisTools = document.querySelector("#llmChassisTools");
    const llmMemoryTools = document.querySelector("#llmMemoryTools");
    const llmWebSearchTools = document.querySelector("#llmWebSearchTools");
    const memoryPreview = document.querySelector("#memoryPreview");
    const memoryRefreshButton = document.querySelector("#memoryRefresh");
    const memoryForgetAllButton = document.querySelector("#memoryForgetAll");
    const ttsVoice = document.querySelector("#ttsVoice");
    const ttsInstruct = document.querySelector("#ttsInstruct");
    const ttsPreset = document.querySelector("#ttsPreset");
    const ttsApplyButton = document.querySelector("#ttsApply");
    const startMicButton = document.querySelector("#startMic");
    const stopMicButton = document.querySelector("#stopMic");
    const clearLogButton = document.querySelector("#clearLog");
    const state = document.querySelector("#state");
    const dot = document.querySelector("#dot");
    const level = document.querySelector("#level");
    const conversation = document.querySelector("#conversation");
    const events = document.querySelector("#events");

    let ws;
    let audioContext;
    let micContext;
    let micStream;
    let micSource;
    let micProcessor;
    let playbackTime = 0;
    const audioFlushMs = 120;
    const minPlaybackBytes = 9600;
    let audioChunks = [];
    let audioChunkBytes = 0;
    let audioFlushTimer;
    let conversationLines = [];
    let inputDraft = "";
    let lastUserText = "";
    let recentUserTexts = [];
    let memorySaveArmedUntil = 0;
    let pendingToolCalls = 0;

    let gazeHoldUntil = 0;

    const memoryStorageKey = "robot790.memory.v1";
    const toolPrefsStorageKey = "robot790.toolPrefs.v2";
    const ttsVoiceStorageKey = "robot790.ttsVoice.v1";
    const ttsStyleStorageKey = "robot790.ttsStyle.v1";
    const maxMemoryFacts = 80;
    const maxMemoryNameChars = 48;
    const maxMemoryFactChars = 320;
    const ttsStylePresets = {
      neutral: "",
      dry: "Speak as Eric with dry wit, natural pacing, restrained warmth, and crisp articulation.",
      happy: "Speak as Eric with brighter warmth, a small smile in the voice, and relaxed upbeat energy.",
      ominous: "Speak as Eric with a low, quiet, ominous tone, slow pacing, and controlled theatrical tension.",
      troll: "Speak as Eric with a low raspy texture, mischievous theatrical energy, and playful menace.",
      sleepy: "Speak as Eric with soft volume, slower pacing, relaxed breath, and drowsy warmth.",
      excited: "Speak as Eric with quick bright energy, lively emphasis, and clear delighted pacing."
    };
    const qwen3TtsVoices = ["Aiden", "Ryan", "Dylan", "Eric", "Ono_Anna", "Serena", "Sohee", "Uncle_Fu", "Vivian"];
    const chassisMaxSpeed = 1.0;
    const maxChassisDurationS = 5;
    let chassisBusyUntil = 0;

    const faceTools = [
      {
        type: "function",
        name: "set_robot_mode",
        description: "Set Robot 790's ESP32 face state only when the user asks for a face or body state change. Use sleeping when the user says go to sleep, close your eyes, or sleep.",
        parameters: {

    const chassisTools = [

        ),

            },

            },

            }
          },

        }
      }
    ];

    const memoryTools = [
      {
        type: "function",
        name: "remember_fact",
        description: (
          "Persist one named fact only when the user explicitly asks Robot 790 to remember it. " +
          "Use stable facts such as names, preferences, projects, or robot setup details. " +
          "Do not save passwords, addresses, payment data, medical details, or fleeting chatter."
        ),
        parameters: {
          type: "object",
          properties: {
            name: {
              type: "string",
              description: "Short snake_case memory key, such as user_name or current_project."
            },
            fact: {
              type: "string",
              description: "One short sentence containing the fact to remember."
            }
          },
          required: ["name", "fact"],
          additionalProperties: false
        }
      },
      {
        type: "function",
        name: "forget_fact",
        description: "Remove one named persistent fact when the user explicitly asks Robot 790 to forget it.",
        parameters: {
          type: "object",
          properties: {

              type: "string",
              description: "Short snake_case memory key to remove."
            }
          },
          required: ["name"],
          additionalProperties: false
        }
      }
    ];

    const searchTools = [
      {
        type: "function",
        name: "search_web",
        description: (
          "Search the web for current information and return compact title, snippet, and URL results. " +
          "Call this directly when the user asks Robot 790 to search, look something up, check the web, " +
          "find current information, or learn what is happening now."
        ),
        parameters: {
          type: "object",
          properties: {
            query: {
              type: "string",
              description: "Search query."
            },
            max_results: {
              type: "integer",
              minimum: 1,
              maximum: 10,
              default: 5,
              description: "Maximum number of search results to return."
            }
          },
          required: ["query"],
          additionalProperties: false
        }
      }
    ];

    const baseSessionInstructions = [
      "You are Robot 790, spoken name Eric.",
      "You are a local animatronic robot head with ESP32 eyes and mouth displays.",
      "You are being built for a 790-style 3D printed robot body.",
      "Reply in one short spoken sentence by default, under 12 words when possible.",
      "Never say you lack a body; refer to your robot face/body as your hardware.",
      "Do not use tools for ordinary greetings or conversation.",
      "When the user asks for a face, expression, mood, gaze, chassis, or body action, call an appropriate robot tool before answering.",
      "For go to sleep, close your eyes, sleepy eyes, or sleep mode, call set_robot_mode with mode sleeping before answering; do not merely describe the action.",
      "For wake up or open your eyes, call set_robot_mode with mode idle before answering.",
      "Never say you set, moved, closed, opened, or changed your eyes unless an eye or face tool was actually called successfully.",
      "Use set_face_mood for named moods such as glitchy, goofy, happy, curious, confused, focused, suspicious, or mischief.",
      "Use play_face_beat for animated beats such as funny face, silly face, scan, double take, startle, mischief, thoughtful, or slow smile.",
      "Use set_eye_gaze when the user asks you to look or aim your eyes in a direction.",
      "Use set_chassis only for explicit drive-base, wheel, track, move, turn, stop, or e-stop requests.",
      "For chassis movement, prefer slow values around 0.2 to 0.35 and one short timed segment; never queue a route, dance, or multi-step movement.",
      "If the user asks for full speed or maximum speed in a short explicit movement, use set_chassis speed 1.0 for that segment, matching the chassis web UI MAX SPEED setting.",
      "Do not refuse a clear short movement merely because the user said maximum speed; the chassis firmware applies the voltage duty cap.",
      "Use positive chassis turn values for right turns and negative values for left turns.",
      "For a turn-in-place, call set_chassis with action twist, velocity 0, and a positive or negative turn; never invent turn_right or turn_left actions.",
      "If the user asks for multiple movement steps, perform only the first safe segment, then ask for the next movement as a new command.",
      "Never output XML, function-call tags, parameter tags, or hidden tool syntax in spoken text.",
      "Use search_web whenever the user asks you to search, look something up, check the web, find current information, or answer something likely to have changed recently.",
      "When using search_web, summarize the result briefly and naturally; mention the source site when useful.",
      "Use memory tools only when the user explicitly asks you to remember or forget a named fact, or when you just asked the user to provide a fact so you could save it and the user provides that fact in the next turn.",
      "When remembering, choose a short snake_case name and one factual sentence.",
      "Never say you saved, stored, or remembered a fact unless you actually called remember_fact successfully.",
      "If you use a tool, still answer briefly afterward."
    ];

    function normalizeMemoryName(name) {
      return String(name || "")
        .trim()
        .toLowerCase()
        .replace(/[-\s]+/g, "_")
        .replace(/[^a-z0-9_]/g, "")
        .replace(/^_+|_+$/g, "")
        .slice(0, maxMemoryNameChars);
    }

    function normalizeMemoryFact(fact) {
      const normalized = String(fact || "").split(/\s+/).filter(Boolean).join(" ").trim();
      if (normalized.length <= maxMemoryFactChars) return normalized;
      return `${normalized.slice(0, maxMemoryFactChars - 3)}...`;
    }

    function loadMemoryFacts() {
      let parsed;
      try {
        parsed = JSON.parse(localStorage.getItem(memoryStorageKey) || "{}");
      } catch {
        parsed = {};
      }
      const source = Array.isArray(parsed.facts) ? parsed.facts : [];
      const seen = new Set();
      const facts = [];
      for (const item of source) {
        const name = normalizeMemoryName(item?.name);
        const fact = normalizeMemoryFact(item?.fact);
        const updatedAt = Number(item?.updatedAt) || Date.now();
        if (!name || !fact || seen.has(name)) continue;
        seen.add(name);
        facts.push({ name, fact, updatedAt });
      }
      return facts.slice(0, maxMemoryFacts);
    }

    function saveMemoryFacts(facts) {
      const payload = {
        version: 1,
        facts: facts.slice(0, maxMemoryFacts)
      };
      localStorage.setItem(memoryStorageKey, JSON.stringify(payload));
      renderMemory();
    }

    function rememberMemoryFact({ name, fact } = {}) {
      if (!memoryWriteAllowed(lastUserText)) {
        throw new Error("Memory writes require an explicit remember-this request or a just-armed save flow");
      }
      const normalizedName = normalizeMemoryName(name);
      const normalizedFact = normalizeMemoryFact(fact);
      if (!normalizedName) throw new Error("Missing required argument: name");
      if (!normalizedFact) throw new Error("Missing required argument: fact");
      if (!memoryFactAppearsInUserEvidence(normalizedFact)) {
        throw new Error("Memory fact must be grounded in recent user turns; nothing was saved");
      }
      if (isPlaceholderMemoryFact(normalizedFact)) {
        throw new Error("Memory fact is a placeholder or inferred unknown; nothing was saved");
      }

      const stored = { name: normalizedName, fact: normalizedFact, updatedAt: Date.now() };
      const remaining = loadMemoryFacts().filter((item) => item.name !== normalizedName);
      saveMemoryFacts([stored, ...remaining]);
      memorySaveArmedUntil = 0;
      return { status: "ok", tool: "remember_fact", name: stored.name, fact: stored.fact };
    }

    function forgetMemoryFact({ name } = {}) {
      if (!userExplicitlyAskedToForget(lastUserText)) {
        throw new Error("Memory deletion requires an explicit forget/remove/delete request in the current user turn");
      }
      const normalizedName = normalizeMemoryName(name);
      if (!normalizedName) throw new Error("Missing required argument: name");

      const facts = loadMemoryFacts();
      const removed = facts.find((item) => item.name === normalizedName);
      if (!removed) throw new Error(`No memory fact named '${normalizedName}'`);
      saveMemoryFacts(facts.filter((item) => item.name !== normalizedName));
      return { status: "ok", tool: "forget_fact", name: removed.name, removed: removed.fact };
    }

    function memoryWriteAllowed(text) {
      return userExplicitlyAskedForMemory(text) || memorySaveArmed();
    }

    function memorySaveArmed() {
      return memorySaveArmedUntil > Date.now();
    }

    function noteAssistantText(text) {
      if (assistantArmedMemorySave(text)) {
        memorySaveArmedUntil = Date.now() + 45000;
      }
    }

    function assistantArmedMemorySave(text) {
      const value = String(text || "");
      return /\b(remind me|tell me|provide it|give me)\b[\s\S]{0,80}\b(save|remember|store)\b/i.test(value)
        || /\b(would you like me to|want me to)\b[\s\S]{0,80}\b(remember|save|store)\b/i.test(value);
    }

    function userExplicitlyAskedForMemory(text) {
      return /\b(remember|memorize|save|store|note)\b\s+(that\s+|this\s+|my\s+|our\s+|the\s+|[a-z0-9])/i.test(text || "");
    }

    function userExplicitlyAskedToForget(text) {
      return /\b(forget|remove|delete|erase|clear)\b/i.test(text || "");
    }

    function isPlaceholderMemoryFact(text) {
      return /\b(not yet known|unknown|not known|unspecified|not provided|do not know|don't know|unclear)\b/i.test(text || "");
    }

    function memoryFactAppearsInUserEvidence(fact) {
      return memoryFactAppearsInUserTurn(fact, lastUserText)
        || memoryFactAppearsInUserTurn(fact, recentUserTexts.join(" "));
    }

    function memoryFactAppearsInUserTurn(fact, text) {
      const factTokens = memoryTokens(fact);
      const textTokens = new Set(memoryTokens(text));
      if (!factTokens.length) return false;
      const grounded = factTokens.filter((token) => textTokens.has(token)).length;
      return grounded >= Math.min(2, factTokens.length);
    }

    function memoryTokens(text) {
      const stop = new Set([
        "a", "an", "and", "are", "as", "be", "can", "could", "do", "for", "has", "have", "her", "his",
        "is", "it", "me", "my", "name", "of", "our", "please", "remember", "save", "scott", "store",
        "that", "the", "their", "to", "user", "whose", "you"
      ]);
      return String(text || "")
        .toLowerCase()
        .match(/[a-z0-9]+/g)
        ?.filter((token) => token.length > 2 && !stop.has(token)) || [];
    }

    function formatMemoryForInstructions() {
      const facts = loadMemoryFacts();
      if (!facts.length) return "";
      return [
        "Persistent named facts you remember about the user and Robot 790's context:",
        ...facts.map((item) => `- ${item.name}: ${item.fact}`),
        "Use these facts naturally. Do not recite them as a list unless asked."
      ].join("\n");
    }

    function buildSessionInstructions() {
      return [formatMemoryForInstructions(), baseSessionInstructions.join(" ")]
        .filter(Boolean)
        .join("\n\n");
    }

    function currentTtsInstruct() {
      return String(ttsInstruct.value || "").trim();
    }

    function currentTtsVoice() {
      const voice = String(ttsVoice.value || "").trim();
      return qwen3TtsVoices.includes(voice) ? voice : "Eric";
    }

    function populateTtsVoices() {
      ttsVoice.replaceChildren(
        ...qwen3TtsVoices.map((voice) => {
          const option = document.createElement("option");
          option.value = voice;
          option.textContent = voice;
          return option;
        })
      );
    }

    function loadTtsVoice() {
      const saved = localStorage.getItem(ttsVoiceStorageKey);
      ttsVoice.value = qwen3TtsVoices.includes(saved) ? saved : "Eric";
    }

    function saveTtsVoice() {
      localStorage.setItem(ttsVoiceStorageKey, currentTtsVoice());
    }

    function loadTtsStyle() {
      const saved = localStorage.getItem(ttsStyleStorageKey);
      if (saved !== null) {
        ttsInstruct.value = saved;
        const matchingPreset = Object.entries(ttsStylePresets)
          .find(([, value]) => value === saved)?.[0];
        ttsPreset.value = matchingPreset || "custom";
        return;
      }
      ttsPreset.value = "dry";
      ttsInstruct.value = ttsStylePresets.dry;
    }

    function saveTtsStyle() {
      localStorage.setItem(ttsStyleStorageKey, currentTtsInstruct());
    }

    function ttsRuntimeConfig() {
      const instruct = currentTtsInstruct();
      const voice = currentTtsVoice();
      return {
        qwen3_tts_speaker: voice,
        qwen3_tts_instruct: instruct,
        audio: {
          output: {
            voice,
            qwen3_tts_speaker: voice,
            qwen3_tts_instruct: instruct
          }
        }
      };
    }

    function updateSessionTtsStyle({ announce = true } = {}) {
      saveTtsVoice();
      saveTtsStyle();
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        if (announce) log(events, "voice settings saved; reconnect or apply after connecting");
        return;
      }
      send({
        type: "session.update",
        session: {
          type: "realtime",
          ...ttsRuntimeConfig()
        }
      });
      if (announce) {
        log(events, currentTtsInstruct()
          ? `voice ${currentTtsVoice()} style applied`
          : `voice ${currentTtsVoice()} neutral`);
      }
    }

    function renderMemory() {
      const facts = loadMemoryFacts();
      memoryPreview.value = facts.length
        ? facts.map((item) => `${item.name}: ${item.fact}`).join("\n")
        : "No saved facts";
    }

    function loadToolPrefs() {
      let prefs = {};
      try {
        prefs = JSON.parse(localStorage.getItem(toolPrefsStorageKey) || "{}");
      } catch {
        prefs = {};
      }
      llmTools.checked = prefs.faceTools !== false;
      llmChassisTools.checked = prefs.chassisTools !== false;
      llmMemoryTools.checked = prefs.memoryTools !== false;
      llmWebSearchTools.checked = prefs.webSearchTools !== false;
    }

    function saveToolPrefs() {
      localStorage.setItem(toolPrefsStorageKey, JSON.stringify({
        faceTools: llmTools.checked,
        chassisTools: llmChassisTools.checked,
        memoryTools: llmMemoryTools.checked,
        webSearchTools: llmWebSearchTools.checked
      }));
    }

    function setState(text, kind = "bad") {
      state.textContent = text;
      dot.className = `dot ${kind === "ok" ? "ok" : kind === "warn" ? "warn" : ""}`;
    }

    function log(target, text) {
      const stamp = new Date().toLocaleTimeString();
      target.textContent += `[${stamp}] ${text}\n`;
      target.scrollTop = target.scrollHeight;
    }

    function renderConversation() {
      const lines = [...conversationLines];
      if (inputDraft) lines.push(inputDraft);
      conversation.textContent = lines.join("\n") + (lines.length ? "\n" : "");
      conversation.scrollTop = conversation.scrollHeight;
    }

    function addConversation(text) {
      const stamp = new Date().toLocaleTimeString();
      conversationLines.push(`[${stamp}] ${text}`);
      renderConversation();
    }

    function noteUserText(text) {
      lastUserText = String(text || "").trim();
      if (lastUserText) recentUserTexts = [...recentUserTexts, lastUserText].slice(-8);
    }

    function updateInputDraft(text) {
      const stamp = new Date().toLocaleTimeString();
      inputDraft = `[${stamp}] You ... ${text}`;
      renderConversation();
    }

    function clearInputDraft() {
      inputDraft = "";
      renderConversation();
    }

    function b64ToBytes(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function bytesToB64(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function pcm16ToFloat32(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const output = new Float32Array(bytes.byteLength / 2);
      for (let i = 0; i < output.length; i += 1) {
        const sample = view.getInt16(i * 2, true);
        output[i] = Math.max(-1, Math.min(1, sample / 32768));
      }
      return output;
    }

    function float32ToPcm16(float32) {
      const bytes = new Uint8Array(float32.length * 2);
      const view = new DataView(bytes.buffer);
      for (let i = 0; i < float32.length; i += 1) {
        const sample = Math.max(-1, Math.min(1, float32[i]));
        view.setInt16(i * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
      }
      return bytes;
    }

    function resample(input, fromRate, toRate) {
      if (fromRate === toRate) return input;
      const ratio = fromRate / toRate;
      const output = new Float32Array(Math.floor(input.length / ratio));
      for (let i = 0; i < output.length; i += 1) {
        const pos = i * ratio;
        const left = Math.floor(pos);
        const right = Math.min(input.length - 1, left + 1);
        const frac = pos - left;
        output[i] = input[left] * (1 - frac) + input[right] * frac;
      }
      return output;
    }

    function send(event) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(event));
    }

    function normalizeFaceBaseUrl() {
      return faceUrl.value.trim().replace(/\/?$/, "/");
    }

    function normalizeChassisBaseUrl() {
      return chassisUrlInput.value.trim().replace(/\/?$/, "/");
    }

    async function postFace(path, payload) {
      const response = await fetch(new URL(path, normalizeFaceBaseUrl()), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {})
      });
      const text = await response.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { raw: text };
      }
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}: ${text}`);
      }
      return data;
    }

    function chassisUrl(path, params = {}) {
      const url = new URL(path, normalizeChassisBaseUrl());
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null) url.searchParams.set(key, String(value));
      });
      return url;
    }

    async function requestChassis(path, { method = "POST", params = {} } = {}) {
      const response = await fetch(chassisUrl(path, params), { method, cache: "no-store" });
      const text = await response.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { raw: text };
      }
      if (!response.ok || data.ok === false) {
        throw new Error(`${response.status} ${response.statusText}: ${data.error || text}`);
      }
      return data;
    }

    function sleepMs(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function setFaceMode({ mode, energy = 0.55 } = {}) {
      if (mode === "idle") {
        clearGazeHold();
        clearFaceVisualHold();
        return postFace("release", {});
      }
      if (mode === "listening") {
        const payload = {
          expression: "focused",
          duration: 1.4
        };
        if (!gazeHoldActive()) payload.gaze = { x: 0.0, y: 0.0, duration: 1.4, move_ms: 120 };
        return postFace("control", payload);
      }
      if (mode === "thinking") {
        thinkingGazeSide *= -1;
        const payload = {
          expression: "focused",
          duration: 2.5
        };
        if (!gazeHoldActive()) {
          payload.gaze = {
            x: 0.34 * thinkingGazeSide,
            y: -0.22,
            duration: 2.5,
            move_ms: 280
          };
        }
        return postFace("control", payload);
      }
      if (mode === "speaking") {
        return postFace("control", {
          emotion: "happy",
          mouth: {
            shape: "open",
            talking: true,
            energy: Math.max(0, Math.min(1, Number(energy) || 0.55)),
            duration: 0
          }
        });
      }
      if (mode === "sleeping") {
        noteFaceVisualHold(0);
        return postFace("sleep", { duration: 0 });
      }
      throw new Error(`Unsupported face mode: ${mode}`);
    }

    function maybeHandleDirectFaceCommand(text) {
      const value = String(text || "");
      if (/\b(go to sleep|close your eyes|sleepy eyes|sleep mode)\b/i.test(value)) {
        noteFaceVisualHold(0);
        setFaceMode({ mode: "sleeping" }).then(
          (result) => log(events, `face direct sleep: ${JSON.stringify(result)}`),
          (error) => log(events, `face direct sleep error: ${error.message}`)
        );
        return true;
      }
      if (/\b(wake up|open your eyes)\b/i.test(value)) {
        clearFaceVisualHold();
        clearGazeHold();
        setFaceMode({ mode: "idle" }).then(
          (result) => log(events, `face direct idle: ${JSON.stringify(result)}`),
          (error) => log(events, `face direct idle error: ${error.message}`)
        );
        return true;
      }
      return false;
    }

    async function playFaceBeat({ name } = {}) {
      if (!name) throw new Error("Missing beat name");
      const result = await postFace("beat", { name });
      noteFaceVisualHold(5.5);
      return result;
    }

    async function setFaceMood({ name, duration = 0 } = {}) {
      if (!name) throw new Error("Missing mood name");
      const seconds = Math.max(0, Math.min(30, Number(duration) || 0));
      const payload = { name };
      if (seconds > 0) payload.duration = seconds;
      const result = await postFace("mood", payload);
      noteFaceVisualHold(seconds || 5);
      return result;
    }

    async function setEyeGaze({ x = 0, y = 0, duration = 2.0, move_ms = 180 } = {}) {
      const payload = {
        x: Math.max(-1, Math.min(1, Number(x) || 0)),
        y: Math.max(-1, Math.min(1, Number(y) || 0)),
        duration: Math.max(0, Math.min(30, Number(duration) || 0)),
        move_ms: Math.max(0, Math.min(2000, Number(move_ms) || 0))
      };
      const result = await postFace("gaze", payload);
      noteGazeHold(payload.duration, payload.move_ms);
      return result;
    }

    async function setChassis({ action, left, right, velocity, turn, duration_s = 0 } = {}) {
      const normalizedAction = String(action || "").trim().toLowerCase();
      if (!normalizedAction) throw new Error("Missing chassis action");

      if (normalizedAction === "status") return requestChassis("api/status", { method: "GET" });
      if (normalizedAction === "stop") return requestChassis("api/stop");
      if (normalizedAction === "estop") return requestChassis("api/estop");
      if (normalizedAction === "clear") return requestChassis("api/clear");

      const now = Date.now();
      if (chassisBusyUntil > now) {
        throw new Error("Chassis drive command already in progress; refusing to queue another movement.");
      }

      const duration = Math.max(0, Math.min(maxChassisDurationS, Number(duration_s) || 0));
      const durationMs = Math.round(duration * 1000);
      chassisBusyUntil = durationMs > 0 ? now + durationMs + 300 : now + 500;
      try {
        if (normalizedAction === "tank") {
          const params = {
            left: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(left) || 0)).toFixed(3),
            right: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(right) || 0)).toFixed(3)
          };
          if (durationMs > 0) params.duration_ms = durationMs;
          const drive = await requestChassis("api/tank", { params });
          if (durationMs > 0) {
            await sleepMs(durationMs);
            return { status: "ok", action: "tank", queued: false, drive, stop: await requestChassis("api/stop") };
          }
          return { status: "ok", action: "tank", queued: false, drive };
        }
        if (normalizedAction === "twist") {
          const params = {
            v: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(velocity) || 0)).toFixed(3),
            w: Math.max(-chassisMaxSpeed, Math.min(chassisMaxSpeed, Number(turn) || 0)).toFixed(3)
          };
          if (durationMs > 0) params.duration_ms = durationMs;
          const drive = await requestChassis("api/twist", { params });
          if (durationMs > 0) {
            await sleepMs(durationMs);
            return { status: "ok", action: "twist", queued: false, drive, stop: await requestChassis("api/stop") };
          }
          return { status: "ok", action: "twist", queued: false, drive };
        }
      } finally {
        if (durationMs <= 0) chassisBusyUntil = 0;
      }

      throw new Error(`Unsupported chassis action: ${normalizedAction}`);
    }

    async function searchWeb({ query, max_results = 5 } = {}) {
      const text = String(query || "").trim();
      if (!text) throw new Error("Missing search query");
      log(events, `web search: ${text}`);
      const url = new URL("/api/search", location.href);
      url.searchParams.set("q", text);
      url.searchParams.set("max_results", String(max_results || 5));
      const response = await fetch(url, { cache: "no-store" });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.status === "error") {
        throw new Error(result.error || `${response.status} ${response.statusText}`);
      }
      log(events, `web search results: ${result.results?.length || 0}`);
      return result;
    }

    function noteGazeHold(duration, moveMs) {
      const holdMs = Math.max(0, Math.min(30, Number(duration) || 0)) * 1000;
      const transitionMs = Math.max(0, Math.min(2000, Number(moveMs) || 0));
      gazeHoldIndefinite = holdMs === 0;
      gazeHoldUntil = gazeHoldIndefinite ? 0 : Date.now() + holdMs + transitionMs + 300;
    }

    function clearGazeHold() {
      gazeHoldUntil = 0;
      gazeHoldIndefinite = false;
    }

    function noteFaceVisualHold(duration) {
      const holdMs = Math.max(0, Math.min(30, Number(duration) || 0)) * 1000;
      faceVisualHoldIndefinite = holdMs === 0;
      faceVisualHoldUntil = faceVisualHoldIndefinite ? 0 : Date.now() + holdMs + 300;
    }

    function clearFaceVisualHold() {
      faceVisualHoldUntil = 0;
      faceVisualHoldIndefinite = false;
    }

    function gazeHoldActive() {
      return gazeHoldIndefinite || gazeHoldUntil > Date.now();
    }

    function faceVisualHoldActive() {
      return faceVisualHoldIndefinite || faceVisualHoldUntil > Date.now();
    }

    function gazeHoldRemainingMs() {
      if (gazeHoldIndefinite) return Infinity;
      return Math.max(0, gazeHoldUntil - Date.now());
    }

    function faceVisualHoldRemainingMs() {
      if (faceVisualHoldIndefinite) return Infinity;
      return Math.max(0, faceVisualHoldUntil - Date.now());
    }

    async function executeTool(name, rawArguments) {
      const args = parseToolArguments(rawArguments);
      if (name === "set_robot_mode") return setFaceMode(args);
      if (name === "play_face_beat") return playFaceBeat(args);
      if (name === "set_face_mood") return setFaceMood(args);
      if (name === "set_eye_gaze") return setEyeGaze(args);
      if (name === "set_chassis") return setChassis(args);
      if (name === "remember_fact") return rememberMemoryFact(args);
      if (name === "forget_fact") return forgetMemoryFact(args);
      if (name === "search_web") return searchWeb(args);
      throw new Error(`Unknown tool: ${name}`);
    }

    function parseToolArguments(rawArguments) {
      if (!rawArguments) return {};
      if (typeof rawArguments === "object") return rawArguments;
      return JSON.parse(rawArguments);
    }

    function cueFaceMode(mode, energy = 0.55, { force = false } = {}) {
      if (faceIdleTimer) clearTimeout(faceIdleTimer);
      faceIdleTimer = null;
      if (!force && mode !== "idle" && faceVisualHoldActive()) {
        log(events, `face ${mode} skipped; visual hold active`);
        return;
      }
      if (!force && faceMode === mode) return;
      faceMode = mode;
      setFaceMode({ mode, energy }).then(
        (result) => log(events, `face ${mode}: ${JSON.stringify(result)}`),
        (error) => log(events, `face ${mode} error: ${error.message}`)
      );
    }

    function scheduleFaceIdle(delayMs = 900) {
      if (faceIdleTimer) clearTimeout(faceIdleTimer);
      const gazeRemainingMs = gazeHoldRemainingMs();
      const visualRemainingMs = faceVisualHoldRemainingMs();
      if (gazeRemainingMs === Infinity || visualRemainingMs === Infinity) {
        log(events, "face idle delayed; hold is indefinite");
        return;
      }
      const actualDelayMs = Math.max(delayMs, gazeRemainingMs, visualRemainingMs);
      faceIdleTimer = setTimeout(() => {
        cueFaceMode("idle");
      }, actualDelayMs);
      if (actualDelayMs !== delayMs) log(events, `face idle delayed until hold ends: ${Math.round(actualDelayMs)}ms`);
    }

    function userAskedForMultipleMovements() {
      return /\b(and then|then|after that|followed by|next)\b/i.test(lastUserText || "");
    }

    function chassisFollowupText(result) {
      const action = String(result?.action || "").toLowerCase();
      if (result?.status === "error") return "I could not move.";
      if (action === "status") return "Status checked.";
      if (action === "stop") return "Stopped.";
      if (action === "estop") return "Emergency stop is set.";
      if (action === "clear") return "Emergency stop is clear.";
      if (userAskedForMultipleMovements()) return "First move done. Give me the next command.";
      return "Done.";
    }

    function memoryFollowupText(toolName, result) {
      if (result?.status === "error") return "I could not save that.";
      if (toolName === "remember_fact") return "I'll remember that.";
      if (toolName === "forget_fact") return "I forgot that.";
      return "Done.";
    }

    function exactSpeechInstruction(text) {
      const safeText = String(text || "Done.").replace(/["\\]/g, "");
      return `Say exactly this and nothing else: "${safeText}"`;
    }

    function searchFollowupInstructions(result) {
      const count = Array.isArray(result?.results) ? result.results.length : 0;
      if (!count) return exactSpeechInstruction("I searched, but found nothing useful.");
      return (
        "Use the search_web tool output in the conversation to answer the user's question in one short spoken sentence. " +
        "Mention the source site when useful. Do not say you cannot browse or search. Do not mention tools, JSON, or URLs unless the user asked for links."
      );
    }

    async function handleFunctionCall(event) {
      pendingToolCalls += 1;
      toolFollowupNeeded = true;
      try {
        const result = await executeTool(event.name, event.arguments);
        if (event.name === "set_chassis") toolFollowupExactText = chassisFollowupText(result);
        if (event.name === "remember_fact" || event.name === "forget_fact") {
          toolFollowupExactText = memoryFollowupText(event.name, result);
        }
        if (event.name === "search_web") toolFollowupInstructions = searchFollowupInstructions(result);
        log(events, `tool ${event.name}: ${JSON.stringify(result)}`);
        send({
          type: "conversation.item.create",
          item: {
            type: "function_call_output",
            call_id: event.call_id,
            output: JSON.stringify(event.name === "search_web" ? result : { status: "ok", result })
          }
        });
        if (event.name === "remember_fact" || event.name === "forget_fact") updateSessionTools();
      } catch (error) {
        if (event.name === "set_chassis") toolFollowupExactText = "I could not move.";
        if (event.name === "remember_fact" || event.name === "forget_fact") {
          toolFollowupExactText = "I could not save that.";
        }
        if (event.name === "search_web") toolFollowupExactText = "I could not search.";
        log(events, `tool ${event.name} error: ${error.message}`);
        send({
          type: "conversation.item.create",
          item: {
            type: "function_call_output",
            call_id: event.call_id,
            output: JSON.stringify({ status: "error", error: error.message })
          }
        });
      }
      pendingToolCalls -= 1;
      maybeCreateToolFollowup();
    }

    function maybeCreateToolFollowup() {
      if (!toolFollowupNeeded || pendingToolCalls > 0 || !responseDoneAfterTool) return;
      toolFollowupNeeded = false;
      responseDoneAfterTool = false;
      const instructions = toolFollowupExactText
        ? exactSpeechInstruction(toolFollowupExactText)
        : toolFollowupInstructions || "Now reply as Robot 790, spoken name Eric. One short spoken sentence. Do not mention tools or output XML/function-call tags. Do not claim any additional robot action happened. If the user requested multiple chassis movements, say the first move is done and ask for the next movement as a new command.";
      toolFollowupExactText = "";
      toolFollowupInstructions = "";
      send({
        type: "response.create",
        response: {
          modalities: ["audio", "text"],
          tool_choice: "none",
          instructions,
          ...ttsRuntimeConfig()
        }
      });
    }

    function updateSessionTools() {
      saveToolPrefs();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const enabledTools = [
        ...(llmTools?.checked ? faceTools : []),
        ...(llmChassisTools?.checked ? chassisTools : []),
        ...(llmMemoryTools?.checked ? memoryTools : []),
        ...(llmWebSearchTools?.checked ? searchTools : [])
      ];
      send({
        type: "session.update",
        session: {
          type: "realtime",
          instructions: buildSessionInstructions(),
          ...ttsRuntimeConfig(),
          tools: enabledTools,
          tool_choice: enabledTools.length ? "auto" : "none"
        }
      });
      log(
        events,
        enabledTools.length
          ? `LLM tools attached: ${enabledTools.map((tool) => tool.name).join(", ")}`
          : "LLM tools disabled; STS lifecycle controls face"
      );
    }

    async function ensurePlayback() {
      audioContext ||= new AudioContext({ sampleRate: 16000 });
      if (audioContext.state === "suspended") await audioContext.resume();
    }

    function clearAudioQueue() {
      if (audioFlushTimer) clearTimeout(audioFlushTimer);
      audioFlushTimer = null;
      audioChunks = [];
      audioChunkBytes = 0;
    }

    function joinAudioChunks() {
      const bytes = new Uint8Array(audioChunkBytes);
      let offset = 0;
      for (const chunk of audioChunks) {
        bytes.set(chunk, offset);
        offset += chunk.length;
      }
      audioChunks = [];
      audioChunkBytes = 0;
      return bytes;
    }

    async function playPcm16Bytes(bytes) {
      await ensurePlayback();
      const samples = pcm16ToFloat32(bytes);
      const buffer = audioContext.createBuffer(1, samples.length, 16000);
      buffer.copyToChannel(samples, 0);
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      const now = audioContext.currentTime;
      playbackTime = Math.max(playbackTime, now + 0.03);
      source.start(playbackTime);
      playbackTime += buffer.duration;
    }

    async function flushAudioQueue() {
      if (!audioChunkBytes) return;
      if (audioFlushTimer) clearTimeout(audioFlushTimer);
      audioFlushTimer = null;
      await playPcm16Bytes(joinAudioChunks());
    }

    function queueAudioDelta(b64) {
      const bytes = b64ToBytes(b64);
      audioChunks.push(bytes);
      audioChunkBytes += bytes.length;
      if (audioChunkBytes >= minPlaybackBytes) {
        flushAudioQueue().catch((error) => log(events, `audio playback error: ${error.message}`));
        return;
      }
      if (!audioFlushTimer) {
        audioFlushTimer = setTimeout(() => {
          flushAudioQueue().catch((error) => log(events, `audio playback error: ${error.message}`));
        }, audioFlushMs);
      }
    }

    function handleEvent(event) {
      if (event.type === "response.output_audio.delta" && event.delta) {
        cueFaceMode("speaking", 0.72);
        queueAudioDelta(event.delta);
        return;
      }
      if (event.type === "response.output_audio.done" || event.type === "response.done") {
        flushAudioQueue().catch((error) => log(events, `audio playback error: ${error.message}`));
        if (event.type === "response.done" && toolFollowupNeeded) {
          responseDoneAfterTool = true;
          maybeCreateToolFollowup();
        }
        if (!toolFollowupNeeded) scheduleFaceIdle();
      }
      if (event.type === "input_audio_buffer.speech_started") {
        cueFaceMode("listening", 0.35);
      } else if (event.type === "input_audio_buffer.speech_stopped") {
        cueFaceMode("thinking", 0.45);
      } else if (event.type === "response.created") {
        cueFaceMode("thinking", 0.45);
      } else if (event.type === "conversation.item.input_audio_transcription.delta") {
        updateInputDraft(event.delta || "");
      } else if (event.type === "conversation.item.input_audio_transcription.completed") {
        clearInputDraft();
        noteUserText(event.transcript || "");
        addConversation(`You: ${event.transcript || ""}`);
        if (!maybeHandleDirectFaceCommand(event.transcript || "")) cueFaceMode("thinking", 0.45);
      } else if (event.type === "response.output_audio_transcript.done") {
        noteAssistantText(event.transcript || "");
        addConversation(`Robot 790: ${event.transcript || ""}`);
      } else if (event.type === "response.output_text.delta") {
        addConversation(`Robot 790: ${event.delta || ""}`);
      } else if (event.type === "response.function_call_arguments.done") {
        handleFunctionCall(event).catch((error) => log(events, `tool bridge error: ${error.message}`));
      } else if (event.type === "error") {
        log(events, `ERROR ${event.error?.type || ""}: ${event.error?.message || JSON.stringify(event)}`);
      }
      log(events, event.type || JSON.stringify(event));
    }

    async function connect() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      setState("Connecting", "warn");
      await ensurePlayback();
      ws = new WebSocket(serverUrl.value.trim());
      ws.addEventListener("open", () => {
        setState("Connected", "ok");
        connectButton.disabled = true;
        disconnectButton.disabled = false;
        startMicButton.disabled = false;
        faceIdleButton.disabled = false;
        faceBeatButton.disabled = false;
        log(events, "connected");
        updateSessionTools();
      });
      ws.addEventListener("message", (message) => {
        try {
          handleEvent(JSON.parse(message.data));
        } catch (error) {
          log(events, `bad event: ${error.message}`);
        }
      });
      ws.addEventListener("close", () => {
        clearAudioQueue();
        setState("Disconnected");
        connectButton.disabled = false;
        disconnectButton.disabled = true;
        startMicButton.disabled = true;
        stopMicButton.disabled = true;
        faceIdleButton.disabled = true;
        faceBeatButton.disabled = true;
        log(events, "disconnected");
      });
      ws.addEventListener("error", () => {
        setState("Socket error");
        log(events, "websocket error");
      });
    }

    async function startMic() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1
        }
      });
      micContext = new AudioContext();
      micSource = micContext.createMediaStreamSource(micStream);
      micProcessor = micContext.createScriptProcessor(2048, 1, 1);
      micProcessor.onaudioprocess = (event) => {
        const input = event.inputBuffer.getChannelData(0);
        let peak = 0;
        for (const sample of input) peak = Math.max(peak, Math.abs(sample));
        level.style.width = `${Math.min(100, peak * 180)}%`;
        const pcm16 = float32ToPcm16(resample(input, micContext.sampleRate, 16000));
        send({ type: "input_audio_buffer.append", audio: bytesToB64(pcm16) });
      };
      micSource.connect(micProcessor);
      micProcessor.connect(micContext.destination);
      startMicButton.disabled = true;
      stopMicButton.disabled = false;
      log(events, "mic started");
    }

    async function stopMic() {
      if (micProcessor) micProcessor.disconnect();
      if (micSource) micSource.disconnect();
      if (micStream) micStream.getTracks().forEach((track) => track.stop());
      if (micContext) await micContext.close();
      micProcessor = null;
      micSource = null;
      micStream = null;
      micContext = null;
      level.style.width = "0";
      startMicButton.disabled = !(ws && ws.readyState === WebSocket.OPEN);
      stopMicButton.disabled = true;
      log(events, "mic stopped");
    }

    connectButton.addEventListener("click", connect);
    disconnectButton.addEventListener("click", () => ws?.close());
    faceIdleButton.addEventListener("click", () => setFaceMode({ mode: "idle" }).then(
      (result) => log(events, `face idle: ${JSON.stringify(result)}`),
      (error) => log(events, `face idle error: ${error.message}`)
    ));
    faceBeatButton.addEventListener("click", () => playFaceBeat({ name: "slow_smile" }).then(
      (result) => log(events, `face beat: ${JSON.stringify(result)}`),
      (error) => log(events, `face beat error: ${error.message}`)
    ));
    chassisStopButton.addEventListener("click", () => setChassis({ action: "stop" }).then(
      (result) => log(events, `chassis stop: ${JSON.stringify(result)}`),
      (error) => log(events, `chassis stop error: ${error.message}`)
    ));
    startMicButton.addEventListener("click", () => startMic().catch((error) => log(events, `mic error: ${error.message}`)));
    stopMicButton.addEventListener("click", () => stopMic().catch((error) => log(events, `mic stop error: ${error.message}`)));
    llmTools.addEventListener("change", updateSessionTools);
    llmChassisTools.addEventListener("change", updateSessionTools);
    llmMemoryTools.addEventListener("change", updateSessionTools);
    llmWebSearchTools.addEventListener("change", updateSessionTools);
    ttsVoice.addEventListener("change", () => updateSessionTtsStyle());
    ttsPreset.addEventListener("change", () => {
      if (ttsPreset.value === "custom") return;
      ttsInstruct.value = ttsStylePresets[ttsPreset.value] || "";
      updateSessionTtsStyle();
    });
    ttsApplyButton.addEventListener("click", () => {
      ttsPreset.value = Object.entries(ttsStylePresets)
        .find(([, value]) => value === currentTtsInstruct())?.[0] || "custom";
      updateSessionTtsStyle();
    });
    ttsInstruct.addEventListener("input", () => {
      ttsPreset.value = Object.entries(ttsStylePresets)
        .find(([, value]) => value === currentTtsInstruct())?.[0] || "custom";
      saveTtsStyle();
    });
    memoryRefreshButton.addEventListener("click", () => {
      renderMemory();
      updateSessionTools();
      log(events, "memory refreshed");
    });
    memoryForgetAllButton.addEventListener("click", () => {
      if (!window.confirm("Forget all Robot 790 browser memory facts?")) return;
      saveMemoryFacts([]);
      updateSessionTools();
      log(events, "memory cleared");
    });
    clearLogButton.addEventListener("click", () => {
      conversationLines = [];
      clearInputDraft();
      events.textContent = "";
    });
    populateTtsVoices();
    loadTtsVoice();
    loadTtsStyle();
    loadToolPrefs();
    renderMemory();
  </script>
</body>
</html>
