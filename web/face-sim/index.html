<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot 790 Browser Face</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --panel: #101720;
      --line: #293544;
      --text: #eef6f8;
      --muted: #8fa2ad;
      --accent: #5eead4;
      --face-native-aspect: 0.75;
      --face-touchscreen-x-scale: 0.9;
      --face-display-max-width: 720px;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 0;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 18%, #18242b 0, #080b11 45%, #020306 100%);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    main {
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 300px);
      min-width: 0;
    }
    .stage {
      display: grid;
      place-items: center;
      min-width: 0;
      height: 100dvh;
      padding: 8px;
      overflow: hidden;
    }
    canvas {
      width: min(100%, calc((100dvh - 16px) * var(--face-native-aspect) * var(--face-touchscreen-x-scale)), var(--face-display-max-width));
      min-width: 0;
      max-width: var(--face-display-max-width);
      aspect-ratio: 3 / 4;
      border: 1px solid rgba(136, 164, 178, 0.18);
      background: #030508;
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.62);
    }
    aside {
      border-left: 1px solid var(--line);
      background: rgba(10, 15, 21, 0.88);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      height: 100dvh;
      overflow: auto;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    .subtle { color: var(--muted); font-size: 12px; }
    .capture-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .capture-status.ok { color: #72f0b2; }
    .capture-status.bad { color: #ff8a8a; }
    .download-link {
      color: var(--accent);
      font-size: 12px;
      text-decoration: none;
    }
    .download-link:hover { text-decoration: underline; }
    .row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px;
      align-items: center;
    }
    label { color: var(--muted); font-size: 12px; }
    select, input, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #121922;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }
    input[type="range"] { padding: 0; }
    button {
      cursor: pointer;
      background: #18222d;
    }
    button:hover { border-color: var(--accent); }
    pre {
      margin: 0;
      white-space: pre-wrap;
      min-height: 180px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #070a0f;
      color: #cfe5e7;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    @media (max-width: 920px) {
      main { grid-template-columns: 1fr; }
      .stage { height: 100dvh; padding: 6px; }
      canvas {
        width: min(calc(100vw - 12px), calc((100dvh - 12px) * var(--face-native-aspect) * var(--face-touchscreen-x-scale)));
        min-width: 0;
      }
      aside { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage">
      <canvas id="face" width="720" height="960" aria-label="Robot 790 browser face simulator"></canvas>
    </section>
    <aside>
      <div>
        <h1>Browser Face</h1>
        <div id="summary" class="subtle">connecting...</div>
      </div>
      <div class="row">
        <label for="mood">Mood</label>
        <select id="mood"></select>
      </div>
      <div class="row">
        <label for="mouth">Mouth</label>
        <select id="mouth"></select>
      </div>
      <div class="row">
        <label for="style">Style</label>
        <select id="style"></select>
      </div>
      <div class="row">
        <label for="eyeMode">Eye Mode</label>
        <select id="eyeMode"></select>
      </div>
      <div class="row">
        <label for="gazeX">Gaze X</label>
        <input id="gazeX" type="range" min="-1" max="1" step="0.01" value="0">
      </div>
      <div class="row">
        <label for="gazeY">Gaze Y</label>
        <input id="gazeY" type="range" min="-1" max="1" step="0.01" value="0">
      </div>
      <div class="row">
        <label for="talking">Talking</label>
        <button id="talking">Toggle Talking</button>
      </div>
      <div class="row">
        <label for="release">Idle</label>
        <button id="release">Release</button>
      </div>
      <div class="row">
        <label for="recordFace">Record</label>
        <button id="recordFace">Record Face</button>
      </div>
      <div id="recordStatus" class="capture-status">face recorder ready</div>
      <a id="downloadFaceRecord" class="download-link" href="#" download hidden>Download last face recording</a>
      <div class="row">
        <label for="captureToEye">Self Eye</label>
        <button id="captureToEye">Capture To Eye</button>
      </div>
      <div class="row">
        <label for="stsUrl">STS</label>
        <input id="stsUrl" value="http://127.0.0.1:8790/" spellcheck="false">
      </div>
      <div id="captureStatus" class="capture-status">ready to mirror</div>
      <pre id="stateText"></pre>
    </aside>
  </main>
  <script src="mouth-contract.js"></script>
  <script src="mouth-renderer.js"></script>
  <script>
    const canvas = document.querySelector("#face");
    const ctx = canvas.getContext("2d");
    const humanMouthRenderer = new Robot790HumanMouth(ctx);
    const summary = document.querySelector("#summary");
    const stateText = document.querySelector("#stateText");
    const moodSelect = document.querySelector("#mood");
    const mouthSelect = document.querySelector("#mouth");
    const styleSelect = document.querySelector("#style");
    const eyeModeSelect = document.querySelector("#eyeMode");
    const gazeX = document.querySelector("#gazeX");
    const gazeY = document.querySelector("#gazeY");
    const talkingButton = document.querySelector("#talking");
    const releaseButton = document.querySelector("#release");
    const recordFaceButton = document.querySelector("#recordFace");
    const recordStatus = document.querySelector("#recordStatus");
    const downloadFaceRecordLink = document.querySelector("#downloadFaceRecord");
    const captureToEyeButton = document.querySelector("#captureToEye");
    const stsUrlInput = document.querySelector("#stsUrl");
    const captureStatus = document.querySelector("#captureStatus");

    const moods = ["neutral", "calm", "curious", "surprised", "suspicious", "afraid", "angry", "sad", "sleepy", "sleep", "goofy", "silly", "robotic", "calculating", "wonder", "glitchy", "happy", "excited", "delighted", "bashful", "bored", "focused", "confused", "helpful", "proud", "mischief", "affection"];
    const mouths = Robot790MouthContract.mouthShapes;
    const styles = ["friendly", "classic", "cartoony", "robot", "sinister", "sleepy"];
    const eyeModes = ["normal", "crossed", "swapped", "googly"];
    let state = null;
    let lastStateAt = 0;
    const mouthTextKeys = { eric: "", brain2: "" };
    const mouthTextStartedAt = { eric: 0, brain2: 0 };
    const mouthPoseKeys = ["open", "width", "curve", "skew", "teeth", "tension", "slant", "upperLift"];
    let easedMouthPose = null;
    let easedMouthShape = "";
    let easedMouthTopology = "";
    let easedMouthTalkLevel = 0;
    let lastMouthEaseAt = 0;
    let easedSpeechEyeX = 0;
    let easedSpeechEyeY = 0;
    let lastSpeechEyeAt = 0;
    let faceCommandLastSeq = 0;
    const handledFaceCommandSeqs = new Set();
    let faceCommandPollInFlight = false;
    let facePaint = emptyFacePaint();
    let facePaintImage = new Image();
    let facePaintImageKey = "";
    let faceRecorder = null;
    let faceRecordChunks = [];
    let faceRecordStartedAt = 0;
    let faceRecordObjectUrl = "";
    let faceRecordFilename = "";
    const faceCommandPollMs = 500;
    const faceRenderXScale = 0.9;
    const faceSnapshotWidth = 540;
    const faceSnapshotHeight = 720;
    const faceSnapshotJpegQuality = 0.86;
    const stsUrlStorageKey = "robot790.faceSim.stsUrl.v1";
    const gpuHistoryLimit = 90;
    const gpuHistoryBucketMs = 1000;
    const gpuHistoryStorageKey = "robot790.faceSimGpuHistory.v1";
    const gpuUtilHistory = loadGpuHistory();
    let gpuTelemetry = { status: "waiting", error: "", primary: null, lastOkAt: 0 };
    let gpuStatusPollTimer = null;

    function fillSelect(select, values) {
      select.replaceChildren(...values.map((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value.replaceAll("_", " ");
        return option;
      }));
    }

    function emptyFacePaint() {
      return {
        active: false,
        imageReady: false,
        imageDataUrl: "",
        filename: "",
        source: "",
        target: "face",
        fit: "contain",
        opacity: 0.96,
        expiresAt: 0
      };
    }

    async function post(path, payload = {}) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      state = await response.json();
      lastStateAt = performance.now();
      trackMouthTextState();
      syncControls();
    }

    function isLoopbackHost(hostname) {
      const host = String(hostname || "").toLowerCase();
      return host === "127.0.0.1" || host === "localhost" || host === "::1" || host === "[::1]";
    }

    function defaultStsUrl() {
      const host = location.hostname || "127.0.0.1";
      return `${location.protocol === "https:" ? "https:" : "http:"}//${host}:8790/`;
    }

    function normalizedStsUrl(value = stsUrlInput?.value) {
      const raw = String(value || defaultStsUrl()).trim().replace(/\/?$/, "/");
      try {
        const url = new URL(raw);
        if (!isLoopbackHost(location.hostname) && isLoopbackHost(url.hostname)) {
          url.hostname = location.hostname;
        }
        if (location.protocol === "https:" && url.protocol === "http:" && url.hostname === location.hostname) {
          url.protocol = "https:";
        }
        return url.toString().replace(/\/?$/, "/");
      } catch {
        return raw;
      }
      return raw;
    }

    function setCaptureStatus(text, kind = "") {
      captureStatus.textContent = text;
      captureStatus.classList.toggle("ok", kind === "ok");
      captureStatus.classList.toggle("bad", kind === "bad");
    }

    function setRecordStatus(text, kind = "") {
      recordStatus.textContent = text;
      recordStatus.classList.toggle("ok", kind === "ok");
      recordStatus.classList.toggle("bad", kind === "bad");
    }

    function timestampLabel() {
      return new Date().toISOString().replace(/[:.]/g, "-").replace("T", "-").replace("Z", "");
    }

    function browserFaceSnapshot() {
      const output = document.createElement("canvas");
      output.width = faceSnapshotWidth;
      output.height = faceSnapshotHeight;
      const outputCtx = output.getContext("2d");
      outputCtx.fillStyle = "#05080b";
      outputCtx.fillRect(0, 0, output.width, output.height);
      const sourceWidth = canvas.width || faceSnapshotWidth;
      const sourceHeight = canvas.height || faceSnapshotHeight;
      const scale = Math.min(output.width / sourceWidth, output.height / sourceHeight);
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const x = Math.round((output.width - width) / 2);
      const y = Math.round((output.height - height) / 2);
      outputCtx.drawImage(canvas, x, y, width, height);
      return {
        dataUrl: output.toDataURL("image/jpeg", faceSnapshotJpegQuality),
        width: output.width,
        height: output.height,
        sourceWidth,
        sourceHeight
      };
    }

    function clockDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(Number(ms || 0) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const two = (value) => String(value).padStart(2, "0");
      return hours > 0
        ? `${hours}:${two(minutes)}:${two(seconds)}`
        : `${two(minutes)}:${two(seconds)}`;
    }

    function browserFaceRecordingSupported() {
      return Boolean(canvas.captureStream && window.MediaRecorder);
    }

    function supportedFaceRecordingMime() {
      const candidates = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ];
      return candidates.find((type) => MediaRecorder.isTypeSupported?.(type)) || "";
    }

    function updateRecordFaceButton() {
      const recording = faceRecorder && faceRecorder.state === "recording";
      const elapsed = recording ? Date.now() - faceRecordStartedAt : 0;
      recordFaceButton.textContent = recording ? `Stop Face ${clockDuration(elapsed)}` : "Record Face";
      recordFaceButton.disabled = !browserFaceRecordingSupported();
      if (!browserFaceRecordingSupported()) setRecordStatus("face recording unsupported", "bad");
      else if (recording) setRecordStatus(`recording browser face ${clockDuration(elapsed)}`);
    }

    async function saveFaceRecording(blob, filename) {
      const response = await fetch("/api/recording", {
        method: "POST",
        headers: {
          "Content-Type": blob.type || "video/webm",
          "X-Robot790-Filename": filename
        },
        body: blob
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok === false) {
        throw new Error(result.error || `${response.status} ${response.statusText}`);
      }
      return result;
    }

    async function finishFaceRecording() {
      const duration = Math.max(0, (Date.now() - faceRecordStartedAt) / 1000);
      const blob = new Blob(faceRecordChunks, { type: faceRecordChunks[0]?.type || "video/webm" });
      faceRecordChunks = [];
      if (faceRecordObjectUrl) URL.revokeObjectURL(faceRecordObjectUrl);
      faceRecordObjectUrl = URL.createObjectURL(blob);
      downloadFaceRecordLink.href = faceRecordObjectUrl;
      downloadFaceRecordLink.download = faceRecordFilename;
      downloadFaceRecordLink.hidden = false;
      setRecordStatus(`saving ${duration.toFixed(1)}s face recording...`);
      try {
        const result = await saveFaceRecording(blob, faceRecordFilename);
        const href = new URL(result.latest_url || result.url || "", location.href).href;
        downloadFaceRecordLink.href = href;
        downloadFaceRecordLink.download = result.filename || faceRecordFilename;
        setRecordStatus(`saved ${result.filename || faceRecordFilename}`, "ok");
      } catch (error) {
        setRecordStatus(`save failed; browser copy ready (${error.message})`, "bad");
      }
    }

    function startFaceRecording() {
      if (!browserFaceRecordingSupported()) {
        setRecordStatus("face recording unsupported", "bad");
        updateRecordFaceButton();
        return;
      }
      if (faceRecorder && faceRecorder.state === "recording") return;
      const stream = canvas.captureStream(24);
      const mimeType = supportedFaceRecordingMime();
      faceRecordChunks = [];
      faceRecordStartedAt = Date.now();
      faceRecordFilename = `browser-face-${timestampLabel()}.webm`;
      const options = mimeType ? { mimeType } : {};
      faceRecorder = new MediaRecorder(stream, options);
      faceRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) faceRecordChunks.push(event.data);
      };
      faceRecorder.onerror = (event) => setRecordStatus(`record error: ${event.error?.message || "unknown"}`, "bad");
      faceRecorder.onstop = () => {
        stream.getTracks().forEach((track) => track.stop());
        finishFaceRecording().finally(updateRecordFaceButton);
      };
      faceRecorder.start(1000);
      setRecordStatus("recording browser face...");
      updateRecordFaceButton();
    }

    function stopFaceRecording() {
      if (!faceRecorder || faceRecorder.state !== "recording") return;
      setRecordStatus("finalizing face recording...");
      faceRecorder.stop();
      updateRecordFaceButton();
    }

    async function captureFaceToEye({ stsUrl = normalizedStsUrl(), reason = "", commandSeq = 0 } = {}) {
      const targetUrl = new URL("/api/sensing-eye/inbox", normalizedStsUrl(stsUrl));
      const snapshot = browserFaceSnapshot();
      const imageDataUrl = snapshot.dataUrl;
      const faceState = state ? JSON.parse(JSON.stringify(state)) : {};
      faceState.snapshot = {
        width: snapshot.width,
        height: snapshot.height,
        source_width: snapshot.sourceWidth,
        source_height: snapshot.sourceHeight
      };
      const filename = `browser-face-${timestampLabel()}-${snapshot.width}x${snapshot.height}.jpg`;
      setCaptureStatus("sending face to eye...");
      const response = await fetch(targetUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          source: "browser_face",
          filename,
          image_data_url: imageDataUrl,
          face_command_seq: commandSeq,
          reason,
          snapshot: faceState.snapshot,
          state: faceState
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.status === "error") {
        throw new Error(result.error || `${response.status} ${response.statusText}`);
      }
      setCaptureStatus(`mirrored ${filename} (${snapshot.width}x${snapshot.height})`, "ok");
      return result;
    }

    async function pollState() {
      try {
        const response = await fetch("/state", { cache: "no-store" });
        state = await response.json();
        lastStateAt = performance.now();
        trackMouthTextState();
        syncFacePaintStateFromServer();
        syncControls();
      } catch (error) {
        summary.textContent = error.message;
      } finally {
        setTimeout(pollState, 250);
      }
    }

    function syncFacePaintStateFromServer() {
      const serverPaint = state?.face_paint;
      if (!serverPaint || serverPaint.active !== false || !facePaint.active) return;
      facePaint = emptyFacePaint();
      facePaintImageKey = "";
      facePaintImage = new Image();
    }

    function scheduleFaceCommandPoll() {
      setTimeout(pollFaceCommands, faceCommandPollMs);
    }

    async function syncFaceCommandCursor() {
      const url = new URL("/commands", location.href);
      url.searchParams.set("after", String(Number.MAX_SAFE_INTEGER));
      url.searchParams.set("limit", "1");
      const response = await fetch(url, { cache: "no-store" });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok === false) {
        throw new Error(result.error || `${response.status} ${response.statusText}`);
      }
      faceCommandLastSeq = Math.max(faceCommandLastSeq, Number(result.latest_seq) || 0);
    }

    async function startFaceCommandPolling() {
      try {
        await syncFaceCommandCursor();
      } catch (error) {
        setCaptureStatus(`mirror sync failed: ${error.message}`, "bad");
      } finally {
        scheduleFaceCommandPoll();
      }
    }

    async function pollFaceCommands() {
      if (faceCommandPollInFlight) {
        scheduleFaceCommandPoll();
        return;
      }
      faceCommandPollInFlight = true;
      try {
        const url = new URL("/commands", location.href);
        url.searchParams.set("after", String(faceCommandLastSeq));
        const response = await fetch(url, { cache: "no-store" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.ok === false) {
          throw new Error(result.error || `${response.status} ${response.statusText}`);
        }
        for (const command of result.commands || []) {
          const seq = Number(command.seq) || 0;
          const seqKey = String(command.seq || "");
          if (seqKey && handledFaceCommandSeqs.has(seqKey)) continue;
          if (seqKey) {
            handledFaceCommandSeqs.add(seqKey);
            while (handledFaceCommandSeqs.size > 100) {
              handledFaceCommandSeqs.delete(handledFaceCommandSeqs.values().next().value);
            }
          }
          if (seq > faceCommandLastSeq) faceCommandLastSeq = seq;
          if (command.type === "capture_to_eye") {
            await captureFaceToEye({
              stsUrl: command.sts_url || normalizedStsUrl(),
              reason: command.reason || "browser face self-capture",
              commandSeq: seq
            });
          } else if (command.type === "face_paint") {
            applyFacePaintCommand(command);
          }
        }
      } catch (error) {
        setCaptureStatus(`mirror failed: ${error.message}`, "bad");
      } finally {
        faceCommandPollInFlight = false;
        scheduleFaceCommandPoll();
      }
    }

    function applyFacePaintCommand(command) {
      if (command.clear) {
        facePaint = emptyFacePaint();
        facePaintImageKey = "";
        facePaintImage = new Image();
        setCaptureStatus("cleared face image", "ok");
        return;
      }
      const imageDataUrl = String(command.image_data_url || "");
      if (!imageDataUrl) {
        setCaptureStatus("face paint missing image", "bad");
        return;
      }
      const target = String(command.target || "auto").toLowerCase();
      const resolvedTarget = target === "nose" ? "nose" : "face";
      const fit = String(command.fit || "contain").toLowerCase() === "cover" ? "cover" : "contain";
      const duration = Math.max(0, Number(command.duration) || 0);
      facePaint = {
        active: true,
        imageReady: false,
        imageDataUrl,
        filename: String(command.filename || ""),
        source: String(command.source || "sensing_eye"),
        target: resolvedTarget,
        fit,
        opacity: Math.max(0.15, Math.min(1, Number(command.opacity) || 0.96)),
        expiresAt: duration === 0 ? 0 : performance.now() + duration * 1000
      };
      if (imageDataUrl !== facePaintImageKey) {
        facePaintImageKey = imageDataUrl;
        facePaintImage = new Image();
        const paintKey = imageDataUrl;
        facePaintImage.onload = () => {
          if (facePaintImageKey !== paintKey) return;
          facePaint.imageReady = true;
          setCaptureStatus(`face image set${facePaint.filename ? `: ${facePaint.filename}` : ""}`, "ok");
        };
        facePaintImage.onerror = () => {
          if (facePaintImageKey !== paintKey) return;
          facePaint = emptyFacePaint();
          setCaptureStatus("face image failed to load", "bad");
        };
        facePaintImage.src = imageDataUrl;
      } else {
        facePaint.imageReady = facePaintImage.complete && facePaintImage.naturalWidth > 0;
      }
      setCaptureStatus("loading face image...");
    }

    function trackMouthTextState() {
      const mouth = state?.mouth || {};
      const items = mouthTextItems(mouth);
      for (const source of ["eric", "brain2"]) {
        const item = items.find((candidate) => candidate.source === source);
        const key = item ? `${item.source}\n${item.mode}\n${item.text}` : "";
        if (key !== mouthTextKeys[source]) {
          mouthTextKeys[source] = key;
          mouthTextStartedAt[source] = performance.now();
        }
      }
    }

    function syncControls() {
      if (!state) return;
      if (document.activeElement !== moodSelect) moodSelect.value = state.mood || "curious";
      if (document.activeElement !== mouthSelect) mouthSelect.value = state.mouth?.shape || "neutral";
      if (document.activeElement !== styleSelect) styleSelect.value = state.style || "robot";
      if (document.activeElement !== eyeModeSelect) eyeModeSelect.value = state.eye_mode || "normal";
      const mode = state.eye_mode && state.eye_mode !== "normal" ? ` / ${state.eye_mode}` : "";
      const renderedShape = renderedMouthShape(state.mouth || {}, state.mood || "curious");
      summary.textContent = `${state.mood || "?"} / ${renderedShape}${mode} / ${state.autonomous ? "idle" : "manual"}`;
      stateText.textContent = JSON.stringify(state, null, 2);
    }

    function colorForMood(mood) {
      return {
        calm: "#54c6d2",
        curious: "#56dce8",
        surprised: "#ffbe70",
        suspicious: "#bee868",
        afraid: "#78aaff",
        angry: "#ff5252",
        sleepy: "#5e82b2",
        sleep: "#223a4a",
        goofy: "#ffa25e",
        robotic: "#50dce6",
        wonder: "#76a6ff",
        glitchy: "#ff46d2",
        happy: "#50e89c",
        delighted: "#ffd256",
        bashful: "#da84ff",
        bored: "#768e9a",
        focused: "#d4eeaa",
        confused: "#b496ff",
        proud: "#7cbeff",
        mischief: "#56eebe",
        affection: "#ff7ebe"
      }[mood] || "#54c6d2";
    }

    function statusTintHex(value, fallback) {
      const color = String(value || "").trim();
      const named = {
        cyan: "#2cdce8",
        bluegreen: "#2cdce8",
        white: "#e8faf6",
        red: "#ff5252",
        green: "#60d394",
        blue: "#5aaaff",
        yellow: "#ffcf5a",
        pink: "#ff70be",
        orange: "#ff9648",
        purple: "#b482ff"
      };
      if (/^#[0-9a-f]{6}$/i.test(color)) return color;
      return named[color.toLowerCase()] || fallback;
    }

    function clamp(value, low, high) {
      return Math.max(low, Math.min(high, value));
    }

    function boundedPercent(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return null;
      return clamp(number, 0, 100);
    }

    function formatGpuNumber(value, digits = 0) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "";
      return number.toFixed(digits);
    }

    function gpuHistoryValue(sample) {
      if (typeof sample === "number") return boundedPercent(sample) ?? 0;
      return boundedPercent(sample?.value) ?? 0;
    }

    function pushGpuHistory(value, sampledAt = Date.now()) {
      const percent = boundedPercent(value);
      if (percent === null) return;
      const bucket = Math.floor(Number(sampledAt) / gpuHistoryBucketMs) * gpuHistoryBucketMs;
      const last = gpuUtilHistory[gpuUtilHistory.length - 1];
      if (last && typeof last === "object" && last.t === bucket) {
        last.value = Math.max(gpuHistoryValue(last), percent);
      } else {
        gpuUtilHistory.push({ t: bucket, value: percent });
      }
      while (gpuUtilHistory.length > gpuHistoryLimit) gpuUtilHistory.shift();
      saveGpuHistory();
    }

    function loadGpuHistory() {
      try {
        const parsed = JSON.parse(sessionStorage.getItem(gpuHistoryStorageKey) || "[]");
        if (!Array.isArray(parsed)) return [];
        return parsed
          .map((sample) => {
            if (typeof sample === "number") return { t: 0, value: boundedPercent(sample) ?? 0 };
            return { t: Number(sample?.t) || 0, value: boundedPercent(sample?.value) ?? 0 };
          })
          .slice(-gpuHistoryLimit);
      } catch {
        return [];
      }
    }

    function saveGpuHistory() {
      try {
        sessionStorage.setItem(gpuHistoryStorageKey, JSON.stringify(gpuUtilHistory.slice(-gpuHistoryLimit)));
      } catch {
        return;
      }
    }

    function normalizeGpuPayload(payload) {
      const gpu = payload?.gpu || payload || {};
      const primary = gpu?.primary || (Array.isArray(gpu?.gpus) ? gpu.gpus[0] : null);
      if (gpu.status === "ok" && primary) {
        return {
          status: "ok",
          error: "",
          primary,
          sampledAt: gpu.sampled_at || payload?.generated_at || ""
        };
      }
      return {
        status: "unavailable",
        error: gpu?.error || payload?.error || "GPU payload did not include usable primary telemetry.",
        primary: null,
        sampledAt: gpu?.sampled_at || payload?.generated_at || ""
      };
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      const payload = await response.json().catch(() => ({}));
      return { response, payload };
    }

    async function fetchGpuStatusFromSts() {
      const base = normalizedStsUrl();
      const direct = await fetchJson(new URL("/api/gpu/status", base));
      let normalized = normalizeGpuPayload(direct.payload);
      if (direct.response.ok && normalized.status === "ok") return normalized;
      const brain = await fetchJson(new URL("/api/brain/status", base));
      normalized = normalizeGpuPayload(brain.payload);
      if (brain.response.ok && normalized.status === "ok") return normalized;
      const statusText = !direct.response.ok
        ? `${direct.response.status} ${direct.response.statusText}`
        : !brain.response.ok
        ? `${brain.response.status} ${brain.response.statusText}`
        : normalized.error;
      return { status: "unavailable", error: statusText, primary: null, sampledAt: "" };
    }

    function mix(a, b, t) {
      return a + (b - a) * clamp(t, 0, 1);
    }

    function easeToward(current, target, amount) {
      return current + (target - current) * clamp(amount, 0, 1);
    }

    function hexToRgb(hex) {
      const raw = hex.replace("#", "");
      return {
        r: parseInt(raw.slice(0, 2), 16),
        g: parseInt(raw.slice(2, 4), 16),
        b: parseInt(raw.slice(4, 6), 16)
      };
    }

    function alphaColor(hex, alpha) {
      const c = hexToRgb(hex);
      return `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
    }

    function mixColor(a, b, t) {
      const ca = hexToRgb(a);
      const cb = hexToRgb(b);
      return `rgb(${Math.round(mix(ca.r, cb.r, t))}, ${Math.round(mix(ca.g, cb.g, t))}, ${Math.round(mix(ca.b, cb.b, t))})`;
    }

    async function refreshGpuStatusQuietly() {
      try {
        const direct = await fetchJson(new URL("/api/gpu/status", window.location.href));
        let normalized = direct.response.ok
          ? normalizeGpuPayload(direct.payload)
          : { status: "unavailable", error: `${direct.response.status} ${direct.response.statusText}`, primary: null };
        if (normalized.status !== "ok") {
          normalized = await fetchGpuStatusFromSts();
        }
        if (normalized.status !== "ok" || !normalized.primary) {
          gpuTelemetry = {
            status: "unavailable",
            error: normalized.error || "GPU telemetry unavailable",
            primary: null,
            lastOkAt: gpuTelemetry.lastOkAt || 0
          };
          return;
        }
        gpuTelemetry = { status: "ok", error: "", primary: normalized.primary, sampledAt: normalized.sampledAt || "", lastOkAt: performance.now() };
        pushGpuHistory(normalized.primary.utilization_percent);
      } catch (error) {
        gpuTelemetry = {
          status: "unavailable",
          error: error.message,
          primary: null,
          lastOkAt: gpuTelemetry.lastOkAt || 0
        };
      } finally {
        gpuStatusPollTimer = setTimeout(refreshGpuStatusQuietly, 1000);
      }
    }

    function drawGpuStrip(t) {
      const x = 24;
      const y = 10;
      const w = faceLayout.width - x * 2;
      const h = 58;
      const chartX = x;
      const chartY = y + 16;
      const chartW = w;
      const chartH = 28;
      const samples = gpuUtilHistory.length ? gpuUtilHistory.map((sample) => gpuHistoryValue(sample)) : [0, 0];
      const ok = gpuTelemetry.status === "ok" && performance.now() - gpuTelemetry.lastOkAt < 4000;

      ctx.save();
      ctx.textBaseline = "middle";

      const padded = samples.length === 1 ? [samples[0], samples[0]] : samples;
      const lastIndex = Math.max(1, padded.length - 1);
      const points = padded.map((value, index) => ({
        x: chartX + (index / lastIndex) * chartW,
        y: chartY + chartH - (boundedPercent(value) ?? 0) / 100 * chartH
      }));
      ctx.strokeStyle = ok ? "#e05cff" : "rgba(224, 92, 255, 0.45)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      points.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.stroke();

      const statusLine = String(state?.status_line || gpuTelemetry.error || "tools: idle").replace(/\s+/g, " ").trim();
      const statusState = String(state?.status_line_state || "off");
      ctx.fillStyle = statusState === "running"
        ? "#fff0ba"
        : statusState === "bad"
        ? "#ffb3b3"
        : statusState === "ok"
        ? "#c8f6df"
        : "rgba(211, 218, 228, 0.88)";
      ctx.font = "900 18px ui-monospace, SFMono-Regular, Consolas, monospace";
      ctx.textAlign = "left";
      const clippedStatus = fitCanvasText(statusLine || "tools: idle", w - 28, 12);
      ctx.fillText(clippedStatus, x + 14, y + h + 23);
      ctx.restore();
    }

    function fitCanvasText(text, maxWidth, minLength = 8) {
      let clipped = String(text || "");
      if (!Number.isFinite(maxWidth) || maxWidth <= 0) return "";
      if (ctx.measureText(clipped).width <= maxWidth) return clipped;
      const floor = Math.max(1, Math.min(minLength, clipped.length));
      while (clipped.length > floor && ctx.measureText(`${clipped}...`).width > maxWidth) {
        clipped = clipped.slice(0, -1);
      }
      if (ctx.measureText(`${clipped}...`).width <= maxWidth) return `${clipped}...`;
      while (clipped.length > 1 && ctx.measureText(`${clipped}...`).width > maxWidth) {
        clipped = clipped.slice(0, -1);
      }
      return clipped ? `${clipped}...` : "";
    }

    function apertureN(localX) {
      return (localX - firmwareEye.cx) / firmwareEye.scleraRx;
    }

    function topLidYAt(pose, localX) {
      const n = clamp(apertureN(localX), -1, 1);
      const h = Math.sqrt(Math.max(0, 1 - n * n));
      const curve = Math.pow(h, 0.62 + pose.topCurve * 0.0035);
      return firmwareEye.cy - (firmwareEye.cy - pose.topY) * curve + pose.topSlant * n * h;
    }

    function bottomLidYAt(pose, localX) {
      const n = clamp(apertureN(localX), -1, 1);
      const h = Math.sqrt(Math.max(0, 1 - n * n));
      const curve = Math.pow(h, 0.70 + pose.bottomCurve * 0.003);
      return firmwareEye.cy + (pose.bottomY - firmwareEye.cy) * curve + pose.bottomSlant * n * h;
    }

    function idleEyeOffset(t) {
      if (!state?.autonomous || state?.gaze?.manual || state?.eyes_animate === false) {
        return { x: 0, y: 0 };
      }
      return {
        x: Math.sin(t * 0.00052) * 24 + Math.sin(t * 0.00113 + 1.7) * 8,
        y: Math.sin(t * 0.00041 + 2.4) * 14 + Math.sin(t * 0.0017) * 3
      };
    }

    function speechEyeLevel() {
      if (!state || state.eyes_animate === false) return 0;
      const mouth = state.mouth || {};
      const speech = activeSpeechMouth(mouth);
      if (speech) return clamp(0.36 + speech.energy * 0.64, 0, 1);
      if (mouth.talking || state.mode === "speaking") {
        return clamp(0.28 + Number(mouth.energy || 0.45) * 0.62, 0, 1);
      }
      return 0;
    }

    function speakingEyeOffset(t, left) {
      const level = speechEyeLevel();
      if (level <= 0 || state?.gaze?.manual) {
        lastSpeechEyeAt = 0;
        easedSpeechEyeX = 0;
        easedSpeechEyeY = 0;
        return { x: 0, y: 0 };
      }

      const dt = clamp(t - (lastSpeechEyeAt || t), 0, 140);
      lastSpeechEyeAt = t;
      // Phrase-length glances, with regular returns toward the viewer. No camera tracking.
      const targets = [[0, 0], [-24, -9], [0, 0], [22, 3], [8, -15], [0, 0], [-17, 5]];
      const target = targets[Math.floor(t / 4200) % targets.length];
      const targetX = target[0] * level;
      const targetY = target[1] * level;
      const amount = 1 - Math.exp(-dt / 180);
      easedSpeechEyeX = easeToward(easedSpeechEyeX, targetX, amount);
      easedSpeechEyeY = easeToward(easedSpeechEyeY, targetY, amount);

      return {
        x: easedSpeechEyeX + Math.sin(t * 0.012 + (left ? 0.2 : 0.8)) * 0.9 * level,
        y: easedSpeechEyeY + Math.sin(t * 0.009 + (left ? 1.1 : 1.9)) * 0.55 * level
      };
    }

    function eyeModeGaze(mode, gx, gy, left, t) {
      if (mode === "crossed") {
        const inward = left ? 1 : -1;
        return {
          x: clamp(gx + inward * 24, -firmwareEye.maxGazeX, firmwareEye.maxGazeX),
          y: clamp(gy + 2, -firmwareEye.maxGazeY, firmwareEye.maxGazeY)
        };
      }
      if (mode === "swapped") {
        return {
          x: clamp(-gx, -firmwareEye.maxGazeX, firmwareEye.maxGazeX),
          y: clamp(gy, -firmwareEye.maxGazeY, firmwareEye.maxGazeY)
        };
      }
      if (mode === "googly") {
        const phase = left ? 0.35 : 2.7;
        return {
          x: clamp(Math.sin(t * 0.0041 + phase) * 25 + Math.sin(t * 0.0107 + phase * 1.9) * 8, -firmwareEye.maxGazeX, firmwareEye.maxGazeX),
          y: clamp(Math.cos(t * 0.0037 + phase * 1.3) * 16 + Math.sin(t * 0.012 + phase) * 5, -firmwareEye.maxGazeY, firmwareEye.maxGazeY)
        };
      }
      return { x: gx, y: gy };
    }

    function blinkAmount(t, left) {
      if (state?.eyes_animate === false) return 0;
      const phase = (t + (left ? 0 : 92)) % 4100;
      const blink = phase < 120 ? Math.sin((phase / 120) * Math.PI) : 0;
      const doublePhase = (t + 1800 + (left ? 34 : 0)) % 9700;
      const doubleBlink = doublePhase < 95 ? Math.sin((doublePhase / 95) * Math.PI) : 0;
      return Math.max(blink, doubleBlink);
    }

    function drawIris(localCx, localCy, pose, palette, left) {
      const pupil = Math.max(4, pose.pupilRadius * palette.pupilScale);
      if (palette.robot) {
        const dotR = clamp(pupil, 42, 78);
        drawEllipse(localCx, localCy, dotR, dotR * 0.78, palette.pupil);
        drawEllipse(localCx, localCy, dotR + 2, dotR * 0.78 + 2, "", palette.accent, 2);
        drawEllipse(localCx - dotR / 4, localCy - dotR / 3, 9, 6, "#dcfaf5");
        return;
      }

      const irisR = palette.irisR;
      drawEllipse(localCx, localCy, irisR + 3, irisR + 3, palette.limbal);
      for (let r = irisR; r >= 1; r -= 1) {
        const k = (irisR - r) / irisR;
        const color = k < 0.22
          ? mixColor(palette.inner, palette.pale, k / 0.22)
          : k < 0.60
            ? mixColor(palette.pale, palette.clear, (k - 0.22) / 0.38)
            : mixColor(palette.clear, palette.deep, (k - 0.60) / 0.40);
        ctx.beginPath();
        ctx.arc(localCx, localCy, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      ctx.strokeStyle = mixColor(palette.accent, palette.deep, 0.48);
      ctx.lineWidth = 1;
      for (let i = 0; i < 32; i += 1) {
        const angle = (Math.PI * 2 * i / 32) + (left ? 0.03 : -0.04);
        const ca = Math.cos(angle);
        const sa = Math.sin(angle);
        ctx.beginPath();
        ctx.moveTo(localCx + ca * (pupil + 2), localCy + sa * (pupil + 2));
        ctx.lineTo(localCx + ca * (irisR - 3), localCy + sa * (irisR - 3));
        ctx.stroke();

      drawEllipse(localCx, localCy, irisR + 1, irisR + 1, "", palette.limbal, 2);
      if (palette.verticalPupil) {
        drawEllipse(localCx, localCy, pupil * 0.44, pupil * 1.42, palette.pupil);

    function drawLids(pose, blinkClosed, maskColor = "#000000") {

        ctx.lineTo(x, bottomLidYAt(topPose, x));

      ctx.lineTo(firmwareEye.width, firmwareEye.height);

    function drawSparkle(x, y, r, color) {

    function drawTear(x, y, scale = 1) {
      ctx.save();
      const glow = ctx.createRadialGradient(x - 2 * scale, y + 4 * scale, 3 * scale, x, y + 7 * scale, 28 * scale);
      glow.addColorStop(0, "rgba(218, 252, 255, 0.72)");
      glow.addColorStop(0.48, "rgba(104, 218, 255, 0.40)");
      glow.addColorStop(1, "rgba(104, 218, 255, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(x, y + 8 * scale, 30 * scale, 36 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      const drop = ctx.createLinearGradient(x, y - 14 * scale, x, y + 28 * scale);
      drop.addColorStop(0, "#e5fdff");
      drop.addColorStop(0.42, "#64ddff");
      drop.addColorStop(1, "#168cc9");
      ctx.fillStyle = drop;
      ctx.strokeStyle = "#d8fbff";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(x, y - 17 * scale);
      ctx.bezierCurveTo(x + 18 * scale, y + 5 * scale, x + 13 * scale, y + 30 * scale, x, y + 32 * scale);
      ctx.bezierCurveTo(x - 13 * scale, y + 30 * scale, x - 18 * scale, y + 5 * scale, x, y - 17 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(255, 255, 255, 0.86)";
      ctx.beginPath();
      ctx.ellipse(x - 5 * scale, y - 1 * scale, 4.4 * scale, 7.2 * scale, -0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSleepMark(x, y, scale = 1) {
      ctx.save();
      ctx.fillStyle = "#88eaff";
      ctx.font = `${Math.round(20 * scale)}px ui-monospace, SFMono-Regular, Consolas, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("z", x, y);
      ctx.restore();
    }

    function drawEye(cx, cy, left, t, viewportScale = 1) {
      const mood = state?.eye_mood || state?.mood || "curious";
      if (mood === "sleep") return;
      const eyeMode = state?.eye_mode || "normal";
      const eyeballLeft = eyeMode === "swapped" ? !left : left;
      const gaze = state?.gaze?.now || { x: 0, y: 0 };
      const pose = lidPoseFor(mood, left);
      const palette = eyePalettes[state?.style || "robot"] || eyePalettes.robot;
      const idle = idleEyeOffset(t);
      const speech = speakingEyeOffset(t, eyeballLeft);
      const rawGazeX = Number(gaze.x || 0);
      const rawGazeY = Number(gaze.y || 0);
      const baseGazeX = Math.abs(rawGazeX) <= 1 ? rawGazeX * firmwareEye.maxGazeX : rawGazeX * (firmwareEye.maxGazeX / 64.6);
      const baseGazeY = Math.abs(rawGazeY) <= 1 ? rawGazeY * firmwareEye.maxGazeY : rawGazeY * (firmwareEye.maxGazeY / 48);
      let gx = clamp(baseGazeX + idle.x * 0.58 + speech.x, -firmwareEye.maxGazeX, firmwareEye.maxGazeX);
      let gy = clamp(baseGazeY + idle.y * 0.58 + speech.y, -firmwareEye.maxGazeY, firmwareEye.maxGazeY);

      if (mood === "afraid") {
        gx += Math.sin(t * 0.032 + (eyeballLeft ? 0 : 1.4)) * 1.4;
        gy += Math.sin(t * 0.027 + 2.1) * 0.8;
      } else if (mood === "goofy") {
        gx += eyeballLeft ? 5.5 : -5.5;
        gy += eyeballLeft ? -4.5 : 4.5;
      } else if (mood === "robotic") {
        gx = Math.round(gx / 8) * 8;
        gy = Math.round(gy / 6) * 6;
      } else if (mood === "sleepy" || mood === "bored") {
        gy += 8;
      } else if (mood === "glitchy") {
        const tick = Math.trunc(t / 75 + (eyeballLeft ? 0 : 3));
        gx += ((tick % 5) - 2) * 1.8;
        gy += (((Math.trunc(tick / 2)) % 3) - 1) * 1.6;
      } else if (mood === "proud") {
        gy -= 8;
      }
      const posedGaze = eyeModeGaze(eyeMode, gx, gy, left, t);
      gx = posedGaze.x;
      gy = posedGaze.y;

      ctx.save();
      ctx.translate(cx - firmwareEye.cx * viewportScale, cy - firmwareEye.cy * viewportScale);
      ctx.scale(viewportScale, viewportScale);
      ctx.save();
      drawEyeClip();
      if (palette.robot) {
        drawEllipse(firmwareEye.cx, firmwareEye.cy, firmwareEye.scleraRx, firmwareEye.scleraRy, "#ffffff");
      } else {
        drawEllipse(firmwareEye.cx, firmwareEye.cy, firmwareEye.scleraRx, firmwareEye.scleraRy, "#f0eee4");
        drawEllipse(firmwareEye.cx, firmwareEye.cy + 3, firmwareEye.scleraRx - 9, firmwareEye.scleraRy - 12, "#ffffff");
      }
      drawIris(firmwareEye.cx + gx, firmwareEye.cy + gy, pose, palette, eyeballLeft);
      if (mood === "delighted" || mood === "affection" || mood === "excited") {
        drawSparkle(left ? firmwareEye.width - 54 : 52, 68, 4, "#f6f8dd");
      }
      if (mood === "sad") {
        drawTear(left ? firmwareEye.width - 60 : 60, 178, 1.18);
      }
      drawLids(pose, blinkAmount(t, left), "rgba(5, 12, 15, 0.96)");
      if ((mood === "sleepy" || mood === "bored") && !left) {
        drawSleepMark(firmwareEye.width - 36, 55, 0.9);
        drawSleepMark(firmwareEye.width - 18, 38, 0.7);
      }
      ctx.restore();
      ctx.restore();
    }

    function mouthShapeForMood(mood) {
      if (["excited", "delighted"].includes(mood)) return "big_smile";
      if (["happy", "affection", "proud", "bashful", "helpful"].includes(mood)) return "smile";
      if (["suspicious", "mischief"].includes(mood)) return "smirk_right";
      if (mood === "angry") return "sneer";
      if (["afraid", "surprised", "wonder"].includes(mood)) return "o";
      if (mood === "silly") return "tongue";
      if (["confused", "goofy"].includes(mood)) return "smirk_left";
      if (["sleepy", "sad"].includes(mood)) return "frown";
      if (mood === "sleep") return "sleep";
      if (["focused", "robotic", "calculating"].includes(mood)) return "neutral";
      if (mood === "glitchy") return "wide";
      return "neutral";
    }

    function baseMouthShape(mouth, mood) {
      return mouth?.manual ? mouth.shape || "neutral" : mouthShapeForMood(mood);
    }

    function mouthPoseFor(shape) {
      return Robot790MouthContract.mouthPoseFor(shape);
    }

    function mouthTopologyFor(shape) {
      if (shape === "sleep") return "sleep";
      if (shape === "o") return "o";
      return "mouth";
    }

    function activeSpeechMouth(mouth) {
      const speech = mouth?.speech || {};
      if (!speech.active) return null;
      const shape = String(speech.shape || "open").toLowerCase();
      const allowed = new Set(["closed", "small", "open", "wide", "round", "teeth"]);
      return {
        shape: allowed.has(shape) ? shape : "open",
        energy: clamp(Number(speech.energy ?? mouth.energy ?? 0.55) || 0.55, 0, 1),
        seq: Number(speech.seq || 0)
      };
    }

    function speechMouthPose(shape, energy, basePose) {
      const targets = {
        closed: { open: 0.03, width: 0.55, curve: 0.08, skew: 0, teeth: 0, tension: 0.20, slant: 0, upperLift: 0 },
        small: { open: 0.26, width: 0.44, curve: 0.04, skew: 0, teeth: 0, tension: 0.18, slant: 0, upperLift: 0 },
        open: { open: 0.58, width: 0.52, curve: -0.02, skew: 0, teeth: 0.04, tension: 0.14, slant: 0, upperLift: 0 },
        wide: { open: 0.34, width: 0.88, curve: 0.10, skew: 0, teeth: 0.12, tension: 0.28, slant: 0, upperLift: 0 },
        round: { open: 0.66, width: 0.22, curve: -0.06, skew: 0, teeth: 0, tension: 0.04, slant: 0, upperLift: 0 },
        teeth: { open: 0.18, width: 0.78, curve: 0.02, skew: 0, teeth: 0.82, tension: 0.78, slant: 0, upperLift: 0 }
      };
      const target = targets[shape] || targets.open;
      const mix = clamp(0.72 + energy * 0.18, 0.72, 0.90);
      const pose = {};
      for (const key of mouthPoseKeys) {
        pose[key] = Number(basePose[key] || 0) * (1 - mix) + Number(target[key] || 0) * mix;
      }
      pose.curve = Number(basePose.curve || 0) * 0.34 + Number(target.curve || 0) * 0.66;
      pose.skew = Number(basePose.skew || 0) * 0.28 + Number(target.skew || 0) * 0.72;
      pose.upperLift = Number(basePose.upperLift || 0) * 0.25 + Number(target.upperLift || 0) * 0.75;
      return pose;
    }

    function speechRenderShape(shape) {
      if (shape === "round") return "o";
      if (shape === "teeth") return "grimace";
      return "open";
    }

    function renderedMouthShape(mouth, mood) {
      const speech = activeSpeechMouth(mouth);
      return speech ? speechRenderShape(speech.shape) : baseMouthShape(mouth, mood);
    }

    function copyMouthPose(pose) {
      return Object.fromEntries(mouthPoseKeys.map((key) => [key, Number(pose[key] || 0)]));
    }

    function easedPoseForMouth(shape, targetPose, targetTalkLevel, t) {
      const topology = mouthTopologyFor(shape);
      if (!easedMouthPose || !lastMouthEaseAt) {
        easedMouthPose = copyMouthPose(targetPose);
        easedMouthTalkLevel = targetTalkLevel;
        easedMouthTopology = topology;
        easedMouthShape = shape;
        lastMouthEaseAt = t;
        return { pose: copyMouthPose(easedMouthPose), talkLevel: easedMouthTalkLevel };
      }

      const dt = clamp(t - lastMouthEaseAt, 0, 120);
      easedMouthTopology = topology;
      lastMouthEaseAt = t;
      const poseAmount = 1 - Math.exp(-dt / 105);
      const talkAmount = 1 - Math.exp(-dt / 70);
      for (const key of mouthPoseKeys) {
        easedMouthPose[key] = easeToward(easedMouthPose[key], Number(targetPose[key] || 0), poseAmount);
      }
      easedMouthTalkLevel = easeToward(easedMouthTalkLevel, targetTalkLevel, talkAmount);
      easedMouthShape = shape;
      return { pose: copyMouthPose(easedMouthPose), talkLevel: easedMouthTalkLevel };
    }

    function drawRoundRect(x, y, w, h, r, fill, stroke = "", width = 1) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.lineWidth = width;
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }
    }




    function drawHumanMouth(shape, pose, talkLevel, energy, t) {
      humanMouthRenderer.draw(shape, pose, talkLevel, energy, t, {
        x: 0, y: faceLayout.mouthY, width: faceLayout.width, height: faceLayout.mouthH
      });
    }

    function drawRobotMouth(shape, pose, talkLevel, t) {
      const panelX = faceLayout.mouthPadX + faceLayout.mouthOffsetX;
      const panelY = faceLayout.mouthY + 18;
      const panelW = faceLayout.width - faceLayout.mouthPadX * 2;
      const panelH = faceLayout.mouthH - 30;
      const talkMix = clamp(talkLevel * 0.85, 0, 1);
      drawRoundRect(panelX, panelY, panelW, panelH, 24, "#000810");
      drawRoundRect(panelX + 1, panelY + 1, panelW - 2, panelH - 2, 23, "", "#1e7684", 2);
      drawRoundRect(panelX + 8, panelY + 8, panelW - 16, panelH - 16, 18, "", "#0c3a4e", 2);

      const barCount = 13;
      const gap = 8;
      const barW = Math.max(8, (panelW - 54 - gap * (barCount - 1)) / barCount);
      const barsW = barCount * barW + (barCount - 1) * gap;
      const barsX = faceLayout.width / 2 + faceLayout.mouthOffsetX - barsW / 2;
      const barsCy = panelY + panelH / 2;
      for (let i = 0; i < barCount; i += 1) {
        const x = barsX + i * (barW + gap);
        const center = (barCount - 1) * 0.5;
        const pos = center <= 0 ? 0 : (i - center) / center;
        const side = 0.5 + 0.5 * pos;
        let shapeLevel = clamp(0.12 + pose.open * 0.62, 0.06, 0.98);
        if (shape === "smile") shapeLevel = 0.20 + 0.34 * Math.abs(pos);
        else if (shape === "smirk_left") shapeLevel = 0.18 + 0.46 * (1 - side);
        else if (shape === "smirk_right") shapeLevel = 0.18 + 0.46 * side;
        else if (shape === "open") shapeLevel = 0.18 + 0.64 * (1 - Math.abs(pos));
        else if (shape === "wide") shapeLevel = 0.52 + 0.26 * (1 - Math.abs(pos) * 0.35);
        else if (shape === "frown") shapeLevel = 0.34 - 0.18 * Math.abs(pos);
        else if (shape === "grimace") shapeLevel = 0.46 + 0.08 * (i % 2 ? 1 : -1);
        else if (shape === "sneer") shapeLevel = 0.16 + 0.50 * side + 0.10 * (i % 2 ? 1 : 0);
        else if (shape === "sleep") shapeLevel = 0.07;
        else if (shape === "neutral") shapeLevel = 0.16 + 0.08 * (1 - Math.abs(pos));
        const wave = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.009 + i * 0.8));
        const level = clamp(shapeLevel * (1 - talkMix) + Math.max(shapeLevel, wave) * talkMix, 0.03, 1);
        const barH = 10 + (panelH - 42) * level;
        const ySkew = (pose.slant * 9 + pose.skew * 5) * pos;
        const bar = shape === "sneer" ? "#ec6650" : shape === "grimace" ? "#ecdc96" : shape === "frown" ? "#52b4ec" : "#2cdce8";
        const hi = mixColor(bar, "#d2ffff", 0.56);
        drawRoundRect(x, barsCy - barH / 2 + ySkew, barW, barH, barW / 2, bar);
        ctx.strokeStyle = hi;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + barW / 3, barsCy - barH / 2 + 5 + ySkew);
        ctx.lineTo(x + barW / 3, barsCy + barH / 2 - 5 + ySkew);
        ctx.stroke();
      }
      if (shape === "sleep") {
        ctx.strokeStyle = "#2cdce8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(panelX + 44, barsCy);
        ctx.lineTo(panelX + panelW - 44, barsCy);
        ctx.moveTo(panelX + 66, barsCy + 6);
        ctx.lineTo(panelX + panelW - 66, barsCy + 6);
        ctx.stroke();
      }
    }

    function mouthTextFontSize(text, maxWidth, maxHeight, startSize = 36, minSize = 14, fontPrefix = "") {
      let size = startSize;
      while (size > minSize) {
        ctx.font = `${fontPrefix}${size}px ui-monospace, SFMono-Regular, Consolas, monospace`;
        if (ctx.measureText(text).width <= maxWidth && size * 1.25 <= maxHeight) return size;
        size -= 2;
      }
      return minSize;
    }

    function mouthTextItems(mouth = state?.mouth || {}) {
      const items = [];
      const channels = mouth.text_channels || {};
      for (const source of ["eric", "brain2"]) {
        const channel = channels[source] || {};
        const text = String(channel.text || "");
        if (channel.text_active && text) {
          items.push({
            source,
            text,
            mode: String(channel.text_mode || "center").toLowerCase(),
            color: channel.text_color || ""
          });
        }
      }
      if (!items.length && mouth.text_active && mouth.text) {
        const source = String(mouth.text_source || "eric").toLowerCase();
        items.push({
          source: source === "brain2" || source === "brain_2" || source === "b2" ? "brain2" : "eric",
          text: String(mouth.text || ""),
          mode: String(mouth.text_mode || "center").toLowerCase(),
          color: mouth.text_color || ""
        });
      }
      return items;
    }

    function drawMouthText(t, item) {
      const text = String(item?.text || "");
      if (!text) return;

      const isBrain2 = item.source === "brain2";
      const panelX = faceLayout.captionInsetX + faceLayout.mouthOffsetX;
      const panelY = isBrain2 ? faceLayout.brain2CaptionY : faceLayout.ericCaptionY;
      const panelW = faceLayout.width - faceLayout.captionInsetX * 2;
      const panelH = isBrain2 ? faceLayout.brain2CaptionH : faceLayout.ericCaptionH;
      const padX = isBrain2 ? 24 : 18;
      const maxTextW = panelW - padX * 2;
      const maxTextH = panelH - 18;
      const mode = item.mode || "center";
      const startedAt = mouthTextStartedAt[item.source] || 0;
      const flashLit = mode !== "flash" || Math.floor((t - startedAt) / 120) % 2 === 0;

      ctx.save();
      const panelFill = isBrain2 ? "rgba(4, 7, 18, 0.60)" : "rgba(0, 5, 10, 0.90)";
      const panelStroke = isBrain2 ? "rgba(174, 146, 255, 0.54)" : "#164b59";
      drawRoundRect(panelX, panelY, panelW, panelH, isBrain2 ? 18 : 13, panelFill);
      drawRoundRect(panelX + 1, panelY + 1, panelW - 2, panelH - 2, isBrain2 ? 17 : 12, "", panelStroke, isBrain2 ? 1.4 : 2);

      const fontPrefix = isBrain2 ? "italic " : "";
      const fontSize = mode === "marquee"
        ? (isBrain2 ? 22 : 27)
        : mouthTextFontSize(text, maxTextW, maxTextH, isBrain2 ? 24 : 34, isBrain2 ? 13 : 14, fontPrefix);
      ctx.font = `${fontPrefix}${fontSize}px ui-monospace, SFMono-Regular, Consolas, monospace`;
      ctx.textBaseline = "middle";
      ctx.fillStyle = flashLit ? item.color || (isBrain2 ? "#d8cfff" : "#dffcff") : "#263c40";

      const textW = ctx.measureText(text).width;
      const textY = panelY + panelH / 2;
      ctx.beginPath();
      ctx.rect(panelX + padX, panelY + 8, maxTextW, panelH - 16);
      ctx.clip();

      if ((mode === "marquee" || textW > maxTextW) && textW > 0) {
        const travel = textW + panelW + padX * 2;
        const elapsed = Math.max(0, t - startedAt);
        const offset = (elapsed / faceLayout.mouthTextMarqueeMsPerPx) % travel;
        const textX = panelX + panelW - offset;
        ctx.textAlign = "left";
        if (flashLit || mode !== "flash") {
          ctx.fillText(text, textX, textY);
          ctx.fillText(text, textX + travel, textY);
        }
      } else {
        ctx.textAlign = "center";
        if (flashLit || mode !== "flash") {
          ctx.fillText(text, panelX + panelW / 2, textY);
        }
      }
      ctx.restore();
    }

    function drawMouth(t) {
      const mouth = state?.mouth || {};
      const mood = state?.mood || "curious";
      let shape = baseMouthShape(mouth, mood);
      const talking = Boolean(mouth.talking);
      const energy = Number(mouth.energy || 0.45);
      let talkLevel = talking ? clamp((0.72 + 0.28 * Math.sin(t * 0.026)) * energy, 0.08, 1) : 0;
      let targetPose = mouthPoseFor(shape);
      const speech = activeSpeechMouth(mouth);
      if (speech) {
        targetPose = speechMouthPose(speech.shape, speech.energy, targetPose);
        shape = speechRenderShape(speech.shape);
        talkLevel = 0;
      }
      const eased = easedPoseForMouth(shape, targetPose, talkLevel, t);
      const pose = eased.pose;
      if ((mouth.style || "human") === "robot") {
        drawRobotMouth(shape, pose, eased.talkLevel, t);
      } else {
        drawHumanMouth(shape, pose, eased.talkLevel, energy, t);
      }
      for (const item of mouthTextItems(mouth)) drawMouthText(t, item);
    }

    function drawNose(t) {
      const mood = state?.mood || "curious";
      const mouthShape = renderedMouthShape(state?.mouth || {}, mood);
      const director = state?.director && state.director !== "sim" ? state.director : "none";
      const color = state?.status_tint_override
        ? statusTintHex(state?.status_tint, colorForMood(mood))
        : colorForMood(mood);
      const pulse = 0.5 + Math.sin(t * 0.0017) * 0.5;
      const glow = 0.35 + 0.65 * (pulse * pulse * (3 - 2 * pulse));
      const cx = 360;
      const cy = faceLayout.statusY + faceLayout.statusH / 2 - 26;
      ctx.save();
      // Keep the status nose as a compact oval in the browser face.
      const rimRy = 124;
      const rimRx = 148 * 0.88;
      const glowLayers = [
        [42, 0.035],
        [30, 0.055],
        [20, 0.085],
        [12, 0.13]
      ];
      for (const [width, alpha] of glowLayers) {
        ctx.lineWidth = width + glow * 8;
        ctx.strokeStyle = alphaColor(color, alpha + glow * alpha * 0.55);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rimRx, rimRy, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.shadowColor = color;
      ctx.shadowBlur = 18 + glow * 28;
      ctx.lineWidth = 8;
      ctx.strokeStyle = mixColor(color, "#ffffff", 0.34);
      ctx.beginPath();
      ctx.ellipse(cx, cy, rimRx, rimRy, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 2;
      ctx.strokeStyle = mixColor(color, "#ffffff", 0.12);
      ctx.beginPath();
      ctx.ellipse(cx, cy, rimRx - 9, rimRy - 8, 0, 0, Math.PI * 2);
      ctx.stroke();
      drawEllipse(cx, cy, rimRx - 26, rimRy - 22, "rgba(5, 18, 24, 0.80)");
      ctx.restore();
      ctx.fillStyle = "#d9f7f4";
      ctx.font = "34px ui-monospace, SFMono-Regular, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(mood.slice(0, 12), cx, cy - 50);
      ctx.fillStyle = "#91d6e2";
      ctx.font = "34px ui-monospace, SFMono-Regular, Consolas, monospace";
      ctx.fillText(String(mouthShape || "neutral").slice(0, 12), cx, cy - 6);
      ctx.fillStyle = "#b4e0d6";
      ctx.font = "34px ui-monospace, SFMono-Regular, Consolas, monospace";
      ctx.fillText(String(director).slice(0, 12), cx, cy + 34);
      ctx.fillStyle = "#6eb8c8";
      ctx.font = "22px ui-monospace, SFMono-Regular, Consolas, monospace";
      ctx.fillText("sim", cx, cy + 82);
    }

    function fittedImageRect(image, x, y, w, h, fit = "contain") {
      const iw = image.naturalWidth || image.width || 1;
      const ih = image.naturalHeight || image.height || 1;
      const scale = fit === "cover" ? Math.max(w / iw, h / ih) : Math.min(w / iw, h / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      return {
        x: x + (w - dw) / 2,
        y: y + (h - dh) / 2,
        w: dw,
        h: dh
      };
    }

    function drawFacePaint(t) {
      if (!facePaint.active) return;
      if (facePaint.expiresAt > 0 && t >= facePaint.expiresAt) {
        facePaint = emptyFacePaint();
        return;
      }
      ctx.save();
      if (!facePaint.imageReady || !facePaintImage.complete || !facePaintImage.naturalWidth) {
        const y = 128;
        ctx.fillStyle = "rgba(94, 234, 212, 0.08)";
        ctx.fillRect(26, y, canvas.width - 52, canvas.height - y - 30);
        ctx.restore();
        return;
      }
      ctx.globalAlpha = facePaint.opacity;
      if (facePaint.target === "nose") {
        const cx = 360;
        const cy = faceLayout.statusY + faceLayout.statusH / 2 - 26;
        const rx = 115 * 0.8;
        const ry = 93;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.clip();
        const rect = fittedImageRect(facePaintImage, cx - rx, cy - ry, rx * 2, ry * 2, facePaint.fit);
        ctx.drawImage(facePaintImage, rect.x, rect.y, rect.w, rect.h);
        ctx.restore();
        ctx.save();
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(126, 255, 235, 0.75)";
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx + 4, ry + 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        return;
      }
      const x = 22;
      const y = 126;
      const w = canvas.width - x * 2;
      const h = canvas.height - y - 24;
      const rect = fittedImageRect(facePaintImage, x, y, w, h, facePaint.fit);
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.fillStyle = "#020407";
      ctx.fillRect(x, y, w, h);
      ctx.drawImage(facePaintImage, rect.x, rect.y, rect.w, rect.h);
      ctx.restore();
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(126, 255, 235, 0.38)";
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      ctx.restore();
    }

    function draw() {
      const t = performance.now();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, "#111922");
      bg.addColorStop(1, "#020407");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(faceLayout.width / 2, 0);
      ctx.scale(faceRenderXScale, 1);
      ctx.translate(-faceLayout.width / 2, 0);
      ctx.fillStyle = "rgba(94, 234, 212, 0.04)";
      ctx.beginPath();
      ctx.ellipse(360, 520, 314, 386, 0, 0, Math.PI * 2);
      ctx.fill();
      drawGpuStrip(t);
      const eyeScale = faceLayout.eyeW / firmwareEye.width;
      drawEye(faceLayout.eyePadX + faceLayout.eyeW / 2, faceLayout.eyeBandY + faceLayout.eyeH / 2, true, t, eyeScale);
      drawEye(faceLayout.width - faceLayout.eyePadX - faceLayout.eyeW / 2, faceLayout.eyeBandY + faceLayout.eyeH / 2, false, t, eyeScale);
      drawMouth(t);
      drawNose(t);
      drawFacePaint(t);
      ctx.restore();
      if (!state || performance.now() - lastStateAt > 1200) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
        ctx.font = "18px ui-monospace, SFMono-Regular, Consolas, monospace";
        ctx.textAlign = "center";
        ctx.fillText("waiting for /state", 360, 920);
      }
      requestAnimationFrame(draw);
    }

    moodSelect.addEventListener("change", () => post("/mood", { name: moodSelect.value }));
    mouthSelect.addEventListener("change", () => post("/mouth", { shape: mouthSelect.value }));
    styleSelect.addEventListener("change", () => post("/style", { name: styleSelect.value }));
    eyeModeSelect.addEventListener("change", () => post("/style", { eye_mode: eyeModeSelect.value }));
    gazeX.addEventListener("input", () => post("/gaze", { x: Number(gazeX.value), y: Number(gazeY.value) }));
    gazeY.addEventListener("input", () => post("/gaze", { x: Number(gazeX.value), y: Number(gazeY.value) }));
    talkingButton.addEventListener("click", () => post("/mouth", { talking: !state?.mouth?.talking, shape: state?.mouth?.shape || "open" }));
    releaseButton.addEventListener("click", () => post("/release"));
    recordFaceButton.addEventListener("click", () => {
      if (faceRecorder && faceRecorder.state === "recording") stopFaceRecording();
      else startFaceRecording();
    });
    captureToEyeButton.addEventListener("click", () => {
      captureFaceToEye().catch((error) => setCaptureStatus(`mirror failed: ${error.message}`, "bad"));
    });
    stsUrlInput.addEventListener("change", () => {
      stsUrlInput.value = normalizedStsUrl();
      localStorage.setItem(stsUrlStorageKey, stsUrlInput.value);
    });

    fillSelect(moodSelect, moods);
    fillSelect(mouthSelect, mouths);
    fillSelect(styleSelect, styles);
    fillSelect(eyeModeSelect, eyeModes);
    stsUrlInput.value = normalizedStsUrl(localStorage.getItem(stsUrlStorageKey) || stsUrlInput.value);
    updateRecordFaceButton();
    pollState();
    refreshGpuStatusQuietly();
    startFaceCommandPolling();
    setInterval(updateRecordFaceButton, 1000);
    draw();
  </script>
</body>
</html>
