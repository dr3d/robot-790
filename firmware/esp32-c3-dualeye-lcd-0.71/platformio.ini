[platformio]
default_envs = esp32-c3-dualeye-smoke

[env:esp32-c3-dualeye-smoke]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; ESP32-C3 SuperMini-class target: native USB serial/JTAG and 4 MB flash.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  ; 1.6.1 predates the Arduino-ESP32 3.x-only periman header.
  moononournation/GFX Library for Arduino@1.6.1

[env:esp32-c3-dualeye-ota]
extends = env:esp32-c3-dualeye-smoke
upload_protocol = espota
upload_port = esp32-c3-dualeye.local
