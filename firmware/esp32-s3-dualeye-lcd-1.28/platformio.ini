[platformio]
default_envs = esp32-s3-dualeye-smoke

[env:esp32-s3-dualeye-smoke]
platform = espressif32
; Generic R8N16 definition matches the attached S3's 16 MB QIO flash / 8 MB OPI PSRAM.
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  ; Known-good with this PlatformIO Arduino-ESP32 2.x framework.
  moononournation/GFX Library for Arduino@1.4.7

[env:esp32-s3-dualeye-ota]
extends = env:esp32-s3-dualeye-smoke
upload_protocol = espota
upload_port = esp32-s3-dualeye.local
