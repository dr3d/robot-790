[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-790"
version = "0.1.0"
description = "Daemon-driven animatronic robot platform inspired by LEXX 790."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.9.1",
  "httpx>=0.28.1",
  "pychromecast>=14.0.10",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
realtime = [
  "speech-to-speech",
]
tts = [
  "fastapi>=0.139.0",
  "numpy>=2.0",
  "pydantic>=2.0",
  "qwen-tts",
  "uvicorn[standard]>=0.49.0",
]
dev = [
  "fastapi>=0.139.0",
  "numpy>=2.0",
  "pydantic>=2.0",
  "pytest",
  "ruff",
  "mypy",
  "uvicorn[standard]>=0.49.0",
]

[project.scripts]
robot-790d = "robot_790d.cli:main"
robot-790-realtime = "robot_790d.realtime_entry:main"
robot-790-face-sim = "robot_790d.face_sim_server:main"
robot-790-qwen-tts = "robot_790_tts.server:main"
robot-790-qwen-smoke = "robot_790_tts.smoke_synthesize:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 119
exclude = [".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src/", "tests/"]
strict = true
ignore_missing_imports = true
